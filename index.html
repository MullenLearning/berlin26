  if(rawT>=0&&rawT<=RACE_IDX&&rawT%7===6&&new Date().getHours()>=16) // Sunday evening: the week's chapter
    note+='<div class="banner" style="display:flex;gap:8px;align-items:center"><span style="flex:1">The week is in the books.</span><button class="btn3" data-action="wrapped" style="color:var(--long);flex:none">Week wrapped</button></div>';

  let widgets='';
  widgetConfig().forEach(w=>{
    if(!w.on)return;
    const d=WIDGET_DEFS.find(x=>x.id===w.id);
    widgets+=d.render();
  });

  return '<div><div style="margin-bottom:12px">'+skinSwitcher()+'</div><div class="todayhead"><div class="spread" style="align-items:flex-start">'
    +'<div><h1>'+longDate(todayIdx)+'</h1>'
    +'<div class="sub">Week '+(e.w+1)+' of 16 · '+e.wk.phase+' phase'+(RACE_IDX-todayIdx>0?' · '+(RACE_IDX-todayIdx)+' days to Berlin':' · RACE DAY')+'</div></div>'
    +'<button class="btn3" data-action="editwidgets" aria-haspopup="dialog" style="margin-top:6px">Edit</button></div>'
    /* the blue line: position along the 112-day course to Berlin — taps open the city */
    +'<button class="course" data-action="cityopen" aria-label="Day '+(todayIdx+1)+' of 112 — open the Berlin course" style="display:block;width:100%;border:none;padding:0;cursor:pointer"><i style="width:'+Math.round(todayIdx/RACE_IDX*100)+'%"></i></button></div>'
    +(morningLine()?'<p class="note" style="margin:10px 2px 0">'+morningLine()+'</p>':'')
    +(function(){const pd=patternScan();return (pd&&pd.eff)?'<p class="note" style="margin:8px 2px 0;color:var(--txt2)"><b>Noticed:</b> '+esc(pd.text)+'</p>':'';})()
    +note
    +widgets
    +'</div>';
}

/* Race pack — splits, gel schedule, carb-load — pure rendering from the baked
   race plan + latest weight. Shown on Today in race week and on Training W16. */
function racePack(){
  const lw=latestWeight();
  const kg=(lw?lw.lb:189)/2.2046;
  const bands=[[0,10,301],[10,30,297],[30,37,296.5],[37,42.195,297]]; // s/km midpoints of the plan's pacing bands
  const tAt=km=>{let s=0;for(const b of bands){if(km<=b[0])break;s+=(Math.min(km,b[1])-b[0])*b[2];}return s;};
  const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+p2(mm)+':'+p2(x);};
  let splits='';
  [[5,'5 km'],[10,'10 km'],[15,'15 km'],[20,'20 km'],[21.0975,'Half'],[25,'25 km'],[30,'30 km'],[35,'35 km'],[40,'40 km'],[42.195,'Finish']].forEach(r=>{
    splits+='<tr'+(r[1]==='Finish'?' style="font-weight:700"':'')+'><td>'+r[1]+'</td><td class="num right">'+fmtT(tAt(r[0]))+'</td></tr>';
  });
  let gels='';
  for(let k=5;k<=40;k+=5)gels+=(k>5?' · ':'')+'<b class="num">'+k+'k</b> '+fmtT(tAt(k));
  return '<section class="card">'
    +'<div class="spread"><h2 style="margin:0">Race pack · Berlin</h2><span class="chip neutral">goal '+fmtT(tAt(42.195))+'</span></div>'
    +'<p class="note" style="margin:8px 0 0">Even pacing per the plan: 0–10k @ 5:00–5:02 · 10–30k @ 4:56–4:58 · 30–37k @ 4:55–4:58 · 37k+ ≤4:57.</p>'
    +'<div class="scroll-x" style="margin-top:8px"><table style="min-width:200px"><thead><tr><th>Split</th><th class="right">Clock</th></tr></thead><tbody>'+splits+'</tbody></table></div>'
    +'<h2 style="margin:16px 0 6px">Gels — every 5 km from 5 km</h2>'
    +'<p class="note num" style="margin:0">'+gels+'</p>'
    +'<p class="mini" style="margin:6px 2px 0">1 gel ≈ 25 g carbs → ~60 g/hr at this spacing; add chews at aid stations to reach 75–90 g/hr.</p>'
    +'<h2 style="margin:16px 0 6px">Carb-load · Thu–Sat race week</h2>'
    +'<p class="note" style="margin:0">8–10 g/kg/day ≈ <b class="num">'+Math.round(kg*8)+'–'+Math.round(kg*10)+' g carbs/day</b> at '+(lw?'your latest weight':'race-target weight')+'. Protein stays 185 g; fat fills the rest.</p>'
    +'<h2 style="margin:16px 0 6px">Race morning</h2>'
    +'<p class="note" style="margin:0">Wake −3h · breakfast 100–150 g carbs −3h · sip 500 ml with electrolytes · caffeine −60 min · corral −30 min · gel on the start line.</p>'
    +'</section>';
}

/* Day cards are display-first (Luke's call, 12 Jun): runs arrive from Strava,
   so the card shows the plan and, once imported, the result. No inline entry —
   the log sheet (long-press / run sheet → Edit manually) is the manual
   fallback. Rest days just happen: no status, nothing to track. */
function dayCard(i){
  const e=eff(i),l=sessLog(e.id)||{};
  const isToday=i===rawT;
  const isRest=e.zone==='Rest'&&e.km<=0;
  let body='';
  if(l.status&&!isRest){
    const meta=resultMeta(l);
    const ab=i<rawT?absorption(i):null; // did the night after bank it?
    body='<div class="row" style="margin-top:10px">'
      +'<span class="chip '+(l.status==='done'?'c-easy':l.status==='partial'?'c-long':'c-hard')+'">'+(l.status==='done'?'Done':l.status==='partial'?'Partial':'Missed')+'</span>'
      +logChips(l)+(ab?'<span class="chip '+ab.cls+'">'+ab.label+'</span>':'')+'</div>'
      +(meta?'<p class="mini" style="margin:6px 2px 0">'+meta+'</p>':'')
      +runVisual(l,i);
    if((e.zone==='Long'||e.zone==='Marathon')&&l.status==='done'&&fuelRate(l)==null)
      body+='<button class="btn3" data-action="logsheet" data-i="'+i+'" style="margin-top:8px">Log fuelling (g/hr)</button>';
  }else if(!isRest&&i<rawT){
    body='<div class="row" style="margin-top:10px">'
      +'<button class="btn3" data-action="missed" data-i="'+i+'">Missed?</button>'
      +'<span class="mini" style="color:var(--sub)">imports from Strava on sync</span></div>';
  }
  return '<section class="card" id="day-'+i+'" data-day="'+(i%7)+'" data-lp>'
    +'<div class="spread"><div class="row">'
    +'<b>'+shortDate(i)+'</b>'+(isToday?'<span class="chip c-blue">Today</span>':'')
    +zoneChip(e)+movedChip(e)
    +'</div><button class="btn3" data-action="movestart" aria-haspopup="dialog" data-i="'+i+'">Move</button></div>'
    +'<div style="font-weight:700;font-size:15px;margin-top:5px">'+headline(e)+'</div>'
    +(paceLine(e)?'<div class="pace">'+paceLine(e)+'</div>':'')
    +rebalLine(e)
    +'<p class="detail" style="font-size:13px;color:var(--sub)">'+esc(e.text)+'</p>'
    +'<div class="row" style="margin-top:8px"><span class="chip c-'+DAYTYPE[e.type].c+'">'+DAYTYPE[e.type].label+' · '+fmtKcal(e.kcal)+' kcal</span></div>'
    +body
    +'</section>';
}

function vTrain(){

    +'<section class="card"><h2>Weekly volume — planned vs actual</h2><div class="svgwrap">'+volumeChart()+'</div></section>'
    +'<div style="margin-top:14px">'+chips+'</div>'
    +'<section class="card" data-lp data-qa="week" data-w="'+w+'"><div class="spread"><h2 style="margin:0">Week '+wk.n+' · '+wk.phase+'</h2><span class="pill '+stCls+'">'+stLbl+'</span></div>'

    +'<p class="mini" style="margin:8px 2px 0">Hit ≥90% of target · Partial ≥60% · tap a week to load its sessions.</p></section>'

/* The day card: one thing per line. Plan vs ate are kept distinct — "Edit plan
   target" (future intent, demoted) vs "Log what I ate" (the bright fact). A day
   reads in one of three states: logged · estimate (past/today, not logged) · future. */
function nutDayCard(i){
  const e=eff(i),t=clamp(rawT,0,RACE_IDX),past=i<=t,ea=eaten(i),b=dayBurn(i),real=ateLogged(i),acc=!!ea.accepted;
  // ROW1: date + the demoted "edit plan" link (future/today only — you can't re-plan the past)
  const planLink=i>=rawT?'<button class="btn3" data-action="nutadjust" data-i="'+i+'" aria-haspopup="dialog" style="padding:4px 8px;color:var(--sub)">Edit plan target</button>':'';
  let head='<div class="spread"><b>'+longDate(i)+'</b>'+planLink+'</div>'
    +(movedChip(e)?'<div class="row" style="margin-top:4px">'+movedChip(e)+'</div>':'');
  // ROW2: the hero number — what was eaten (logged) / plan (estimate or locked) / planned (future)
  let hero,logBtn='';
  if(real){
    const over=ea.kcal-e.kcal;
    hero='<div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="hero num">'+fmtKcal(ea.kcal)+'</span>'
      +'<span class="sub" style="font-weight:600">kcal eaten</span><span class="chip c-blue" style="margin-left:auto">Ate</span></div>'
      +'<p class="mini" style="margin:4px 2px 0">plan '+fmtKcal(e.kcal)+(Math.abs(over)>=25?' · '+(over>0?'+':'−')+fmtKcal(Math.abs(over))+(over>0?' over':' under'):' · on plan')+'</p>';
  }else if(past){
    hero='<div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="hero num" style="color:var(--sub)">'+fmtKcal(e.kcal)+'</span>'
      +'<span class="sub" style="font-weight:600">kcal · '+(acc?'locked at plan':'plan estimate')+'</span></div>';
  }else{
    hero='<div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="hero num">'+fmtKcal(e.kcal)+'</span><span class="sub" style="font-weight:600">kcal planned</span></div>';
  }
  // the bright primary action (past/today only): log, or edit a logged value — expands a ruler in place
  if(past){
    if(ui.ateOpen===i){
      const lo=Math.max(800,e.kcal-700),start=Math.round(real?ea.kcal:(lastAte(i)||e.kcal));
      logBtn='<div style="margin-top:12px">'+rulerHTML('ater',lo,e.kcal+900,25,clamp(start,lo,e.kcal+900),'kcal',250,0)+'</div>'
        +'<div class="loggrid" style="margin-top:12px"><button class="btn2" data-action="atecancel">Cancel</button><button class="btn" data-action="atesave" data-i="'+i+'">Save</button></div>'
        +(real?'<button class="btn3" data-action="ateclear" data-i="'+i+'" style="width:100%;margin-top:8px;color:var(--sub)">Back to plan estimate</button>':'');
    }else{
      logBtn='<button class="btn" style="width:100%;margin-top:12px" data-action="ateopen" data-i="'+i+'">'+(real?'Ate '+fmtKcal(ea.kcal)+' · edit':'Log what I ate')+'</button>';
    }
  }
  // ROW: verdict + coach line from burn
  let verdict='';
  if(b.burned!=null){
    const def=b.burned-ea.kcal,onp=Math.abs(def-e.deficit)<=200;
    const tag=real?'':' est';
    verdict='<div class="row" style="margin-top:10px"><span class="chip neutral">burned '+fmtKcal(b.burned)+'</span>'
      +'<span class="chip '+(onp?'c-easy':(def>e.deficit?'c-easy':'c-long'))+'">'+(def>=0?'−':'+')+fmtKcal(Math.abs(def))+' deficit'+tag+'</span></div>'
      +'<p class="mini" style="margin:6px 2px 0">plan −'+fmtKcal(e.deficit)+(Math.abs(def-e.deficit)<25?' · on plan':'')+'</p>';
    // the "calories left" coach line, before logging, today/past
    if(!real){
      const eatToPlan=b.burned-e.deficit;
      verdict+='<p class="note" style="margin:8px 0 0">Burned '+fmtKcal(b.burned)+' so far — eat up to <b>'+fmtKcal(Math.max(0,eatToPlan))+'</b> to hit today’s −'+fmtKcal(e.deficit)+'.</p>';
    }
  }
  return '<section class="card">'+head+hero+logBtn+verdict+'</section>';
}

/* The week as a running budget: banked-so-far vs plan, on-pace projection,
   and the claw-back target if behind. Apples-to-apples — elapsed days only. */
function weekLedger(w){
  const t=clamp(rawT,0,RACE_IDX);
  let banked=0,planElapsed=0,weekPlanTot=0,estN=0,logN=0;const future=[];
  for(let d=0;d<7;d++){
    const i=w*7+d,e=eff(i);
    if(i>t){if(i!==RACE_IDX){future.push(i);weekPlanTot+=e.deficit;}continue;} // exclude race day from the projection day-set
    weekPlanTot+=e.deficit;
    const b=dayBurn(i);
    if(b.burned!=null){banked+=b.burned-eaten(i).kcal;planElapsed+=e.deficit;ateLogged(i)?logN++:estN++;} // accepted-at-plan counts as est-grade label
  }
  let planLeft=0,burnLeft=0;future.forEach(i=>{planLeft+=eff(i).deficit;burnLeft+=eff(i).burn;});
  const need=weekPlanTot-banked; // deficit still required to hit the week's plan
  const eatTarget=future.length?Math.round((burnLeft-need)/future.length):null; // avg kcal/day to land on plan
  // is hitting the week's plan still physically possible? remaining days floored at 1600 kcal/day
  const maxRecoverable=burnLeft-future.length*1600; // most deficit the rest of the week can bank without starving
  const achievable=future.length?need<=maxRecoverable+1:true;
  return {w:w,banked:Math.round(banked),weekPlanTot:Math.round(weekPlanTot),
    onPace:Math.round(banked+planLeft),ahead:Math.round(banked-planElapsed),
    futureN:future.length,future:future,eatTarget:eatTarget,achievable:achievable,estN:estN,logN:logN,counted:logN+estN};
}
/* projected date to reach race weight, from the actual banked-deficit pace */
function raceWeightDate(){
  const twn=trendWeight(),lwn=latestWeight();
  const cur=twn?twn.lb:(lwn?lwn.lb:null);
  if(cur==null||cur<=189)return null;
  const t=clamp(rawT,0,RACE_IDX);
  let banked=0,days=0;
  for(let i=Math.max(0,t-13);i<=t;i++){const b=dayBurn(i);if(b.burned!=null){banked+=b.burned-eaten(i).kcal;days++;}}
  if(days<3||banked<=0)return null;
  const perDay=banked/days; // kcal/day, recent
  const need=(cur-189)*3500/perDay; // days to go
  if(!isFinite(need)||need<=0||need>400)return null;
  const idx=t+Math.round(need);
  return {idx:idx,daysToGo:Math.round(need),beforeRace:RACE_IDX-idx};
}
/* honesty: how much of the counted block is logged fact vs plan estimate */
function cutHonesty(){
  const t=clamp(rawT,0,RACE_IDX);let log=0,acc=0,est=0;
  for(let i=0;i<=t;i++){const b=dayBurn(i);if(b.burned!=null){if(ateLogged(i))log++;else if(weekLocked(Math.floor(i/7)))acc++;else est++;}}
  return {log:log,acc:acc,est:est,total:log+acc+est};
}

/* "The cut": today, this week, and the whole block — actual deficits banked
   vs the plan, cross-checked against what the scale trend says. */
function cutCard(){
  const t=clamp(rawT,0,RACE_IDX);
  let total=0,planCounted=0,days=0;
  for(let i=0;i<=t;i++){
    const b=dayBurn(i);
    if(b.burned!=null){total+=b.burned-eaten(i).kcal;planCounted+=eff(i).deficit;days++;}
  }
  if(!days)
    return '<section class="card"><div class="spread"><h2>The cut</h2><span class="chip neutral">no data yet</span></div>'
      +'<p class="note" style="margin:8px 0 0">Connect Oura on the Training tab and the banked deficit starts counting here.</p></section>';
  const lb=total/3500;
  const first=S.weights.length?S.weights[0]:null,twn=trendWeight(),lwn=latestWeight();
  const cur=twn?twn.lb:(lwn?lwn.lb:null);
  const scale=(first&&cur!=null)?first.lb-cur:null;
  const ratio=planCounted>0?total/planCounted:null;
  const chip=ratio==null?'<span class="chip neutral">counting</span>'
    :ratio>=1.1?'<span class="chip c-easy">ahead</span>'
    :ratio>=0.9?'<span class="chip c-easy">on track</span>'
    :ratio>=0.6?'<span class="chip c-long">behind</span>'
    :'<span class="chip c-hard">well behind</span>';
  // the scale is the reality check — show it once, as confirmation or (if it diverges) the tie-breaker
  let scaleLine='';
  if(scale!=null){
    scaleLine=Math.abs(scale-lb)<=1.5
      ?'<p class="note" style="margin:8px 0 0">Scale agrees — '+fmtLb(Math.abs(scale))+' lb '+(scale>=0?'down':'up')+' on the trend.</p>'
      :'<p class="note" style="margin:8px 0 0">Scale says '+fmtLb(Math.abs(scale))+' lb '+(scale>=0?'down':'up')+' — trust the scale over the banked figure.</p>';
  }
  // honesty: only when there's something to flag (estimates/locked); a fully-logged block needs no caveat
  const hon=cutHonesty();
  const honTxt=(hon.log===0&&hon.acc===0)?'All '+hon.total+' counted days assume plan — log a day to make it real.'
    :(hon.est>0||hon.acc>0)?hon.log+' of '+hon.total+' days logged'+(hon.acc?', '+hon.acc+' locked at plan':'')+(hon.est?', '+hon.est+' assume plan':'')+'.'
    :'';
  return '<section class="card"><div class="spread"><h2>The cut</h2>'+chip+'</div>'
    +'<div class="row" style="align-items:baseline;gap:6px"><span class="hero num">'+(total>=0?'−':'+')+fmtKcal(Math.abs(total))+'</span>'
    +'<span class="sub" style="font-weight:600">kcal banked ≈ '+(lb>=0?'':'+')+fmtLb(Math.abs(lb))+' lb lost</span></div>'
    +scaleLine
    +(honTxt?'<p class="mini" style="margin:10px 2px 0">'+honTxt+'</p>':'')
    +'</section>';
}

/* cumulative deficit: the plan's line for the whole block, the actual line as it grows */
function deficitChart(){
  const W=360,H=150,L=34,Rm=4,T=10,B=20,ih=H-T-B,iw=W-L-Rm;
  const t=clamp(rawT,0,RACE_IDX);
  let planTot=0;const plan=[];
  for(let i=0;i<=RACE_IDX;i++){planTot+=eff(i).deficit;plan.push(planTot);}
  let actTot=0,logTot=0,anyLog=false;const act=[],logged=[];
  for(let i=0;i<=t;i++){
    const b=dayBurn(i);
    if(b.burned!=null){const ea=eaten(i);actTot+=b.burned-ea.kcal;if(ateLogged(i)){logTot+=b.burned-ea.kcal;anyLog=true;}}
    act.push(actTot);logged.push(logTot);
  }
  const max=Math.max(planTot,actTot,3500)*1.05;
  const X=i=>L+iw*i/RACE_IDX,Y=v=>T+ih*(1-Math.max(v,0)/max);
  let g='';
  for(let v=17500;v<max;v+=17500){ // gridlines every 5 lb of deficit
    g+='<line class="gridline" x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-Rm)+'" y2="'+Y(v)+'"/>'
      +'<text class="axis" x="'+(L-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+Math.round(v/3500)+'lb</text>';
  }
  g+='<path d="'+plan.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="var(--sub)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>';
  // actual incl. estimated days (faint) — and the logged-only spine (solid) once any day is logged
  if(act.length>1)g+='<path d="'+act.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="'+(anyLog?1.2:2)+'" opacity="'+(anyLog?0.4:1)+'" stroke-linejoin="round"/>';
  if(anyLog)g+='<path d="'+logged.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  [0,4,8,12].forEach(w=>{g+='<text class="axis" x="'+X(w*7+3.5)+'" y="'+(H-7)+'" text-anchor="middle">W'+(w+1)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative deficit, actual versus plan">'+g+'</svg>';
}

/* the week budget strap: where this week's deficit stands, claw-back, opt-in rebalance, lock */
function weekStrap(w){
  const lg=weekLedger(w),t=clamp(rawT,0,RACE_IDX),isCur=w===Math.floor(t/7),isPast=w<Math.floor(t/7);
  if(!lg.counted)
    return '<p class="mini" style="margin:8px 2px 0">Week '+(w+1)+' plan: −'+fmtKcal(lg.weekPlanTot)+' deficit.</p>';
  const aheadWord=lg.ahead>=250?'ahead':lg.ahead<=-250?'behind':'on track';
  const chipCls=lg.ahead<=-250?'c-hard':'c-easy';
  const behindRecoverable=lg.ahead<=-250&&lg.futureN&&lg.achievable;
  const est=lg.estN>0?' ('+lg.estN+' est)':'';
  // the chip carries ahead/behind; the line states the banked figure (+ on-pace while days remain). No restated advice.
  let s='<div class="spread" style="margin:8px 2px 0;align-items:center"><b>'+(isCur?'This week':'Week '+(w+1))+'</b>'
    +'<span class="chip '+chipCls+'">'+(lg.ahead>=0?'+':'−')+fmtKcal(Math.abs(lg.ahead))+' '+aheadWord+'</span></div>'
    +'<p class="note" style="margin:4px 2px 0">'+(lg.banked>=0?'−':'+')+fmtKcal(Math.abs(lg.banked))+' banked'+est
    +(isCur&&lg.futureN?' · on pace for −'+fmtKcal(lg.onPace):'')+'.</p>';
  if(behindRecoverable&&lg.eatTarget!=null&&lg.eatTarget>=800)
    s+='<p class="mini" style="margin:4px 2px 0">Eat ≤'+fmtKcal(lg.eatTarget)+'/day the rest of the week to still land on −'+fmtKcal(lg.weekPlanTot)+'.</p>';
  if(Math.abs(lg.ahead)>500&&lg.futureN&&lg.achievable)
    s+='<button class="btn3" data-action="rebalweek" data-w="'+w+'" style="margin-top:4px;color:var(--accent)">Rebalance the rest →</button>';
  if(isPast)
    s+=weekLocked(w)
      ?'<p class="mini" style="margin:6px 2px 0">Locked as fact ✓ · <button class="btn3" data-action="unlockweek" data-w="'+w+'" style="padding:0;color:var(--sub)">unlock</button></p>'
      :(lg.estN>0?'<button class="btn3" data-action="lockweek" data-w="'+w+'" style="margin-top:6px;color:var(--sub)">Lock week as fact ('+lg.estN+' at plan)</button>':'');
  return s;
}

/* Is the cut paying? — verdict and plain next-step first; the weekly numbers behind a tap. */
function cutPayingCard(){
  if(!ouraConnected())return '';
  const cp=cutPaying();
  // nothing to say until there's a verdict or a meaningful weight change — don't show an empty "learning" card
  if(!cp.verdict&&cp.lost<2)return '';
  const word=cp.verdict?cp.verdict.split(' — ')[0]:null;
  const reason=cp.verdict?cp.verdict.split(' — ')[1]:null;
  const todo=word==='paying'?'Hold the cut — it’s working.':word==='costing'?'Ease up: add ~150 kcal on session days.':word==='holding'?'Keep going, recheck next week.':'';
  let table='';
  if(ui.showCutWeeks){
    let rows='';
    cp.weeks.forEach((x,ix)=>{
      const prev=ix>0?cp.weeks[ix-1]:null;
      const efArrow=(prev&&prev.ef!=null&&x.ef!=null)?(x.ef<prev.ef?' ↓':x.ef>prev.ef?' ↑':' ='):'';
      const hvArrow=(prev&&prev.hrv!=null&&x.hrv!=null)?(x.hrv>prev.hrv?' ↑':x.hrv<prev.hrv?' ↓':' ='):'';
      if(x.def==null&&x.ef==null)return;
      rows+='<tr><td>W'+(x.w+1)+'</td><td class="num right">'+(x.def!=null?((x.def>=0?'−':'+')+fmtKcal(Math.abs(x.def))):'–')+'</td>'
        +'<td class="num right">'+(x.ef!=null?Math.round(x.ef)+efArrow:'–')+'</td><td class="num right">'+(x.hrv!=null?Math.round(x.hrv)+hvArrow:'–')+'</td></tr>';
    });
    table='<div class="scroll-x" style="margin-top:8px"><table style="width:100%;min-width:240px"><thead><tr><th>Week</th><th class="right">Deficit</th><th class="right">Cost/km</th><th class="right">HRV</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  return '<section class="card"><div class="spread"><h2>Is the cut paying?</h2>'
    +(word?'<span class="chip '+cp.cls+'">'+word+'</span>':'<span class="chip neutral">learning</span>')+'</div>'
    +(reason?'<p class="note" style="margin:8px 0 0;font-weight:600">'+reason.charAt(0).toUpperCase()+reason.slice(1)+'.</p>':'')
    +(todo?'<p class="mini" style="margin:6px 2px 0">'+todo+'</p>':'')
    +(cp.lost>=2?'<p class="mini" style="margin:6px 2px 0">Down '+fmtLb(cp.lost)+' lb ≈ '+cp.raceSecs+' s faster at Berlin (estimate).</p>':'')
    +(cp.verdict?'<button class="btn3" data-action="cutweeks" aria-expanded="'+(ui.showCutWeeks?'true':'false')+'" style="margin-top:8px;color:var(--sub)">'+(ui.showCutWeeks?'hide the weekly numbers':'show the weekly numbers ›')+'</button>':'')
    +table
    +'</section>';
}

/* The easy daily tracker: today's calorie budget at a glance — burn, target
   deficit, what's eaten, and how many calories are LEFT. Reads eff(today), so
   it always reflects the session currently scheduled for today (move a run and
   the burn/target/deficit shown here move with it). */
function nutTodayHero(){
  const i=clamp(rawT,0,RACE_IDX),e=eff(i),ea=eaten(i),b=dayBurn(i),real=ateLogged(i);
  const burnReal=b.burned!=null,burn=burnReal?b.burned:e.burn;
  const target=Math.max(0,burn-e.deficit);          // calories you can eat and still hit the deficit
  const ek=real?ea.kcal:0,left=target-ek,over=ek>target;
  const pct=target>0?clamp(ek/target*100,0,100):0;
  const heroNum=!real?fmtKcal(target):fmtKcal(Math.abs(left));
  const heroLbl=!real?'kcal to eat today':(left>=0?'kcal left today':'kcal over today');
  const moved=movedChip(e);
  const gauge='<div style="height:16px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:14px">'
    +'<i style="display:block;height:100%;width:'+(real?pct:0)+'%;background:'+(over?'var(--hard)':'var(--accent)')+';border-radius:99px;transition:width .5s var(--ease-out)"></i></div>'
    +'<div class="spread" style="margin-top:5px"><span class="mini">'+(real?fmtKcal(ek)+' eaten':'nothing logged yet')+'</span><span class="mini">'+fmtKcal(target)+' budget</span></div>';
  const stat=(lbl,val,col)=>'<div style="flex:1;text-align:center;padding:0 4px"><div class="num" style="font-size:19px;font-weight:700;color:'+(col||'var(--ink)')+'">'+val+'</div><div class="mini" style="margin-top:2px">'+lbl+'</div></div>';
  const div='<div style="width:1px;background:var(--line);align-self:stretch"></div>';
  const stats='<div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:13px;gap:0">'
    +stat(burnReal?'burned':'plan burn',fmtKcal(burn))+div
    +stat('target deficit','−'+fmtKcal(e.deficit))+div
    +stat('eaten',real?fmtKcal(ea.kcal):'—')+'</div>';
  let logBtn;
  if(ui.ateOpen===i){
    const lo=Math.max(800,e.kcal-700),start=Math.round(real?ea.kcal:(lastAte(i)||e.kcal));
    logBtn='<div style="margin-top:14px">'+rulerHTML('ater',lo,e.kcal+900,25,clamp(start,lo,e.kcal+900),'kcal',250,0)+'</div>'
      +'<div class="loggrid" style="margin-top:12px"><button class="btn2" data-action="atecancel">Cancel</button><button class="btn" data-action="atesave" data-i="'+i+'">Save</button></div>'
      +(real?'<button class="btn3" data-action="ateclear" data-i="'+i+'" style="width:100%;margin-top:8px;color:var(--sub)">Back to plan estimate</button>':'');
  }else{
    logBtn='<button class="btn" style="width:100%;margin-top:14px" data-action="ateopen" data-i="'+i+'">'+(real?'Ate '+fmtKcal(ea.kcal)+' · edit':'Log what I ate')+'</button>';
  }
  return '<section class="card" style="border-color:var(--accent)">'
    +'<div class="spread" style="align-items:flex-start"><div><div class="mini" style="text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700">Today</div><b style="font-size:15px">'+longDate(i)+'</b></div>'
    +'<span class="chip c-'+DAYTYPE[e.type].c+'">'+esc(headline(e))+'</span></div>'
    +(moved?'<div class="row" style="margin-top:7px">'+moved+'<span class="mini" style="color:var(--sub)">fuel moved with the session</span></div>':'')
    +'<div class="row" style="align-items:baseline;gap:8px;margin-top:12px"><span class="hero num" style="color:'+(over?'var(--hard)':'var(--ink)')+'">'+heroNum+'</span><span class="sub" style="font-weight:600">'+heroLbl+'</span></div>'
    +gauge+stats
    +'<p class="mini" style="margin:11px 2px 0">Plan: burn '+fmtKcal(burn)+' − eat '+fmtKcal(target)+' = <b>−'+fmtKcal(e.deficit)+'</b> deficit'+(burnReal?'':' (planned — connect Oura for live burn)')+'.</p>'
    +logBtn
    +'</section>';
}

function vNut(){
  const i=clamp(ui.nutDay,0,RACE_IDX);
  const w=Math.floor(i/7);
  const t=clamp(rawT,0,RACE_IDX);
  let strip='<div class="daystrip" id="nutstrip" data-w="'+w+'">';
  const maxK=Math.max.apply(null,Array.from({length:7},(_,d)=>eff(w*7+d).kcal));
  for(let d=0;d<7;d++){
    const j=w*7+d,e=eff(j);
    const editable=j>=t&&j!==RACE_IDX&&rawT<=RACE_IDX;
    const h=Math.round(10+42*e.kcal/maxK);
    let tick='<div class="ndot" aria-hidden="true"></div>',stateLbl='';
    if(j<=t&&j<=rawT){ // settled (and today's running) deficit tick
      const b=dayBurn(j);
      if(b.burned!=null){
        const d2=b.burned-eaten(j).kcal,onp=Math.abs(d2-e.deficit)<=200;
        // truly-logged days read as a filled accent dot (fact); estimate/accepted keep the green/grey on-plan tick
        tick=ateLogged(j)
          ?'<div class="ndot" aria-hidden="true" style="background:var(--accent);box-shadow:0 0 0 1.5px var(--accent)"></div>'
          :'<div class="ndot" aria-hidden="true" style="background:var('+(onp?'--easy':'--long')+')"></div>';
        stateLbl=ateLogged(j)?', logged '+(d2>=0?'−':'+')+fmtKcal(Math.abs(d2)):', '+(onp?'on plan':'off plan')+' (estimate)';
      }
    }
    strip+='<button data-action="selnutday" data-i="'+j+'" class="'+(j===i?'sel':'')+'"'+(j===i?' aria-current="date"':'')
      +' aria-label="'+DOW[d]+' — '+fmtKcal(e.kcal)+' kcal, '+DAYTYPE[e.type].label+stateLbl+(editable?'. Drag the bar to adjust':'')+'">'
      +'<div class="d" aria-hidden="true">'+DOW[d]+'</div>'
      +'<div class="nbar'+(editable?' ed':'')+'" data-bar="'+j+'" aria-hidden="true"><span class="ndelta"></span><i style="height:'+h+'px;background:var(--'+DAYTYPE[e.type].c+')"></i></div>'
      +'<div class="k num" aria-hidden="true">'+(Math.round(e.kcal/100)/10)+'k</div>'
      +tick
      +'</button>';
  }
  strip+='</div>'+(S.hints&&S.hints.bar?'':'<p class="mini" style="margin:4px 2px 0">Tap a day to inspect · drag a bar to plan a day up or down; the rest of the week rebalances.</p>');
  let chips='<div class="weekchips">';
  for(let j=0;j<16;j++)chips+='<button data-action="selnutweek" data-w="'+j+'" class="'+(j===w?'sel':'')+'"'+(j===w?' aria-current="true"':'')+'>W'+(j+1)+'</button>';
  chips+='</div>';

  return '<div><div style="margin-bottom:12px">'+skinSwitcher()+'</div><h1>Nutrition</h1>'
    +nutTodayHero()
    +'<h2 style="margin:22px 2px 0">Plan the week</h2>'
    +'<div style="margin-top:10px">'+chips+'</div>'
    +weekStrap(w)
    +strip
    +(i!==t?nutDayCard(i):'')
    +cutCard()
    +cutPayingCard()
    +'<section class="card"><h2>Deficit banked</h2><div class="svgwrap">'+deficitChart()+'</div>'
    +'<p class="mini" style="margin:8px 2px 0"><span style="color:var(--accent)">—</span> actual · <span style="color:var(--sub)">┄</span> plan</p></section>'
    +'<button class="btn2" style="width:100%;margin-top:14px" data-action="planopen" aria-haspopup="dialog">Full plan &amp; daily-calorie chart</button>'
    +'</div>';
}

    +'<div class="kpi"><b class="num" style="color:var(--'+(dlt!=null?deltaClass(dlt):'rest')+')">'+(dlt!=null?(dlt>0?'+':'')+fmtLb(dlt):'–')+'</b><span>'+(tw?'trend vs plan':'vs plan')+'</span></div>'
    +'<div class="kpi"><b class="num">'+(tw?fmtLb(Math.max(0,tw.lb-189)):(lw?fmtLb(Math.max(0,lw.lb-189)):'–'))+'</b><span>lb to 189</span></div>'
    +'</div>'

    +'<div class="svgwrap">'+weightChart()+'</div>'
    +'<p class="mini" style="margin:6px 2px 0">Touch the chart to scrub through your weigh-ins.</p></section>'
    +'<section class="card"><h2>Log a weight</h2>'
    +'<div><label class="f" for="wdate">Date</label><input type="date" id="wdate" value="'+todayISO()+'" min="2026-06-08" max="2026-09-27"></div>'
    +(function(){const st=Math.round((lw?lw.lb:planWtAt(clamp(rawT,0,RACE_IDX)))*10)/10;
      return rulerHTML('wtr2',Math.max(120,Math.round(st)-15),Math.min(280,Math.round(st)+15),0.1,st,'lb',1,1);})()
    +'<p class="err" id="wlb-err" role="alert" hidden>Pick a date and a weight between 120 and 280 lb.</p>'

    +'</section>'
    +'<div class="footlinks"><button class="btn3" data-action="export">Back up data</button>'
    +'<button class="btn3" data-action="importpick">Restore backup</button>'

    +'<p class="mini center" style="margin-top:6px">All logs live on this device'+(S.lastBackup?' · last backup '+isoShort(S.lastBackup):' · never backed up')+'.</p>'
    +'</div>';

/* ---------------- 9. Move / swap sheet ---------------- */

function openMoveSheet(i){
  const e=eff(i),w=e.w;
  let rows='';
  for(let d=0;d<7;d++){
    if(d===e.pos)continue;
    const o=eff(w*7+d);
    const ol=sessLog(o.id);
    rows+='<button class="sheetrow" data-action="swap" data-w="'+w+'" data-a="'+e.pos+'" data-b="'+d+'">'
      +'<span class="d">'+DOW[d]+(w*7+d===rawT?'<br><span class="chip c-blue" style="padding:1px 6px;font-size:10px">today</span>':'')+'</span>'
      +'<span class="t"><b style="color:var(--ink)">'+headline(o)+'</b><br>'+DAYTYPE[o.type].label+' · '+fmtKcal(o.kcal)+' kcal'+(ol&&ol.status?' · <b>logged</b>':'')+'</span>'
      +'<span class="chip c-'+(ZONECLR[o.zone]||'rest')+'">'+o.zone+'</span></button>';
  }
  openSheet('<h2 style="margin:0">Move '+DOW[e.pos]+'’s session</h2>'
    +'<p class="note" style="margin:6px 0 2px">'+esc(headline(e))+' — pick a day to swap with. Training <b>and fuelling</b> both follow the move.</p>'
    +rows
    +(weekMoved(w)?'<button class="sheetrow" data-action="resetweek" data-w="'+w+'" style="justify-content:center;color:var(--accent);font-weight:700">Reset week '+(w+1)+' to plan</button>':'')
    +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Cancel</button>');
}
let sheetTimer=null,sheetOpener=null;
function openSheet(html,morphEl,onReady){
  clearTimeout(sheetTimer);
  sheetOpener=document.activeElement;
  const s=document.getElementById('sheet');
  const build=()=>{
    s.innerHTML='<div class="scrim" data-action="closesheet"></div>'
      +'<div class="panel" role="dialog" aria-modal="true" aria-label="Move session" tabindex="-1">'+html+'</div>';
    s.hidden=false;
    document.getElementById('app').inert=true; // keep background out of tab/VoiceOver order
    if(onReady)onReady(); // sheet-content wiring MUST wait for build — in the VT path build runs async
  };
  if(morphEl&&document.startViewTransition&&!REDUCE.matches){ // the card morphs into its sheet (Safari 18+)
    morphEl.style.viewTransitionName='sheetmorph';
    const vt=document.startViewTransition(()=>{
      morphEl.style.viewTransitionName='';
      build();
      s.classList.add('open');
      const p=s.querySelector('.panel');
      p.style.viewTransitionName='sheetmorph';
      p.focus();
    });
    vt.finished.then(()=>{const p=s.querySelector('.panel');if(p)p.style.viewTransitionName='';}).catch(()=>{});
  }else{
    build();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{s.classList.add('open');s.querySelector('.panel').focus();}));
  }
}
function closeSheet(){
  const s=document.getElementById('sheet');
  s.classList.remove('open');
  document.getElementById('app').inert=false;
  clearTimeout(sheetTimer);

const view=document.getElementById('view');
function render(anim){ // anim=true only on navigation — entrances must not replay on in-place updates
  const doRender=()=>{
    const skin=skinReg();
    if(!skinHasTab(ui.tab))ui.tab=skin.defaultTab;
    renderTabBar(skin);
    const screen=skin.screens[ui.tab]||skin.screens[skin.defaultTab];
    view.innerHTML=screen();
    if(anim&&!document.startViewTransition&&view.firstElementChild)view.firstElementChild.classList.add('fade');
    fieldDirty=false; // any full render supersedes a pending field re-render
    bindSwipes();bindLongPress();initRulers();bindNutBars();bindChartScrub();
    window.scrollTo(0,ui.scroll[ui.tab]||0);
  };
  if(anim&&document.startViewTransition&&!REDUCE.matches)document.startViewTransition(doRender);
  else doRender();
}
function bindChartScrub(){ // drag along the weight line, a dot follows with date + trend
  const svg=document.getElementById('wchart');
  if(!svg||svg._scrub||!scrubData||!scrubData.pts.length)return;
  svg._scrub=1;
  const g=()=>svg.querySelector('#scrubg');
  const show=e=>{
    const r=svg.getBoundingClientRect();
    if(!r.width)return;
    const sx=(e.clientX-r.left)*360/r.width;
    let best=null,bd=1e9;
    scrubData.pts.forEach(p=>{const d=Math.abs(p.cx-sx);if(d<bd){bd=d;best=p;}});
    if(!best)return;
    const gr=g();gr.style.display='';
    gr.querySelector('#scrubln').setAttribute('x1',best.cx);
    gr.querySelector('#scrubln').setAttribute('x2',best.cx);
    const dot=gr.querySelector('#scrubdot');
    dot.setAttribute('cx',best.cx);dot.setAttribute('cy',best.cy);
    const tx=gr.querySelector('#scrubtx');
    const tv=trendAt(best.idx);
    tx.setAttribute('x',Math.max(48,Math.min(312,best.cx)));
    tx.setAttribute('y',scrubData.T+2);
    tx.textContent=isoShort(best.iso)+' · '+fmtLb(best.lb)+' lb'+(tv!=null?' · trend '+fmtLb(tv):'');
  };
  svg.addEventListener('pointerdown',e=>{show(e);});
  svg.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')show(e);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{const gr=g();if(gr)gr.style.display='none';}));
}
function rerenderKeepScroll(){
  ui.scroll[ui.tab]=window.scrollY;
  render();
}

function deckSkip(i){
  const e=eff(i);
  const prev=S.sessions[e.id]?Object.assign({},S.sessions[e.id]):null;
  logSession(e.id,{status:'missed',km:0});
  rerenderKeepScroll();
  snack('Skipped · '+headline(e),()=>{
    if(prev)S.sessions[e.id]=prev;else delete S.sessions[e.id];
    save();rerenderKeepScroll();
  });
}
document.addEventListener('swiperight',ev=>{

document.addEventListener('swipeleft',ev=>{

  if(!c)return;

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-action]');
  if(!el){ // tapping a card (not a control inside it): imported runs open their run sheet, everything else the log sheet
    const sc=ev.target.closest('[data-swipe="sess"],[data-swipe="deck"]');
    if(sc&&!ev.target.closest('button,input,select,a')){
      const i3=+sc.dataset.i,l3=sessLog(eff(i3).id);
      if(l3&&l3.status&&l3.source==='strava')openRunSheet(i3);else openLogSheet(i3);
      return;
    }
    const dc=ev.target.closest('#view .card[data-day]'); // Training day cards are display-first — tap-through is the detail/edit path
    if(dc&&dc.id&&!ev.target.closest('button,input,select,a')){
      const i4=+dc.id.slice(4),e4=eff(i4);
      if(e4.zone==='Rest'&&e4.km<=0)return; // rest days have nothing to open
      const l4=sessLog(e4.id);
      if(l4&&l4.status&&l4.source==='strava')openRunSheet(i4);else openLogSheet(i4);
    }
    return;
  }
  const a=el.dataset.action;
  if(a==='tab'){ui.scroll[ui.tab]=window.scrollY;ui.tab=el.dataset.tab;render(true);}
  else if(a==='setskin'){setSkin(el.dataset.v);}
  else if(a==='wfab'){haptic(true);whoopFabSheet();}
  else if(a==='wsleep'){whoopSleepSheet();}
  else if(a==='wrecov'){whoopRecovSheet();}
  else if(a==='wstrain'){whoopStrainSheet();}
  else if(a==='appleday'){appleDaySheet(Number(el.dataset.i));}
  else if(a==='applecat'){appleCatSheet(el.dataset.c);}
  else if(a==='status'){
    const id=el.dataset.sid,st=el.dataset.status,cur=sessLog(id)||{};
    if(cur.status===st){logSession(id,{status:null});} // untoggle clears the status; typed km/pace/note are kept (uncounted until re-logged)
    else{
      const patch={status:st};
      if(st==='done'&&cur.km==null){ // prefill the current (rebalanced) target distance
        const m=id.match(/^w(\d+)d(\d+)$/);
        const wq=Number(m[1])-1,posq=orderOf(wq).indexOf(Number(m[2]));
        patch.km=eff(wq*7+posq).km;
      }
      if(st==='missed'&&cur.km==null)patch.km=0;
      logSession(id,patch);
    }
    rerenderKeepScroll();
  }
  else if(a==='movestart'){openMoveSheet(Number(el.dataset.i));}
  else if(a==='logsheet'){openLogSheet(Number(el.dataset.i));}
  else if(a==='quickdone'){quickLogDone(Number(el.dataset.i));}
  else if(a==='deckskip'){deckSkip(Number(el.dataset.i));}
  else if(a==='msave'){
    const v=readRuler('mruler');
    if(v>=120&&v<=280){
      const prev=S.weights.slice();
      logWeight(todayISO(),Math.round(v*10)/10);
      ui.morning=false;rerenderKeepScroll();
      snack('Logged '+fmtLb(v)+' lb — good morning',()=>{S.weights=prev;save();ui.morning=true;rerenderKeepScroll();});
    }
  }
  else if(a==='mlater'){ui.morning=false;rerenderKeepScroll();}
  else if(a==='rebalsum'){openRebalSummary(Number(el.dataset.w||ui.week));}
  else if(a==='wrapped'){openWrapped();}
  else if(a==='wrapclose'){closeWrapped();}
  else if(a==='wrapsave'){
    wrappedImage().then(blob=>{
      const w=clamp(Math.floor(rawT/7),0,15);
      const name='berlin26-week'+(w+1)+'.png';
      let file=null;
      try{file=new File([blob],name,{type:'image/png'});}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
        navigator.share({files:[file]}).catch(()=>{});
      }else{
        const u=URL.createObjectURL(blob),aEl=document.createElement('a');
        aEl.href=u;aEl.download=name;document.body.appendChild(aEl);aEl.click();
        setTimeout(()=>{URL.revokeObjectURL(u);aEl.remove();},400);
      }
    });
  }
  else if(a==='shstatus'){
    const seg=document.getElementById('shseg');
    seg.dataset.status=el.dataset.s;
    seg.querySelectorAll('button').forEach(b=>{
      const on=b.dataset.s===el.dataset.s;
      b.setAttribute('aria-pressed',on);
      b.className=on?'on-'+el.dataset.s:'';
    });
  }
  else if(a==='shnotetoggle'){
    const w=document.getElementById('shnotewrap');
    w.innerHTML='<label class="f" for="shnote">Note</label><input type="text" id="shnote" placeholder="How did it go?">';
    document.getElementById('shnote').focus();
  }
  else if(a==='sheetlogsave'){
    const i2=Number(el.dataset.i),e2=eff(i2);
    const status=(document.getElementById('shseg')||{dataset:{}}).dataset.status||'done';
    const patch={status:status};
    const kmEl=document.getElementById('shkm');
    if(kmEl)patch.km=status==='missed'?0:Math.round((+kmEl.dataset.v)*10)/10;
    if(document.getElementById('shpace')&&status!=='missed'){
      const pv=readRuler('shpace');
      if(pv)patch.pace=fmtPace(pv);
    }
    const cEl=document.getElementById('shcarbs'),mEl=document.getElementById('shmins');
    if(cEl){const cv=parseFloat(cEl.value);patch.carbs=(isFinite(cv)&&cv>=0&&cv<=500)?cv:null;}
    if(mEl){const mv=parseFloat(mEl.value);patch.mins=(isFinite(mv)&&mv>0&&mv<=600)?mv:null;}
    const note=document.getElementById('shnote');
    if(note&&note.value)patch.note=note.value.slice(0,300);
    const prev=S.sessions[e2.id]?Object.assign({},S.sessions[e2.id]):null;
    const pre=capturePayoff(e2);
    logSession(e2.id,patch);
    closeSheet();
    payoff(pre,e2);
    snack((status==='missed'?'Marked missed':'Logged')+' · '+headline(e2),()=>{
      if(prev)S.sessions[e2.id]=prev;else delete S.sessions[e2.id];
      save();rerenderKeepScroll();
    });
  }
  else if(a==='clearlog'){ // accidentally logged? wipe the result, back to the planned (unlogged) day
    const i2=Number(el.dataset.i),e2=eff(i2);
    const prev=S.sessions[e2.id]?Object.assign({},S.sessions[e2.id]):null;
    delete S.sessions[e2.id];
    save();closeSheet();rerenderKeepScroll();
    if(prev)snack('Cleared · '+headline(e2),()=>{S.sessions[e2.id]=prev;save();rerenderKeepScroll();});
  }
  else if(a==='editwidgets'){openWidgetSheet();}
  else if(a==='nutadjust'){openNutAdjustSheet(Number(el.dataset.i));}
  else if(a==='nutadjsave'){
    const i2=Number(el.dataset.i),inp=document.getElementById('adjkcal'),v=parseFloat(inp.value);
    if(v>=1200&&v<=8000){
      if(!S.nutEdit)S.nutEdit={};

      inp.focus();
    }

  }
  else if(a==='wtoggle'){
    const cfg=widgetConfig(),w=cfg.find(x=>x.id===el.dataset.id);
    if(w){w.on=!w.on;S.widgets=cfg;save();rerenderKeepScroll();openWidgetSheet();}
  }
  else if(a==='wmove'){
    const cfg=widgetConfig(),i=cfg.findIndex(x=>x.id===el.dataset.id),j=i+Number(el.dataset.dir);
    if(i>=0&&j>=0&&j<cfg.length){const t=cfg[i];cfg[i]=cfg[j];cfg[j]=t;S.widgets=cfg;save();rerenderKeepScroll();openWidgetSheet();}
  }
  else if(a==='settheme'){
    S.theme=el.dataset.v;save();applyTheme();rerenderKeepScroll();openWidgetSheet();
  }
  else if(a==='swap'){swapDays(Number(el.dataset.w),Number(el.dataset.a),Number(el.dataset.b));closeSheet();rerenderKeepScroll();}
  else if(a==='resetweek'){openResetSheet(Number(el.dataset.w));}
  else if(a==='resetconfirm'){
    const w=Number(el.dataset.w);
    const prevOrder=orderOf(w).slice();
    resetWeek(w);closeSheet();rerenderKeepScroll();

    });
  }
  else if(a==='closesheet'){closeSheet();}
  else if(a==='selweek'){ui.week=Number(el.dataset.w);ui.scroll.train=0;render();}
  else if(a==='selnutday'){
    if(window._nutDragTs&&Date.now()-window._nutDragTs<400)return; // a bar drag just ended, not a tap

const NUM_FIELDS={km:1,rpe:1,carbs:1,mins:1};
let fieldDirty=false;
function commitField(el){ // parse + persist one log field (no render)
  const f=el.dataset.field;
  let v=el.value===''?null:(NUM_FIELDS[f]?parseFloat(el.value):el.value);
  if(NUM_FIELDS[f]&&v!=null&&(!isFinite(v)||v<0))v=null;
  logSession(el.dataset.sid,{[f]:v});
}
function flushFieldRender(){ // re-render only once focus has left the log fields — keeps the iOS keyboard up between inputs
  setTimeout(()=>{
    const ae=document.activeElement;
    if(fieldDirty&&!(ae&&ae.dataset&&ae.dataset.field)){fieldDirty=false;rerenderKeepScroll();}
  },80);
}
/* save-as-you-type: half-typed notes survive even a force-quit */
let typeTimer=null;
function flushActiveField(){
  const ae=document.activeElement;
  if(ae&&ae.dataset&&ae.dataset.field&&ae.dataset.sid){clearTimeout(typeTimer);commitField(ae);fieldDirty=true;}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushActiveField();});
addEventListener('pagehide',flushActiveField);
document.addEventListener('focusout',ev=>{if(ev.target.dataset&&ev.target.dataset.field)flushFieldRender();});
document.addEventListener('change',ev=>{
  const el=ev.target,a=el.dataset.action;
  if(el.dataset.field&&el.dataset.sid){
    commitField(el);
    fieldDirty=true;flushFieldRender();
  }
  else if(a==='nutweekfilter'){ui.nutWeek=el.value;const b=document.getElementById('nutbody');if(b)b.innerHTML=nutTableBody();}
  else if(a==='stravaday'){
    const p=stravaPend[Number(el.dataset.idx)];
    if(p){p.i=Number(el.value);stravaSheetRefresh();}
  }
  else if(el.id==='importfile'&&el.files&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const data=JSON.parse(fr.result);
        if(!data||typeof data.sessions!=='object'||!Array.isArray(data.weights))throw 0;
        const clean=Object.assign(freshState(),sanitizePayload(data),{lastBackup:S.lastBackup,hideInstallTip:S.hideInstallTip,theme:S.theme,widgets:S.widgets});
        if(confirm('Replace current logs with this backup? (A daily snapshot of the current data is kept on this device.)')){S=clean;save();render();}
      }catch(e){alert('That file doesn’t look like a Berlin 2026 backup.');}
      el.value='';
    };
    fr.readAsText(el.files[0]);
  }
});

function showFieldErr(id){
  const inp=document.getElementById(id),er=document.getElementById(id+'-err');
  if(inp){inp.setAttribute('aria-invalid','true');inp.focus();}
  if(er)er.hidden=false;
}

function doExport(text,name,type,isBackup){
  // share sheet first — blob-anchor downloads are unreliable in iOS standalone PWAs
  const done=()=>{if(isBackup){S.lastBackup=todayISO();save();rerenderKeepScroll();}};
  let file=null;
  try{file=new File([text],name,{type:type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    navigator.share({files:[file]}).then(done).catch(()=>{}); // user cancel = no backup credit
  }else{
    const u=URL.createObjectURL(new Blob([text],{type:type}));
    const aEl=document.createElement('a');
    aEl.href=u;aEl.download=name;document.body.appendChild(aEl);aEl.click();
    setTimeout(()=>{URL.revokeObjectURL(u);aEl.remove();},400);
    done();
  }
}

function buildCSV(){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const wmap={};S.weights.forEach(w=>{wmap[w.date]=w.lb;});
  const head=['date','week','phase','day','zone','day_type','planned_km','status','actual_km','pace','moving_s','start','hr_avg','hr_max','cadence_spm','elev_m','run_kcal','gear','carbs_g','duration_min','note','kcal_target','protein_g','carbs_target_g','fat_g','burn_kcal','deficit_kcal','plan_weight_lb','logged_weight_lb','moved'];
  const lines=[head.join(',')];
  for(let i=0;i<N_DAYS;i++){
    const e=eff(i),l=sessLog(e.id)||{};
    lines.push([isoAt(i),e.w+1,e.wk.phase,DOW[e.pos],e.zone,DAYTYPE[e.type].label,e.planKm,
      l.status||'',l.km!=null?l.km:'',l.pace||'',
      l.secs!=null?l.secs:'',l.start||'',l.hrA!=null?l.hrA:'',l.hrM!=null?l.hrM:'',l.cad!=null?Math.round(l.cad*2):'',l.elev!=null?l.elev:'',l.kcal!=null?l.kcal:'',l.gear||'',
      l.carbs!=null?l.carbs:'',l.mins!=null?l.mins:'',l.note||'',
      e.kcal,e.p,e.carbs,e.fat,e.burn,e.deficit,e.planWt,wmap[isoAt(i)]!=null?wmap[isoAt(i)]:'',e.moved?'yes':''].map(q).join(','));
  }
  return lines.join('\n');
}

function openRebalSummary(w){

    const e=eff(w*7+d),bits=[];
    if(e.kmAdj)bits.push((e.kmAdj>0?'+':'−')+fmtKm(Math.abs(e.kmAdj))+' km');
    if(e.nutEdited)bits.push('kcal edited to '+fmtKcal(e.kcal));
    else if(e.nutAdj)bits.push((e.nutAdj>0?'+':'−')+fmtKcal(Math.abs(e.nutAdj))+' kcal');
    if(e.moved)bits.push('moved from '+DOW[e.op]);
    if(bits.length)rows+='<div class="sheetrow" style="cursor:default"><span class="d">'+DOW[d]+'</span><span class="t">'+bits.join(' · ')+'</span></div>';

    +(rows||'<p class="note" style="margin:10px 0 0">Everything sits on plan this week.</p>')
    +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Close</button>');

const stravaQS=new URLSearchParams(location.search);
if(stravaQS.get('code')||stravaQS.get('error')){
  history.replaceState(null,'',location.pathname+location.hash);
  const stravaCode=stravaQS.get('code'),stravaScope=stravaQS.get('scope')||'';
  if(stravaCode){ // no code = cancelled on Strava's page; nothing to do
    fetch(STRAVA_PROXY+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:stravaCode})})
      .then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(d=>{
        if(!d.access_token||!d.refresh_token)throw 0;
        stravaSave({access:d.access_token,refresh:d.refresh_token,expiresAt:d.expires_at,athlete:d.athlete||null,lastSync:null,note:null,err:null,needsAuth:0});
        snack('Strava connected'+(d.athlete&&d.athlete.firstname?' as '+d.athlete.firstname:''));
        rerenderKeepScroll();
        if(stravaScope&&stravaScope.indexOf('activity:read')<0)snack('Strava connected without activity access — disconnect, reconnect, and leave every permission ticked.');
        else stravaSync(false);
      })
      .catch(()=>snack('Couldn’t finish connecting Strava — try again in a minute.'));
  }
}else if(stravaConnected()){
  setTimeout(()=>stravaSync(false),600); // routine sync on open
}
/* …and on resume, throttled — iOS PWAs resume far more often than they reload */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&stravaConnected()&&Date.now()-stravaLastTry>15*60000)stravaSync(false);
});

/* Oura rides the same rhythm: sync on open and on throttled resume */
if(ouraConnected())setTimeout(()=>ouraSync(false),1200);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&ouraConnected()&&Date.now()-ouraLastTry>15*60000)ouraSync(false);
});
/* The OAuth hop runs the app in iOS's in-app browser, which shares this origin's
   storage — if that context (or another tab) saved newer state while we were
   backgrounded, adopt it instead of clobbering it on the next save. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!storageOK||saveWarned)return;
  try{
    const raw=localStorage.getItem(KEY);
    if(raw&&raw!==JSON.stringify(S)){S=loadState();rerenderKeepScroll();}
  }catch(e){}
});

/* ---------------- 11. PWA ---------------- */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
