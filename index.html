function setDropTarget(t){
  if(!dragSt||dragSt.target===t)return;
  if(dragSt.target){
    dragSt.target.classList.remove('droptarget');
    dragSt.target.querySelectorAll('.dragpreview').forEach(p=>p.remove());
    dragSt.card.querySelectorAll('.dragpreview').forEach(p=>p.remove());
  }
  dragSt.target=null;
  if(!t)return;
  const w=dragSt.w,a=dragSt.pos,b=+t.dataset.day;
  if(w*7+b===RACE_IDX||w*7+a===RACE_IDX){ // race day is untouchable
    t.classList.add('dropinert');setTimeout(()=>t.classList.remove('dropinert'),350);
    return;
  }
  dragSt.target=t;
  t.classList.add('droptarget');
  // swap preview: the consequence at the moment of decision
  const ea=eff(w*7+a),eb=eff(w*7+b);
  const pa=document.createElement('div');pa.className='dragpreview';
  pa.textContent=DOW[a]+' becomes '+fmtKcal(eb.kcal)+' kcal · '+eb.carbs+'g carbs';
  const pb=document.createElement('div');pb.className='dragpreview';
  pb.textContent=DOW[b]+' becomes '+fmtKcal(ea.kcal)+' kcal · '+ea.carbs+'g carbs';
  dragSt.card.appendChild(pa);t.appendChild(pb);
}
function dayDragMove(e){
  if(!dragSt)return;
  e.preventDefault();
  const dy=e.clientY-dragSt.y0;
  dragSt.card.style.transform='translateY('+dy+'px) scale(1.02) rotate(.4deg)';
  if(e.clientY<130)window.scrollBy(0,-10);
  else if(e.clientY>innerHeight-150)window.scrollBy(0,10);
  dragSt.card.style.pointerEvents='none';
  const below=document.elementFromPoint(e.clientX,e.clientY);
  dragSt.card.style.pointerEvents='';
  const t=below&&below.closest?below.closest('.card[data-day]'):null;
  setDropTarget(t&&t!==dragSt.card?t:null);
}
function dayDragEnd(){
  if(!dragSt)return;
  const card=dragSt.card,target=dragSt.target,w=dragSt.w,pos=dragSt.pos;
  document.removeEventListener('pointermove',dayDragMove);
  document.removeEventListener('pointerup',dayDragEnd);
  document.removeEventListener('pointercancel',dayDragEnd);
  document.body.classList.remove('dragactive');
  card.querySelectorAll('.dragghost,.dragpreview').forEach(g=>g.remove());
  dragSt=null;
  if(target){
    const b=+target.dataset.day;
    const prevOrder=orderOf(w).slice();
    swapDays(w,pos,b);
    haptic(true);
    rerenderKeepScroll();gcalReconcileSoon();
    requestAnimationFrame(()=>{
      [w*7+pos,w*7+b].forEach(ix=>{const c=document.getElementById('day-'+ix);if(c)c.classList.add('hl');});
      document.querySelectorAll('.tag-moved').forEach(t2=>t2.classList.add('pop'));
    });
    snack('Swapped '+DOW[pos]+' and '+DOW[b]+' — fuelling follows',()=>{
      const ident=prevOrder.every((v,i)=>v===i);
      if(ident)delete S.order[w];else S.order[w]=prevOrder;
      save();rerenderKeepScroll();gcalReconcileSoon();
    });
  }else{
    card.classList.add('swipe-snapback');
    card.style.transform='';
    setTimeout(()=>card.classList.remove('swipe-snapback','dragging'),320);
  }
}

/* ---------------- kcal bar drag: direct manipulation of the rebalance engine ---------------- */
let nutDragRevert=null;
function updateNutStrip(){
  const strip=document.getElementById('nutstrip');if(!strip)return;
  const w=+strip.dataset.w;
  const vals=Array.from({length:7},(_,d)=>eff(w*7+d));
  const maxK=Math.max.apply(null,vals.map(e=>e.kcal));
  strip.querySelectorAll('button[data-i]').forEach((b,d)=>{
    const e=vals[d];
    b.querySelector('.nbar i').style.height=Math.round(10+42*e.kcal/maxK)+'px';
    b.querySelector('.k').textContent=(Math.round(e.kcal/100)/10)+'k';
    const del=b.querySelector('.ndelta');
    const dv=e.nutEdited?e.kcal-e.planKcal:e.nutAdj;
    del.textContent=dv?((dv>0?'+':'−')+Math.abs(dv)):'';
  });
}
function bindNutBars(){
  document.querySelectorAll('.nbar.ed').forEach(bar=>{
    if(bar._nb)return;bar._nb=1;
    const i=+bar.dataset.bar;
    let y0=0,active=false,moved=false,base=0,plan=0,prevEdit=null,cur=0;
    bar.addEventListener('pointerdown',e=>{
      y0=e.clientY;active=true;moved=false;
      prevEdit=S.nutEdit[i]!=null?S.nutEdit[i]:null;
      plan=eff(i).planKcal;
      base=prevEdit!=null?prevEdit:plan;
      cur=base;
      nutDragRevert=()=>{
        if(prevEdit!=null)S.nutEdit[i]=prevEdit;else delete S.nutEdit[i];
        active=false;document.body.classList.remove('nutdrag');updateNutStrip();nutDragRevert=null;
      };
      try{bar.setPointerCapture(e.pointerId);}catch(_){}
    });
    bar.addEventListener('pointermove',e=>{
      if(!active)return;
      const dy=y0-e.clientY;
      if(!moved){if(Math.abs(dy)<10)return;moved=true;document.body.classList.add('nutdrag');}
      e.preventDefault();
      let v=base+Math.round(dy*8/25)*25; // ~8 kcal per px, 25 kcal detents
      v=Math.max(1200,Math.min(8000,v));
      if(v!==cur){
        cur=v;haptic();
        if(v===plan)delete S.nutEdit[i];else S.nutEdit[i]=v; // transient until release
        updateNutStrip();
      }
    });
    bar.addEventListener('pointerup',()=>{
      if(!active)return;active=false;
      document.body.classList.remove('nutdrag');nutDragRevert=null;
      if(!moved)return; // plain tap: selection click handles it
      window._nutDragTs=Date.now();
      if((prevEdit!=null?prevEdit:plan)===cur){updateNutStrip();return;}
      hintDone('bar');
      save();rerenderKeepScroll();
      const pe=prevEdit;
      snack(DOW[i%7]+' set to '+fmtKcal(cur)+' kcal — week rebalanced',()=>{
        if(pe!=null)S.nutEdit[i]=pe;else delete S.nutEdit[i];
        save();rerenderKeepScroll();
      });
    });
    bar.addEventListener('pointercancel',()=>{if(nutDragRevert)nutDragRevert();});
  });
}

function weekStats(w){
  const tgt=effWeekTarget(w),act=weekActualKm(w);
  let bigKm=0,bigName='',done=0,fuel=null;
  for(let d=0;d<7;d++){
    const e=eff(w*7+d),l=sessLog(e.id);
    if(l&&l.status){
      if(l.status!=='missed')done++;
      if(l.km>bigKm){bigKm=l.km;bigName=headline(e);}
      const fr=fuelRate(l);if(fr!=null)fuel=fr;
    }
  }
  return {tgt:tgt,act:act,pct:Math.round(act/tgt*100),done:done,bigKm:bigKm,bigName:bigName,fuel:fuel};
}

function wrappedImage(){ // canvas render of the week summary for sharing
  const w=clamp(Math.floor(rawT/7),0,15),st=weekStats(w);

  const BG=tok('--card','#FFFFFF'),AC=tok('--accent','#007AFF'),INK=tok('--ink','#000000'),T2=tok('--txt2','#545458'),SUB=tok('--sub','#646469');

/* Drag-to-reorder for the Edit-home-screen list. Grip-only press-drag with animated
   gap-shifting; commits the new order through the same S.widgets seam as the ▲▼ arrows
   (which stay as the keyboard/AT fallback). Uniform row height → index-by-offset. */
let wDrag=null;
function bindWidgetDrag(){
  const list=document.getElementById('wdraglist');
  if(!list)return;
  list.querySelectorAll('.wgrip[data-wdrag]').forEach(h=>{
    if(h._wd)return;h._wd=1;
    h.addEventListener('pointerdown',e=>startWidgetDrag(e,list));
  });
}
function startWidgetDrag(e,list){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const row=e.target.closest('.wdragrow');
  if(!row)return;
  e.preventDefault();
  const rows=[...list.querySelectorAll('.wdragrow')];
  const startIndex=rows.indexOf(row);
  const rects=rows.map(r=>r.getBoundingClientRect());
  const centers=rects.map(r=>r.top+r.height/2);   // original slot centres — robust to variable row heights
  const draggedH=rects[startIndex].height+8;       // + the .sheetrow top margin = gap to open
  wDrag={list,row,rows,startIndex,curIndex:startIndex,centers,draggedH,y0:e.clientY};
  row.classList.add('wdragging');
  document.body.classList.add('dragactive');
  try{row.setPointerCapture(e.pointerId);}catch(_){}
  haptic(true);
  document.addEventListener('pointermove',widgetDragMove,{passive:false});
  document.addEventListener('pointerup',widgetDragEnd);
  document.addEventListener('pointercancel',widgetDragEnd);
}
function widgetDragMove(e){
  if(!wDrag)return;
  e.preventDefault();
  const dy=e.clientY-wDrag.y0;
  wDrag.row.style.transform='translateY('+dy+'px)';
  const dc=wDrag.centers[wDrag.startIndex]+dy;   // dragged row's live centre
  let ti=wDrag.startIndex;
  while(ti<wDrag.rows.length-1&&dc>wDrag.centers[ti+1])ti++;
  while(ti>0&&dc<wDrag.centers[ti-1])ti--;
  if(ti!==wDrag.curIndex){
    wDrag.curIndex=ti;
    haptic(false);
    wDrag.rows.forEach((rw,idx)=>{
      if(rw===wDrag.row)return;
      let shift=0;
      if(wDrag.startIndex<ti&&idx>wDrag.startIndex&&idx<=ti)shift=-wDrag.draggedH;
      else if(wDrag.startIndex>ti&&idx<wDrag.startIndex&&idx>=ti)shift=wDrag.draggedH;
      rw.style.transform=shift?'translateY('+shift+'px)':'';
    });
  }
}
function widgetDragEnd(){
  if(!wDrag)return;
  document.removeEventListener('pointermove',widgetDragMove);
  document.removeEventListener('pointerup',widgetDragEnd);
  document.removeEventListener('pointercancel',widgetDragEnd);
  const {startIndex,curIndex,rows}=wDrag;
  rows.forEach(rw=>{rw.style.transform='';rw.classList.remove('wdragging');});
  document.body.classList.remove('dragactive');
  wDrag=null;
  if(curIndex!==startIndex){
    const cfg=widgetConfig();
    if(startIndex<cfg.length&&curIndex<cfg.length){
      const moved=cfg.splice(startIndex,1)[0];
      cfg.splice(curIndex,0,moved);
      S.widgets=cfg;save();haptic(true);
      rerenderKeepScroll();
      openWidgetSheet();
    }
  }
}

/* Race pack — splits, gel schedule, carb-load — pure rendering from the baked
   race plan + latest weight. Shown on Today in race week and on Training W16. */
function racePack(){
  const lw=latestWeight();
  const kg=(lw?lw.lb:189)/2.2046;
  const bands=[[0,10,301],[10,30,297],[30,37,296.5],[37,42.195,297]]; // s/km midpoints of the plan's pacing bands
  const tAt=km=>{let s=0;for(const b of bands){if(km<=b[0])break;s+=(Math.min(km,b[1])-b[0])*b[2];}return s;};
  const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),mm=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+p2(mm)+':'+p2(x);};
  let splits='';
  [[5,'5 km'],[10,'10 km'],[15,'15 km'],[20,'20 km'],[21.0975,'Half'],[25,'25 km'],[30,'30 km'],[35,'35 km'],[40,'40 km'],[42.195,'Finish']].forEach(r=>{
    splits+='<tr'+(r[1]==='Finish'?' style="font-weight:700"':'')+'><td>'+r[1]+'</td><td class="num right">'+fmtT(tAt(r[0]))+'</td></tr>';
  });
  let gels='';
  for(let k=5;k<=40;k+=5)gels+=(k>5?' · ':'')+'<b class="num">'+k+'k</b> '+fmtT(tAt(k));

    +'<div class="spread"><h2 style="margin:0">Race pack · Berlin</h2><span class="chip neutral">goal '+fmtT(tAt(42.195))+'</span></div>'
    +'<p class="note" style="margin:8px 0 0">Even pacing per the plan: 0–10k @ 5:00–5:02 · 10–30k @ 4:56–4:58 · 30–37k @ 4:55–4:58 · 37k+ ≤4:57.</p>'

    +'<p class="note num" style="margin:0">'+gels+'</p>'
    +'<p class="mini" style="margin:6px 2px 0">1 gel ≈ 25 g carbs → ~60 g/hr at this spacing; add chews at aid stations to reach 75–90 g/hr.</p>'
    +'<h2 style="margin:16px 0 6px">Carb-load · Thu–Sat race week</h2>'
    +'<p class="note" style="margin:0">8–10 g/kg/day ≈ <b class="num">'+Math.round(kg*8)+'–'+Math.round(kg*10)+' g carbs/day</b> at '+(lw?'your latest weight':'race-target weight')+'. Protein stays 185 g; fat fills the rest.</p>'

/* The day card: one thing per line. Plan vs ate are kept distinct — "Edit plan
   target" (future intent, demoted) vs "Log what I ate" (the bright fact). A day

function nutDayCard(i){
  const e=eff(i),t=clamp(rawT,0,RACE_IDX),past=i<=t,ea=eaten(i),b=dayBurn(i),real=ateLogged(i),acc=!!ea.accepted;

  let head='<div class="spread"><b>'+longDate(i)+'</b>'+planLink+'</div>'
    +(movedChip(e)?'<div class="row" style="margin-top:4px">'+movedChip(e)+'</div>':'');
  // ROW2: the hero number — what was eaten (logged) / plan (estimate or locked) / planned (future)
  let hero,logBtn='';
  if(real){
    const over=ea.kcal-e.kcal;
    hero='<div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="hero num">'+fmtKcal(ea.kcal)+'</span>'
      +'<span class="sub" style="font-weight:600">kcal eaten</span><span class="chip c-blue" style="margin-left:auto">Ate</span></div>'
      +'<p class="mini" style="margin:4px 2px 0">plan '+fmtKcal(e.kcal)+(Math.abs(over)>=25?' · '+(over>0?'+':'−')+fmtKcal(Math.abs(over))+(over>0?' over':' under'):' · on plan')+'</p>';
  }else if(past){
    hero='<div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="hero num" style="color:var(--sub)">'+fmtKcal(e.kcal)+'</span>'
      +'<span class="sub" style="font-weight:600">kcal · '+(acc?'locked at plan':'plan estimate')+'</span></div>';
  }else{
    hero='<div class="row" style="align-items:baseline;gap:6px;margin-top:8px"><span class="hero num">'+fmtKcal(e.kcal)+'</span><span class="sub" style="font-weight:600">kcal planned</span></div>';
  }
  // the bright primary action (past/today only): log, or edit a logged value — expands a ruler in place
  if(past){
    if(ui.ateOpen===i){
      const lo=Math.max(800,e.kcal-700),start=Math.round(real?ea.kcal:(lastAte(i)||e.kcal));
      logBtn='<div style="margin-top:12px">'+rulerHTML('ater',lo,e.kcal+900,25,clamp(start,lo,e.kcal+900),'kcal',250,0)+'</div>'
        +'<div class="loggrid" style="margin-top:12px"><button class="btn2" data-action="atecancel">Cancel</button><button class="btn" data-action="atesave" data-i="'+i+'">Save</button></div>'
        +(real?'<button class="btn3" data-action="ateclear" data-i="'+i+'" style="width:100%;margin-top:8px;color:var(--sub)">Back to plan estimate</button>':'');
    }else{
      logBtn='<button class="btn" style="width:100%;margin-top:12px" data-action="ateopen" data-i="'+i+'">'+(real?'Ate '+fmtKcal(ea.kcal)+' · edit':'Log what I ate')+'</button>';
    }
  }
  // ROW: verdict + coach line from burn
  let verdict='';
  if(b.burned!=null){
    const def=b.burned-ea.kcal,onp=Math.abs(def-e.deficit)<=200;
    const tag=real?'':' est';
    verdict='<div class="row" style="margin-top:10px"><span class="chip neutral">burned '+fmtKcal(b.burned)+'</span>'
      +'<span class="chip '+(onp?'c-easy':(def>e.deficit?'c-easy':'c-warn'))+'">'+(def>=0?'−':'+')+fmtKcal(Math.abs(def))+' deficit'+tag+'</span></div>'
      +'<p class="mini" style="margin:6px 2px 0">plan −'+fmtKcal(e.deficit)+(Math.abs(def-e.deficit)<25?' · on plan':'')+'</p>';
    // the "calories left" coach line, before logging, today/past
    if(!real){
      const eatToPlan=b.burned-e.deficit;
      verdict+='<p class="note" style="margin:8px 0 0">Burned '+fmtKcal(b.burned)+' so far — eat up to <b>'+fmtKcal(Math.max(0,eatToPlan))+'</b> to hit today’s −'+fmtKcal(e.deficit)+'.</p>';
    }
  }
  return '<section class="card">'+head+hero+logBtn+verdict+'</section>';
}

/* The week as a running budget: banked-so-far vs plan, on-pace projection,
   and the claw-back target if behind. Apples-to-apples — elapsed days only. */
function weekLedger(w){
  const t=clamp(rawT,0,RACE_IDX);
  let banked=0,planElapsed=0,weekPlanTot=0,estN=0,logN=0;const future=[];
  for(let d=0;d<7;d++){
    const i=w*7+d,e=eff(i);
    if(i>t){if(i!==RACE_IDX){future.push(i);weekPlanTot+=e.deficit;}continue;} // exclude race day from the projection day-set
    weekPlanTot+=e.deficit;
    const b=dayBurn(i);
    if(b.burned!=null){banked+=b.burned-eaten(i).kcal;planElapsed+=e.deficit;ateLogged(i)?logN++:estN++;} // accepted-at-plan counts as est-grade label
  }
  let planLeft=0,burnLeft=0;future.forEach(i=>{planLeft+=eff(i).deficit;burnLeft+=eff(i).burn;});
  const need=weekPlanTot-banked; // deficit still required to hit the week's plan
  const eatTarget=future.length?Math.round((burnLeft-need)/future.length):null; // avg kcal/day to land on plan
  // is hitting the week's plan still physically possible? remaining days floored at 1600 kcal/day
  const maxRecoverable=burnLeft-future.length*1600; // most deficit the rest of the week can bank without starving
  const achievable=future.length?need<=maxRecoverable+1:true;
  return {w:w,banked:Math.round(banked),weekPlanTot:Math.round(weekPlanTot),planElapsed:Math.round(planElapsed),
    onPace:Math.round(banked+planLeft),ahead:Math.round(banked-planElapsed),
    futureN:future.length,future:future,eatTarget:eatTarget,achievable:achievable,estN:estN,logN:logN,counted:logN+estN};
}
/* projected date to reach race weight, from the actual banked-deficit pace */
function raceWeightDate(){
  const twn=trendWeight(),lwn=latestWeight();
  const cur=twn?twn.lb:(lwn?lwn.lb:null);
  if(cur==null||cur<=189)return null;
  const t=clamp(rawT,0,RACE_IDX);
  let banked=0,days=0;
  for(let i=Math.max(0,t-13);i<=t;i++){const b=dayBurn(i);if(b.burned!=null){banked+=b.burned-eaten(i).kcal;days++;}}
  if(days<3||banked<=0)return null;
  const perDay=banked/days; // kcal/day, recent
  const need=(cur-189)*3500/perDay; // days to go
  if(!isFinite(need)||need<=0||need>400)return null;
  const idx=t+Math.round(need);
  return {idx:idx,daysToGo:Math.round(need),beforeRace:RACE_IDX-idx};
}
/* honesty: how much of the counted block is logged fact vs plan estimate */
function cutHonesty(){
  const t=clamp(rawT,0,RACE_IDX);let log=0,acc=0,est=0;
  for(let i=0;i<=t;i++){const b=dayBurn(i);if(b.burned!=null){if(ateLogged(i))log++;else if(weekLocked(Math.floor(i/7)))acc++;else est++;}}
  return {log:log,acc:acc,est:est,total:log+acc+est};
}

/* "The cut": today, this week, and the whole block — actual deficits banked
   vs the plan, cross-checked against what the scale trend says. */
function cutCard(){
  const t=clamp(rawT,0,RACE_IDX);
  let total=0,planCounted=0,days=0;
  for(let i=0;i<=t;i++){
    const b=dayBurn(i);
    if(b.burned!=null){total+=b.burned-eaten(i).kcal;planCounted+=eff(i).deficit;days++;}
  }
  if(!days)
    return '<section class="card"><div class="spread"><h2>The cut</h2><span class="chip neutral">no data yet</span></div>'
      +'<p class="note" style="margin:8px 0 0">Connect Oura on the Training tab and the banked deficit starts counting here.</p></section>';
  const lb=total/3500;
  const first=S.weights.length?S.weights[0]:null,twn=trendWeight(),lwn=latestWeight();
  const cur=twn?twn.lb:(lwn?lwn.lb:null);
  const scale=(first&&cur!=null)?first.lb-cur:null;
  const ratio=planCounted>0?total/planCounted:null;
  const chip=ratio==null?'<span class="chip neutral">counting</span>'
    :ratio>=1.1?'<span class="chip c-easy">ahead</span>'
    :ratio>=0.9?'<span class="chip c-easy">on track</span>'
    :ratio>=0.6?'<span class="chip c-warn">behind</span>'
    :'<span class="chip c-hard">well behind</span>';
  // the scale is the reality check — show it once, as confirmation or (if it diverges) the tie-breaker
  let scaleLine='';
  if(scale!=null){
    scaleLine=Math.abs(scale-lb)<=1.5
      ?'<p class="note" style="margin:8px 0 0">Scale agrees — '+fmtLb(Math.abs(scale))+' lb '+(scale>=0?'down':'up')+' on the trend.</p>'
      :'<p class="note" style="margin:8px 0 0">Scale says '+fmtLb(Math.abs(scale))+' lb '+(scale>=0?'down':'up')+' — trust the scale over the banked figure.</p>';
  }
  // honesty: only when there's something to flag (estimates/locked); a fully-logged block needs no caveat
  const hon=cutHonesty();
  const honTxt=(hon.log===0&&hon.acc===0)?'All '+hon.total+' counted days assume plan — log a day to make it real.'
    :(hon.est>0||hon.acc>0)?hon.log+' of '+hon.total+' days logged'+(hon.acc?', '+hon.acc+' locked at plan':'')+(hon.est?', '+hon.est+' assume plan':'')+'.'
    :'';
  return '<section class="card"><div class="spread"><h2>The cut</h2>'+chip+'</div>'
    +'<div class="row" style="align-items:baseline;gap:6px"><span class="hero num">'+(total>=0?'−':'+')+fmtKcal(Math.abs(total))+'</span>'
    +'<span class="sub" style="font-weight:600">kcal banked ≈ '+(lb>=0?'':'+')+fmtLb(Math.abs(lb))+' lb lost</span></div>'
    +scaleLine
    +(honTxt?'<p class="mini" style="margin:10px 2px 0">'+honTxt+'</p>':'')
    +'</section>';
}

/* cumulative deficit: the plan's line for the whole block, the actual line as it grows */
function deficitChart(){
  const W=360,H=150,L=34,Rm=4,T=10,B=20,ih=H-T-B,iw=W-L-Rm;
  const t=clamp(rawT,0,RACE_IDX);
  let planTot=0;const plan=[];
  for(let i=0;i<=RACE_IDX;i++){planTot+=eff(i).deficit;plan.push(planTot);}
  let actTot=0,logTot=0,anyLog=false;const act=[],logged=[];
  for(let i=0;i<=t;i++){
    const b=dayBurn(i);
    if(b.burned!=null){const ea=eaten(i);actTot+=b.burned-ea.kcal;if(ateLogged(i)){logTot+=b.burned-ea.kcal;anyLog=true;}}
    act.push(actTot);logged.push(logTot);
  }
  const max=Math.max(planTot,actTot,3500)*1.05;
  const X=i=>L+iw*i/RACE_IDX,Y=v=>T+ih*(1-Math.max(v,0)/max);
  let g='';
  for(let v=17500;v<max;v+=17500){ // gridlines every 5 lb of deficit
    g+='<line class="gridline" x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-Rm)+'" y2="'+Y(v)+'"/>'
      +'<text class="axis" x="'+(L-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+Math.round(v/3500)+'lb</text>';
  }
  g+='<path d="'+plan.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="var(--sub)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>';
  // actual incl. estimated days (faint) — and the logged-only spine (solid) once any day is logged
  if(act.length>1)g+='<path d="'+act.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="'+(anyLog?1.2:2)+'" opacity="'+(anyLog?0.4:1)+'" stroke-linejoin="round"/>';
  if(anyLog)g+='<path d="'+logged.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
  [0,4,8,12].forEach(w=>{g+='<text class="axis" x="'+X(w*7+3.5)+'" y="'+(H-7)+'" text-anchor="middle">W'+(w+1)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Cumulative deficit, actual versus plan">'+g+'</svg>';
}

/* the week budget strap: where this week's deficit stands, claw-back, opt-in rebalance, lock */
function weekStrap(w){
  const lg=weekLedger(w),t=clamp(rawT,0,RACE_IDX),isCur=w===Math.floor(t/7),isPast=w<Math.floor(t/7);
  if(!lg.counted)
    return '<p class="mini" style="margin:8px 2px 0">Week '+(w+1)+' plan: −'+fmtKcal(lg.weekPlanTot)+' deficit.</p>';
  const aheadWord=lg.ahead>=250?'ahead':lg.ahead<=-250?'behind':'on track';
  const chipCls=lg.ahead<=-250?'c-hard':'c-easy';
  const behindRecoverable=lg.ahead<=-250&&lg.futureN&&lg.achievable;
  const est=lg.estN>0?' ('+lg.estN+' est)':'';
  // the chip carries ahead/behind; the line states the banked figure (+ on-pace while days remain). No restated advice.
  let s='<div class="spread" style="margin:8px 2px 0;align-items:center"><b>'+(isCur?'This week’s deficit':'Week '+(w+1)+' deficit')+'</b>'
    +'<span class="chip '+chipCls+'">'+(lg.ahead>=0?'+':'−')+fmtKcal(Math.abs(lg.ahead))+' '+aheadWord+'</span></div>'
    +'<p class="note" style="margin:4px 2px 0">So far <b>'+(lg.banked>=0?'−':'+')+fmtKcal(Math.abs(lg.banked))+'</b> banked vs <b>−'+fmtKcal(lg.planElapsed)+'</b> planned'+est+'.</p>'
    +'<p class="mini" style="margin:3px 2px 0">Full week target −'+fmtKcal(lg.weekPlanTot)+(isCur&&lg.futureN?' · on pace for −'+fmtKcal(lg.onPace):'')+'.</p>';
  if(behindRecoverable&&lg.eatTarget!=null&&lg.eatTarget>=800)
    s+='<p class="mini" style="margin:4px 2px 0">Eat ≤'+fmtKcal(lg.eatTarget)+'/day the rest of the week to still land on −'+fmtKcal(lg.weekPlanTot)+'.</p>';
  if(Math.abs(lg.ahead)>500&&lg.futureN&&lg.achievable)
    s+='<button class="btn3" data-action="rebalweek" data-w="'+w+'" style="margin-top:4px;color:var(--accent-text)">Rebalance the rest →</button>';
  if(isPast)
    s+=weekLocked(w)
      ?'<p class="mini" style="margin:6px 2px 0">Locked as fact ✓ · <button class="btn3" data-action="unlockweek" data-w="'+w+'" style="padding:0;color:var(--sub)">unlock</button></p>'
      :(lg.estN>0?'<button class="btn3" data-action="lockweek" data-w="'+w+'" style="margin-top:6px;color:var(--sub)">Lock week as fact ('+lg.estN+' at plan)</button>':'');
  return s;
}

/* Is the cut paying? — verdict and plain next-step first; the weekly numbers behind a tap. */
function cutPayingCard(){
  if(!ouraConnected())return '';
  const cp=cutPaying();
  // nothing to say until there's a verdict or a meaningful weight change — don't show an empty "learning" card
  if(!cp.verdict&&cp.lost<2)return '';
  const word=cp.verdict?cp.verdict.split(' — ')[0]:null;
  const reason=cp.verdict?cp.verdict.split(' — ')[1]:null;
  const todo=word==='paying'?'Hold the cut — it’s working.':word==='costing'?'Ease up: add ~150 kcal on session days.':word==='holding'?'Keep going, recheck next week.':'';
  let table='';
  if(ui.showCutWeeks){
    let rows='';
    cp.weeks.forEach((x,ix)=>{
      const prev=ix>0?cp.weeks[ix-1]:null;
      const efArrow=(prev&&prev.ef!=null&&x.ef!=null)?(x.ef<prev.ef?' ↓':x.ef>prev.ef?' ↑':' ='):'';
      const hvArrow=(prev&&prev.hrv!=null&&x.hrv!=null)?(x.hrv>prev.hrv?' ↑':x.hrv<prev.hrv?' ↓':' ='):'';
      if(x.def==null&&x.ef==null)return;
      rows+='<tr><td>W'+(x.w+1)+'</td><td class="num right">'+(x.def!=null?((x.def>=0?'−':'+')+fmtKcal(Math.abs(x.def))):'–')+'</td>'
        +'<td class="num right">'+(x.ef!=null?Math.round(x.ef)+efArrow:'–')+'</td><td class="num right">'+(x.hrv!=null?Math.round(x.hrv)+hvArrow:'–')+'</td></tr>';
    });
    table='<div class="scroll-x" style="margin-top:8px"><table style="width:100%;min-width:240px"><thead><tr><th>Week</th><th class="right">Deficit</th><th class="right">Cost/km</th><th class="right">HRV</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  return '<section class="card"><div class="spread"><h2>Is the cut paying?</h2>'
    +(word?'<span class="chip '+cp.cls+'">'+word+'</span>':'<span class="chip neutral">learning</span>')+'</div>'
    +(reason?'<p class="note" style="margin:8px 0 0;font-weight:600">'+reason.charAt(0).toUpperCase()+reason.slice(1)+'.</p>':'')
    +(todo?'<p class="mini" style="margin:6px 2px 0">'+todo+'</p>':'')
    +(cp.lost>=2?'<p class="mini" style="margin:6px 2px 0">Down '+fmtLb(cp.lost)+' lb ≈ '+cp.raceSecs+' s faster at Berlin (estimate).</p>':'')
    +(cp.verdict?'<button class="btn3" data-action="cutweeks" aria-expanded="'+(ui.showCutWeeks?'true':'false')+'" style="margin-top:8px;color:var(--sub)">'+(ui.showCutWeeks?'hide the weekly numbers':'show the weekly numbers ›')+'</button>':'')
    +table
    +'</section>';
}

/* The daily card — follows the day selected in the strip below. For today/past it
   shows the deficit you're actually running (burn − eaten) vs target; for future
   days it shows the plan (target deficit + planned intake). Burn = BMR + active,
   so it moves with a moved session. */
function nutDayHero(i){
  i=clamp(i==null?rawT:i,0,RACE_IDX);
  const today=clamp(rawT,0,RACE_IDX),isToday=i===today,isFuture=i>today;
  const e=eff(i),ea=eaten(i),b=dayBurn(i),real=ateLogged(i);
  const burnReal=b.burned!=null,burn=burnReal?b.burned:e.burn;
  const eatTarget=e.kcal;                       // what to eat = burn − your daily cut
  const ek=real?ea.kcal:0,curDef=burn-ek,left=eatTarget-ek;
  const moved=movedChip(e);
  const tag=isToday?'TODAY':isFuture?'UPCOMING':'PAST';
  const tagCol=isToday?'var(--accent)':'var(--sub)';
  const sess=e.km>0?esc(headline(e)).toLowerCase():'a rest day';
  // hero: once logged → the deficit you actually ran; otherwise → what to eat
  let heroNum,heroLbl,heroColor;
  if(real){
    heroNum=(curDef>=0?'−':'+')+fmtKcal(Math.abs(curDef));heroLbl=isToday?'deficit so far today':'deficit that day';
    heroColor=curDef>=0?'var(--easy)':'var(--hard)';
  }else{
    heroNum=fmtKcal(eatTarget);heroLbl=isFuture?'kcal to eat':isToday?'kcal to eat today':'kcal to eat that day';heroColor='var(--ink)';
  }
  // gauge: eaten vs burn, marker where eating lands your cut
  const eatenPct=burn>0?clamp(ek/burn*100,0,100):0,markPct=burn>0?clamp(eatTarget/burn*100,0,100):0;
  const fillPct=isFuture?markPct:(real?eatenPct:0);
  const fillCol=isFuture?'color-mix(in srgb,var(--accent) 40%,transparent)':(!real?'var(--accent)':(ek<=eatTarget?'var(--easy)':'var(--warn)'));
  const gauge='<div style="position:relative;height:18px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:14px">'
    +'<i style="display:block;height:100%;width:'+fillPct+'%;background:'+fillCol+';border-radius:99px;transition:width .5s var(--ease-out)"></i>'
    +'<span style="position:absolute;top:0;bottom:0;left:'+markPct+'%;width:2px;background:var(--ink);opacity:.5"></span></div>'
    +'<div class="spread" style="margin-top:5px"><span class="mini">'+(isFuture?'eat ~'+fmtKcal(eatTarget):(real?fmtKcal(ek)+' eaten':'eat up to '+fmtKcal(eatTarget)))+'</span><span class="mini">'+fmtKcal(burn)+(burnReal?' burned':' burn')+'</span></div>';
  const stat=(lbl,val,col)=>'<div style="flex:1;text-align:center;padding:0 4px"><div class="num" style="font-size:19px;font-weight:700;color:'+(col||'var(--ink)')+'">'+val+'</div><div class="mini" style="margin-top:2px">'+lbl+'</div></div>';
  const div='<div style="width:1px;background:var(--line);align-self:stretch"></div>';
  const stats='<div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:13px;gap:0">'
    +stat(burnReal?'burned':'burn (plan)',fmtKcal(burn))+div
    +stat('eaten',real?fmtKcal(ea.kcal):'—')+div
    +stat(isFuture?'to eat':'deficit',isFuture?fmtKcal(eatTarget):(real?((curDef>=0?'−':'+')+fmtKcal(Math.abs(curDef))):'—'),isFuture?'var(--ink)':(real?(curDef>=0?'var(--easy)':'var(--hard)'):'var(--ink)'))+'</div>';
  let defNote;
  if(isFuture){
    defNote=sess.charAt(0).toUpperCase()+sess.slice(1)+' on '+shortDate(i)+' — you’ll burn about <b>'+fmtKcal(burn)+'</b>, so eat around <b>'+fmtKcal(eatTarget)+'</b>.';
  }else if(!real){
    defNote='You’ve burned <b>'+fmtKcal(burn)+'</b> '+(isToday?'so far ':'')+'(your BMR + '+sess+'). Eat up to <b>'+fmtKcal(eatTarget)+'</b>, then log it.';
  }else{
    defNote='Burned <b>'+fmtKcal(burn)+'</b> '+(isToday?'so far ':'')+'(BMR + '+sess+') and ate <b>'+fmtKcal(ea.kcal)+'</b>'
      +(left>50?' — room for <b>'+fmtKcal(left)+'</b> more.':left<-50?' — <b>'+fmtKcal(-left)+'</b> over the day’s plan.':' — right on plan.');
  }
  // actions: log/edit for today & past; future shows the plan-target editor
  let actions;
  if(isFuture){
    actions='<button class="btn2" style="width:100%;margin-top:14px" data-action="nutadjust" data-i="'+i+'" aria-haspopup="dialog">Edit plan target</button>';
  }else if(ui.ateOpen===i){
    const lo=Math.max(800,e.kcal-700),start=Math.round(real?ea.kcal:(lastAte(i)||e.kcal));
    actions='<div style="margin-top:14px">'+rulerHTML('ater',lo,e.kcal+900,25,clamp(start,lo,e.kcal+900),'kcal',250,0)+'</div>'
      +'<div class="loggrid" style="margin-top:12px"><button class="btn2" data-action="atecancel">Cancel</button><button class="btn" data-action="atesave" data-i="'+i+'">Save</button></div>'
      +(real?'<button class="btn3" data-action="ateclear" data-i="'+i+'" style="width:100%;margin-top:8px;color:var(--sub)">Back to plan estimate</button>':'');
  }else{
    actions='<button class="btn" style="width:100%;margin-top:14px" data-action="foodlog" data-i="'+i+'">'+(real?'Ate '+fmtKcal(ea.kcal)+' · edit foods':(isToday?'Log food':'Log food that day'))+'</button>';
  }
  return '<section class="card" style="border-color:var(--accent-text)">'
    +'<div class="spread" style="align-items:flex-start"><div><div class="mini" style="text-transform:uppercase;letter-spacing:.08em;color:'+tagCol+';font-weight:700">'+tag+'</div><b style="font-size:15px">'+longDate(i)+'</b></div>'
    +'<span class="chip c-'+DAYTYPE[e.type].c+'">'+esc(headline(e))+'</span></div>'
    +(moved?'<div class="row" style="margin-top:7px">'+moved+'<span class="mini" style="color:var(--sub)">fuel moved with the session</span></div>':'')
    +'<div class="row" style="align-items:baseline;gap:8px;margin-top:12px"><span class="hero num" style="color:'+heroColor+'">'+heroNum+'</span><span class="sub" style="font-weight:600">'+heroLbl+'</span></div>'
    +gauge+stats
    +'<p class="mini" style="margin:11px 2px 0">'+defNote+'</p>'
    +actions
    +'</section>';
}

/* ====================================================================
   Tracker model (no pre-baked plan): your own deficit target, a learned
   real deficit, a soft daily budget, and a race-day projection from the
   weight trend. The user sets the target via the plan builder below. */
function deficitGoal(){return (S.plan&&S.plan.dailyDeficit!=null)?S.plan.dailyDeficit:700;} // kcal/day target
function expenditure14(){ // learned 14-day mean burn (BMR + active)
  const t=clamp(rawT,0,RACE_IDX);let s=0,n=0;
  for(let i=Math.max(0,t-13);i<=t;i++){const b=dayBurn(i);if(b.burned!=null){s+=b.burned;n++;}}
  return n?Math.round(s/n):null;
}
function budgetAt(i){ // room to eat on day i = expected burn − your deficit target (scales with the day's session)
  const pb=plannedBurn(clamp(i,0,RACE_IDX));
  const exp=pb!=null?pb:expenditure14();
  return exp!=null?Math.max(1500,Math.round(exp-deficitGoal())):null;
}
/* Two questions from one weight trend: (1) where you'll be at RACE DAY (the fixed
   milestone, informational), and (2) your own GOAL weight by your own GOAL DATE
   (which may sit after the race) — the rate needed to make it and the date you'd
   actually hit it at the current trend. */
function raceProjection(){
  const goal=goalWeightVal(),daysLeft=Math.max(0,RACE_IDX-rawT),tw=trendWeight(),lw=latestWeight();
  const curW=tw?tw.lb:(lw?lw.lb:null);
  const gIdx=goalDateIdx(),goalDaysLeft=gIdx-rawT,goalWksLeft=goalDaysLeft/7;
  const base={goal:goal,daysLeft:daysLeft,goalIdx:gIdx,goalDaysLeft:goalDaysLeft,goalIsRace:gIdx===RACE_IDX};
  if(curW==null||(S.weights||[]).length<2)return Object.assign({confident:false,reason:'nodata',curW:curW},base);
  const s=trendSeries().filter(p=>p.i<=clamp(rawT,0,RACE_IDX));
  const span=s.length?s[s.length-1].i-s[0].i:0;
  const rate=trendRate(); // lb/wk, − = losing
  // rate needed to reach the goal weight by the goal date (signed; − = must lose)
  const goalNeededWk=goalWksLeft>0?Math.round((goal-curW)/goalWksLeft*10)/10:null;
  if(s.length<4||span<10||rate==null)
    return Object.assign({confident:false,reason:'early',curW:Math.round(curW*10)/10,goalNeededWk:goalNeededWk,changeSoFar:s.length?Math.round((s[0].lb-curW)*10)/10:0,spanDays:span},base);
  const projLb=Math.round((curW+rate*(daysLeft/7))*10)/10; // race-day weight at the current trend
  // ETA — when, at the current trend, you actually reach the goal weight
  let etaIdx=null;const reached=curW<=goal+0.05;
  if(reached)etaIdx=rawT; else if(rate<-0.02)etaIdx=Math.round(rawT+((curW-goal)/(-rate))*7);
  const goalOnTrack=reached||(etaIdx!=null&&etaIdx<=gIdx);
  return Object.assign({confident:true,curW:Math.round(curW*10)/10,projLb:projLb,rateWk:Math.round(rate*10)/10,
    overGoal:Math.round((projLb-goal)*10)/10,goalNeededWk:goalNeededWk,etaIdx:etaIdx,reached:reached,goalOnTrack:goalOnTrack},base);
}
/* Plan builder — the only "plan" now: set goal weight + a daily deficit target.
   Opened from a link on the Nutrition tab, never the whole screen. */

/* ====================================================================
   Food logging — search OpenFoodFacts, calories only, grouped by meal.
   Items live in S.food[dayIndex]=[{n,k,m}] (m: b|l|d|s) and sum into
   S.ate[dayIndex], the existing 'logged intake' seam everything reads. */
const MEALS=[['b','Breakfast'],['l','Lunch'],['d','Dinner'],['s','Snacks']];
function foodArr(i){return (S.food&&S.food[i])||[];}
function foodTotal(i){return foodArr(i).reduce((s,f)=>s+(f.k||0),0);}
function mealTotal(i,m){return foodArr(i).reduce((s,f)=>s+(f.m===m?(f.k||0):0),0);}
function syncAte(i){ // food log is the source of truth for logged intake
  if(!S.ate||typeof S.ate!=='object')S.ate={};
  if(foodArr(i).length)S.ate[i]=Math.round(foodTotal(i));else delete S.ate[i];
}
function addFood(i,m,name,kcal){
  if(!S.food||typeof S.food!=='object')S.food={};
  if(!Array.isArray(S.food[i]))S.food[i]=[];
  S.food[i].push({n:String(name||'Food').slice(0,60),k:Math.max(0,Math.round(kcal)),m:m});
  syncAte(i);save();
}
function rmFood(i,idx){
  const arr=foodArr(i);if(idx<0||idx>=arr.length)return;
  arr.splice(idx,1);if(!arr.length&&S.food)delete S.food[i];syncAte(i);save();
}
function offKcal100(p){const n=p.nutriments||{};let k=n['energy-kcal_100g'];if(k==null||isNaN(k)){const kj=n['energy_100g'];if(kj!=null&&!isNaN(kj))k=kj/4.184;}k=Math.round(k);return (isFinite(k)&&k>0&&k<900)?k:null;}
function foodSearchRun(){
  const fs=ui.food;if(!fs||!fs.q){return;}
  fs.loading=true;fs.results=null;fs.err=false;foodRefresh();
  const q=fs.q;
  const ctl=('AbortController'in window)?new AbortController():null;
  const to=setTimeout(()=>{if(ctl)ctl.abort();},9000); // OFF can be slow → fall back to manual
  fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=24&fields=product_name,brands,nutriments,serving_size',ctl?{signal:ctl.signal}:undefined)
    .then(r=>{clearTimeout(to);return r.ok?r.json():Promise.reject(0);})
    .then(j=>{
      if(ui.food!==fs||fs.q!==q)return; // a newer search superseded this one
      const out=[];(j.products||[]).forEach(p=>{const k=offKcal100(p);if(k!=null&&p.product_name)out.push({name:String(p.product_name).slice(0,70),brand:String(p.brands||'').split(',')[0].slice(0,32),k100:k});});
      fs.results=out;fs.loading=false;foodRefresh();
    })
    .catch(()=>{clearTimeout(to);if(ui.food===fs){fs.loading=false;fs.results=[];fs.err=true;foodRefresh();}});
}

/* ====================================================================
   Nutrition tab — scale-led. The weight trend is the spine (the judge);
   today is a reactive burned − eaten = deficit readout; food logging is
   optional. No daily plan, no prescriptive budget, no scolding. The old
   Weight tab folds in here (log form + history + backup live below). */
function nutRaceLine(curW){ // a neutral, deficit-based race-day estimate — never a "short of goal" verdict
  const daysLeft=Math.max(0,RACE_IDX-rawT);
  if(curW==null||daysLeft<=0)return '';
  const t=clamp(rawT,0,RACE_IDX);
  let banked=0,days=0; // average over days you actually logged food (real data, not plan estimates)
  for(let k=0;k<=t;k++){if(!ateLogged(k))continue;const bb=dayBurn(k);if(bb.burned==null)continue;banked+=bb.burned-eaten(k).kcal;days++;}
  if(days>=1){
    const avgDef=Math.round(banked/days),proj=Math.round((curW-avgDef*daysLeft/3500)*10)/10;
    const defStr=(avgDef>=0?'−':'+')+fmtKcal(Math.abs(avgDef));
    return '<p class="note" style="margin:10px 0 0;line-height:1.5">At your average <b>'+defStr+'/day</b>, you’re heading for about <b>'+fmtLb(proj)+' lb</b> on race day.</p>';
  }
  const rate=trendRate(); // no logged-food days yet — fall back to the scale trend, still neutral
  if(rate!=null&&Math.abs(rate)>=0.02){
    const proj=Math.round((curW+rate*daysLeft/7)*10)/10;
    return '<p class="note" style="margin:10px 0 0;line-height:1.5">At your current trend, you’re heading for about <b>'+fmtLb(proj)+' lb</b> on race day.</p>';
  }
  return '<p class="mini" style="margin:10px 2px 0;color:var(--sub)">Log your food for a few days and a race-day weight estimate appears here.</p>';
}

function nutTodayBalance(i){ // reactive: what you burned − what you logged = today's deficit

  const num='font-size:24px;font-weight:800;line-height:1',lbl='margin-top:5px;letter-spacing:.05em';

  return '<section class="card">'
    +'<div class="spread" style="align-items:center"><h2 style="margin:0">Today</h2><span class="mini">so far</span></div>'
    +'<div class="row" style="align-items:stretch;gap:6px;margin-top:14px">'
      +'<div style="flex:1;text-align:center"><div class="num" style="'+num+'">'+burnedVal+'</div><div class="mini" style="'+lbl+'">BURNED</div></div>'
      +opDiv+'−</div>'
      +'<div style="flex:1;text-align:center"><div class="num" style="'+num+'">'+eatenVal+'</div><div class="mini" style="'+lbl+'">EATEN</div></div>'
      +opDiv+'=</div>'
      +'<div style="flex:1;text-align:center;background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:6px 2px"><div class="num" style="'+num+';color:'+defCol+'">'+defVal+'</div><div class="mini" style="'+lbl+';color:'+(defVal==='—'?'var(--sub)':defCol)+'">DEFICIT</div></div>'
    +'</div>'
    // the bar carries the relationship: eaten (ink) inside the burn budget; the coloured remainder is the deficit
    +(burned!=null&&hasEat?(function(){
        const def=burned-eatenK,over=eatenK>burned,fill=clamp(eatenK/burned*100,0,100);

          +'<div class="ballbl"><span>Ate '+fmtKcal(eatenK)+'</span><span style="color:'+defCol+'">'+(def>=0?fmtKcal(def)+' deficit':fmtKcal(-def)+' over')+'</span><span>Burn '+(est?'~':'')+fmtKcal(burned)+'</span></div>';
      })():'')
    +(hint?'<p class="mini" style="margin:11px 2px 0;color:var(--sub)">'+hint+'</p>':'')

    +(burned!=null&&b.resting!=null?'<details class="nmath"><summary>How this is worked out</summary>'
        +'<p class="mini" style="margin:6px 2px 0">Burned blends a resting estimate ('+fmtKcal(b.resting)+' kcal, from your profile) with the day’s active calories ('+fmtKcal(b.active)+' kcal — '+(b.measured?'from Oura':'estimated; today’s Oura activity hasn’t synced')+', plus the run). Eaten is your logged food. Deficit is the gap.</p></details>':'')
    +'<button class="btn3" style="margin-top:12px;color:var(--accent-text)" data-action="foodlog" data-i="'+i+'">'+(hasEat?'Edit meals':'+ Log a meal')+'</button>'
    +'</section>';
}
/* ---------------- 9b. Calendar tab ----------------
   A first-class calendar surface: a Month overview of the whole block (each day
   colour-coded by its planned session) and a Week time-grid that places meetings,
   the diarised run/walks and your own added workouts at their real times. Reads
   the same eff()/swapDays()/gcalAgenda the rest of the app does; the only new
   store is S.cal.events — extra sessions (gym, cross-training, physio…) the plan
   itself doesn't carry, keyed by ISO date so they live alongside everything else. */
const CAL_KINDS={
  strength:{label:'Strength',c:'qual',emoji:'🏋️'},
  cross:{label:'Cross-train',c:'rec',emoji:'🚴'},
  mobility:{label:'Mobility',c:'easy',emoji:'🧘'},
  xrun:{label:'Extra run',c:'long',emoji:'🏃'},
  physio:{label:'Physio',c:'warn',emoji:'🩹'},
  other:{label:'Other',c:'blue',emoji:'📌'},
};
function calEvents(){if(!S.cal||typeof S.cal!=='object')S.cal={events:{}};if(!S.cal.events||typeof S.cal.events!=='object')S.cal.events={};return S.cal.events;}
function calEventsOn(iso){const e=calEvents()[iso];return Array.isArray(e)?e:[];}
function calNewId(){return 'ev'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function calAddEvent(iso,ev){const all=calEvents();if(!Array.isArray(all[iso]))all[iso]=[];all[iso].push(ev);save();}
function calUpdateEvent(iso,id,patch){const ev=calEventsOn(iso).find(x=>x.id===id);if(ev){Object.assign(ev,patch);save();}}
function calDeleteEvent(iso,id){const all=calEvents();if(Array.isArray(all[iso])){all[iso]=all[iso].filter(x=>x.id!==id);if(!all[iso].length)delete all[iso];save();}}
function gcalDay(idx){return (gcalAgenda&&gcalAgenda.days)?(gcalAgenda.days.find(d=>d.i===idx)||null):null;}
function calLongDate(iso){const p=iso.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2])),dow=(d.getUTCDay()+6)%7;return DOWL[dow]+' '+p[2]+' '+MONL[p[1]-1]+(p[0]!==2026?' '+p[0]:'');}
function calColor(it){
  if(it.kind==='meeting')return 'var(--raised)';
  if(it.kind==='run'){let z=it.zone;if(!z&&it.idx!=null)z=eff(it.idx).zone;return 'var(--'+(ZONECLR[z]||'easy')+')';}
  if(it.kind==='walk')return 'var(--rec)';
  if(it.kind==='strength')return 'var(--qual)';
  if(it.kind==='learning')return 'var(--blue)';
  if(it.kind==='foot')return 'var(--rest)';
  const k=CAL_KINDS[it.kind];return 'var(--'+((k&&k.c)||'blue')+')';
}
function calShort(t){return esc(String(t||'').slice(0,30));}
function calClean(t){return String(t||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2190}-\u{21FF}\u{FE00}-\u{FE0F}\u{200D}]/gu,'').replace(/\s{2,}/g,' ').replace(/^[\s·•\-–]+/,'').trim();}
function calHourLbl(h){return h===0?'12a':h===12?'12p':h<12?h+'a':(h-12)+'p';}
/* Short label for an app-placed (mine) block: runs collapse to "10k", the rest to one word. */
function calMineLabel(it,idx,short){
  const k=it.kind;
  if(k==='run')return short?(fmtKm(eff(idx).km)+'k'):headline(eff(idx));
  if(k==='walk')return 'Walk';
  if(k==='strength')return 'Strength';
  if(k==='learning')return 'Learning';
  if(k==='foot')return 'Foot & calf';
  return calClean(it.title);
}
/* Side-by-side layout for overlapping events: assigns each item a column index + the
   cluster's column count, so concurrent blocks split the width instead of stacking. */
function calLayout(items){ // items must be pre-sorted by sm
  let grp=[],gEnd=-1;
  const flush=g=>{const ends=[];g.forEach(it=>{let c=0;for(;c<ends.length;c++)if(ends[c]<=it.sm)break;ends[c]=it.em;it.col=c;});const nc=ends.length||1;g.forEach(it=>it.ncols=nc);};
  items.forEach(it=>{if(grp.length&&it.sm>=gEnd){flush(grp);grp=[];gEnd=-1;}grp.push(it);gEnd=Math.max(gEnd,it.em);});
  if(grp.length)flush(grp);
  return items;
}
/* One day as a morning→evening timeline (meetings + training + added workouts), so the
   gaps read at a glance. Full width, no emoji, overlaps laid out side by side. */
function calDayTimeline(idx,iso){
  const items=[],gd=gcalDay(idx);
  if(gd)gd.items.forEach(it=>items.push({sm:it.sm,em:Math.max(it.em,it.sm+20),kind:it.mine?it.kind:'meeting',label:it.mine?calMineLabel(it,idx,false):calClean(it.title),idx:idx}));
  calEventsOn(iso).forEach(ev=>{const mm=ev.time?hhmmToMin(ev.time):null;if(mm!=null)items.push({sm:mm,em:mm+(ev.mins||45),kind:ev.kind,label:calClean(ev.title),idx:idx});});
  if(!items.length)return gcalConnected()
    ?'<p class="note" style="margin:8px 0 0">No meetings or timed workouts today — the day is clear.</p>'
    :'<p class="note" style="margin:8px 0 0">Connect Google Calendar (Settings) to see your meetings here, or add a workout with a time.</p>';
  items.sort((a,b)=>a.sm-b.sm);
  let lo=24*60,hi=0;items.forEach(it=>{lo=Math.min(lo,it.sm);hi=Math.max(hi,it.em);});
  const h0=Math.min(8,clamp(Math.floor(lo/60),5,11)),h1=Math.max(18,clamp(Math.ceil(hi/60),13,23));
  const PXH=44,pxMin=PXH/60,Hpx=(h1-h0)*PXH;
  calLayout(items);
  let gut='';for(let hh=h0;hh<=h1;hh++)gut+='<span class="ghr" style="top:'+((hh-h0)*PXH)+'px">'+calHourLbl(hh)+'</span>';
  let blk='';
  items.forEach(it=>{const top=Math.max(0,(it.sm-h0*60)*pxMin),ht=Math.max(18,(it.em-it.sm)*pxMin),wpc=100/it.ncols,lpc=it.col*wpc;
    blk+='<div class="cdblk'+(it.kind==='meeting'?' mtg':'')+'" style="top:'+top+'px;height:'+ht+'px;left:calc('+lpc+'% + 2px);width:calc('+wpc+'% - 4px);background:'+calColor(it)+'"><b>'+esc(it.label)+'</b><span>'+minToHHMM(it.sm)+'</span></div>';});
  return '<div class="cdtl" style="height:'+Hpx+'px"><div class="cdgut">'+gut+'</div><div class="cdcol">'+blk+'</div></div>';
}
function calYMRange(){const lo=dAt(0),hi=dAt(N_DAYS-1);return [lo.getUTCFullYear()*12+lo.getUTCMonth(),hi.getUTCFullYear()*12+hi.getUTCMonth()];}
function calCurYM(){if(ui.calYM==null){const d=dAt(clamp(rawT,0,N_DAYS-1));ui.calYM=d.getUTCFullYear()*12+d.getUTCMonth();}const r=calYMRange();ui.calYM=clamp(ui.calYM,r[0],r[1]);return ui.calYM;}

function vCal(){
  const seg=v=>'<button class="'+(ui.calView===v?'on':'')+'" data-action="calview" data-v="'+v+'" aria-pressed="'+(ui.calView===v)+'">'+(v==='month'?'Month':'Week')+'</button>';
  return '<div>'+appleNav('Calendar','','opensettings')

    +(ui.calView==='week'?calWeekView():calMonthView())

}

function calMonthView(){
  const ym=calCurYM(),y=Math.floor(ym/12),m=ym%12,r=calYMRange();
  const first=new Date(Date.UTC(y,m,1)),firstDow=(first.getUTCDay()+6)%7;
  const dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  let h='<div class="calbar">'
    +'<div class="calnav"><button data-action="calmonth" data-d="-1"'+(ym<=r[0]?' disabled':'')+' aria-label="Previous month">‹</button></div>'
    +'<b>'+MONL[m]+' '+y+'</b>'
    +'<div class="calnav"><button data-action="calmonth" data-d="1"'+(ym>=r[1]?' disabled':'')+' aria-label="Next month">›</button></div></div>'
    +'<div class="caldow">'+DOW.map(d=>'<span>'+d+'</span>').join('')+'</div>';
  const cells=[];for(let k=0;k<firstDow;k++)cells.push(null);for(let dd=1;dd<=dim;dd++)cells.push(dd);while(cells.length%7)cells.push(null);
  let g='<div class="calgrid">';
  cells.forEach(dd=>{
    if(dd==null){g+='<div class="calcell out" aria-hidden="true"></div>';return;}
    const iso=y+'-'+p2(m+1)+'-'+p2(dd),idx=isoToIdx(iso),inPlan=idx>=0&&idx<N_DAYS;
    const e=inPlan?eff(idx):null,l=e?sessLog(e.id):null,logged=!!(l&&l.status),evs=calEventsOn(iso);
    let cls='calcell';
    if(idx===rawT)cls+=' today';else if(inPlan&&idx<rawT)cls+=' past';
    if(logged)cls+=' logged';
    let inner='<span class="cdate">'+dd+'</span>';
    if(e&&!(e.zone==='Rest'&&e.km<=0)){
      const c=ZONECLR[e.zone]||'rest';
      inner+='<span class="calpill" style="background:var(--'+c+')">'+(isRace(e)?'RACE':fmtKm(e.km)+'k')+'</span>';
    }
    if(evs.length)inner+='<span class="cdots">'+evs.slice(0,4).map(ev=>'<span class="cdot" style="background:'+calColor({kind:ev.kind})+'"></span>').join('')+'</span>';
    if(logged)inner+='<span class="cdone">✓</span>';
    g+='<button class="'+cls+'" data-action="calday" data-iso="'+iso+'">'+inner+'</button>';
  });
  g+='</div>';
  const leg='<div class="callegend">'
    +[['easy','Easy'],['rec','Recovery'],['long','Long / MP'],['qual','Threshold'],['rest','Rest']].map(z=>'<span><i style="background:var(--'+z[0]+')"></i>'+z[1]+'</span>').join('')
    +'<span><i style="background:var(--blue)"></i>Your workout</span></div>';
  return '<div class="calmonth">'+h+g+leg
    +'<button class="btn2" style="width:100%;margin-top:14px" data-action="caladd" data-iso="'+isoAt(clamp(rawT,0,N_DAYS-1))+'">+ Add a workout</button></div>';
}

function calWeekView(){
  const w=clamp(ui.calWeek==null?activeWeekIdx():ui.calWeek,0,15);ui.calWeek=w;
  const wk=WEEKS[w];
  let h='<div class="calbar">'
    +'<div class="calnav"><button data-action="calweeknav" data-d="-1"'+(w<=0?' disabled':'')+' aria-label="Previous week">‹</button></div>'
    +'<b>Week '+wk.n+' · '+esc(wk.phase)+'</b>'
    +'<div class="calnav"><button data-action="calweeknav" data-d="1"'+(w>=15?' disabled':'')+' aria-label="Next week">›</button></div></div>';
  const cols=[];let HMIN=24*60,HMAX=0,anyTimed=false;
  for(let d=0;d<7;d++){
    const idx=w*7+d,iso=isoAt(idx),timed=[],allday=[],gd=gcalDay(idx);
    if(gd){gd.items.forEach(it=>{const mine=it.mine;timed.push({sm:it.sm,em:Math.max(it.em,it.sm+20),kind:mine?it.kind:'meeting',label:mine?calMineLabel(it,idx,true):calClean(it.title),idx:idx});});}
    else{const e=eff(idx);if(!(e.zone==='Rest'&&e.km<=0))allday.push({kind:'run',zone:e.zone,idx:idx,label:fmtKm(e.km)+'k'});}
    calEventsOn(iso).forEach(ev=>{const lbl=calClean(ev.title),mm=ev.time?hhmmToMin(ev.time):null;
      if(mm!=null)timed.push({sm:mm,em:mm+(ev.mins||45),kind:ev.kind,label:lbl,idx:idx});else allday.push({kind:ev.kind,label:lbl,idx:idx});});
    timed.sort((a,b)=>a.sm-b.sm);
    timed.forEach(t=>{anyTimed=true;HMIN=Math.min(HMIN,t.sm);HMAX=Math.max(HMAX,t.em);});
    cols.push({d,idx,iso,timed,allday});
  }
  let hd='<div class="calwk-head"><span class="ccorner"></span>';
  cols.forEach(c=>{hd+='<button class="cwh'+(c.idx===rawT?' td':'')+'" data-action="calday" data-iso="'+c.iso+'"><small>'+DOW[c.d]+'</small><b>'+dAt(c.idx).getUTCDate()+'</b></button>';});
  hd+='</div>';
  let ad='';
  if(cols.some(c=>c.allday.length)){
    ad='<div class="calwk-allday"><span class="ccorner"></span>';
    cols.forEach(c=>{ad+='<div class="calallcol">'+c.allday.map(it=>'<button class="calchip'+(it.kind==='meeting'?' mtg':'')+'" data-action="calday" data-iso="'+c.iso+'" style="background:'+calColor(it)+'">'+esc(it.label)+'</button>').join('')+'</div>';});
    ad+='</div>';
  }
  let body;
  if(anyTimed){
    const h0=clamp(Math.floor(HMIN/60),5,12),h1c=clamp(Math.ceil(HMAX/60),14,23),h1=h1c<=h0?h0+6:h1c,PXH=44,pxMin=PXH/60;
    let gut='<div class="calgutter">';for(let hh=h0;hh<=h1;hh++)gut+='<span class="ghr" style="top:'+((hh-h0)*PXH)+'px">'+calHourLbl(hh)+'</span>';gut+='</div>';
    body='<div class="calwk-grid" style="height:'+((h1-h0)*PXH)+'px">'+gut;
    cols.forEach(c=>{
      calLayout(c.timed);
      let col='<div class="calcol">';
      c.timed.forEach(it=>{const top=Math.max(0,(it.sm-h0*60)*pxMin),ht=Math.max(15,(it.em-it.sm)*pxMin),wpc=100/it.ncols,lpc=it.col*wpc;
        col+='<button class="calblk'+(it.kind==='meeting'?' mtg':'')+'" data-action="calday" data-iso="'+c.iso+'" style="top:'+top+'px;height:'+ht+'px;left:calc('+lpc+'% + 1px);width:calc('+wpc+'% - 2px);background:'+calColor(it)+'">'+esc(it.label)+'</button>';});
      col+='</div>';body+=col;
    });
    body+='</div>';
  }else{
    body='<p class="calwk-empty">Nothing timed this week yet. Runs and added workouts with a set time land on the grid — tap a day to plan one.</p>';
  }
  return '<div class="calweek">'+h+hd+ad+body+'</div>';
}

/* Day detail — the planning hub for one day: the plan session (move / log), your

function openCalDay(iso){ui.calDayISO=iso;openSheet(calDayContent(iso),null,null,'Day');}
function calDayRefresh(){if(!ui.calDayISO)return;const p=document.querySelector('#sheet .panel');if(p){const st=p.scrollTop;p.innerHTML=calDayContent(ui.calDayISO);p.scrollTop=st;}}
function calDayContent(iso){
  const idx=isoToIdx(iso),inPlan=idx>=0&&idx<N_DAYS;
  let html='<h2 style="margin:0 0 2px">'+calLongDate(iso)+'</h2>';
  if(inPlan){
    const e=eff(idx),l=sessLog(e.id);

        +'</div></section>';

  }

      html+='<div class="sheetrow" style="cursor:default;gap:10px;align-items:center">'

        +'<button class="btn3" data-action="caladd" data-iso="'+iso+'" data-id="'+ev.id+'" style="color:var(--sub);padding:4px 8px">Edit</button></div>';});
  }
  html+='<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none;margin-top:14px">Close</button>';

function openMoveSheet(i){
  const e=eff(i),w=e.w;
  let rows='';
  for(let d=0;d<7;d++){
    if(d===e.pos)continue;
    const o=eff(w*7+d);

let sheetTimer=null,sheetOpener=null;
function openSheet(html,morphEl,onReady,label){
  clearTimeout(sheetTimer);
  sheetOpener=document.activeElement;
  const s=document.getElementById('sheet');
  const build=()=>{
    s.innerHTML='<div class="scrim" data-action="closesheet"></div>'
      +'<div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(label||'Dialog')+'" tabindex="-1">'+html+'</div>';
    s.hidden=false;
    if(!label){ // no explicit label → name the dialog after its own visible heading (accessible name = visible title)
      const p=s.querySelector('.panel'),h=p&&p.querySelector('h2,.aTitle');
      if(h){const t=h.textContent.trim();if(t)p.setAttribute('aria-label',t);}
    }
    document.getElementById('app').inert=true; // keep background out of tab/VoiceOver order
    if(onReady)onReady(); // sheet-content wiring MUST wait for build — in the VT path build runs async
  };
  if(morphEl&&document.startViewTransition&&!REDUCE.matches){ // the card morphs into its sheet (Safari 18+)
    morphEl.style.viewTransitionName='sheetmorph';
    const vt=document.startViewTransition(()=>{
      morphEl.style.viewTransitionName='';
      build();
      s.classList.add('open');
      const p=s.querySelector('.panel');
      p.style.viewTransitionName='sheetmorph';
      p.focus();
    });
    vt.finished.then(()=>{const p=s.querySelector('.panel');if(p)p.style.viewTransitionName='';}).catch(()=>{});
  }else{
    build();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{s.classList.add('open');s.querySelector('.panel').focus();}));
  }
}
function closeSheet(){
  ui.settingsOpen=false;ui.agendaOpen=false;ui.calDayISO=null;ui.calForm=null;
  const s=document.getElementById('sheet');
  s.classList.remove('open');
  document.getElementById('app').inert=false;
  clearTimeout(sheetTimer);
  sheetTimer=setTimeout(()=>{s.hidden=true;s.innerHTML='';},230);
  if(sheetOpener&&sheetOpener.isConnected)sheetOpener.focus();
  sheetOpener=null;
}

function appleRings(move,exercise,stand,size){

const view=document.getElementById('view');
function render(anim){ // anim=true only on navigation — entrances must not replay on in-place updates
  const doRender=()=>{
    const skin=skinReg();
    if(!skinHasTab(ui.tab))ui.tab=skin.defaultTab;
    renderTabBar(skin);
    const screen=skin.screens[ui.tab]||skin.screens[skin.defaultTab];
    view.innerHTML=screen();
    if(anim&&!document.startViewTransition&&view.firstElementChild)view.firstElementChild.classList.add('fade');
    fieldDirty=false; // any full render supersedes a pending field re-render
    bindSwipes();bindLongPress();initRulers();bindNutBars();bindChartScrub();
    window.scrollTo(0,ui.scroll[ui.tab]||0);
  };
  if(anim&&document.startViewTransition&&!REDUCE.matches)document.startViewTransition(doRender);
  else doRender();

function bindChartScrub(){ // drag along the weight line, a dot follows with date + trend
  const svg=document.getElementById('wchart');
  if(!svg||svg._scrub||!scrubData||!scrubData.pts.length)return;
  svg._scrub=1;
  const g=()=>svg.querySelector('#scrubg');
  const show=e=>{
    const r=svg.getBoundingClientRect();
    if(!r.width)return;
    const sx=(e.clientX-r.left)*360/r.width;
    let best=null,bd=1e9;
    scrubData.pts.forEach(p=>{const d=Math.abs(p.cx-sx);if(d<bd){bd=d;best=p;}});
    if(!best)return;
    const gr=g();gr.style.display='';
    gr.querySelector('#scrubln').setAttribute('x1',best.cx);
    gr.querySelector('#scrubln').setAttribute('x2',best.cx);
    const dot=gr.querySelector('#scrubdot');
    dot.setAttribute('cx',best.cx);dot.setAttribute('cy',best.cy);
    const tx=gr.querySelector('#scrubtx');
    const tv=trendAt(best.idx);
    tx.setAttribute('x',Math.max(48,Math.min(312,best.cx)));
    tx.setAttribute('y',scrubData.T+2);
    tx.textContent=isoShort(best.iso)+' · '+fmtLb(best.lb)+' lb'+(tv!=null?' · trend '+fmtLb(tv):'');
  };
  svg.addEventListener('pointerdown',e=>{show(e);});
  svg.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')show(e);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{const gr=g();if(gr)gr.style.display='none';}));
}
function rerenderKeepScroll(){
  ui.scroll[ui.tab]=window.scrollY;

function deckSkip(i){

  rerenderKeepScroll();gcalReconcileSoon();
  snack('Skipped · '+headline(e),()=>{

    save();rerenderKeepScroll();gcalReconcileSoon();
  });
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-action]');
  if(!el){ // tapping a card (not a control inside it): imported runs open their run sheet, everything else the log sheet
    const sc=ev.target.closest('[data-swipe="sess"],[data-swipe="deck"]');
    if(sc&&!ev.target.closest('button,input,select,a')){
      const i3=+sc.dataset.i,l3=sessLog(eff(i3).id);
      if(l3&&l3.status&&l3.source==='strava')openRunSheet(i3);else openLogSheet(i3);
      return;
    }
    const dc=ev.target.closest('#view .card[data-day]'); // Training day cards are display-first — tap-through is the detail/edit path
    if(dc&&dc.id&&!ev.target.closest('button,input,select,a')){
      const i4=+dc.id.slice(4),e4=eff(i4);
      if(e4.zone==='Rest'&&e4.km<=0)return; // rest days have nothing to open
      const l4=sessLog(e4.id);
      if(l4&&l4.status&&l4.source==='strava')openRunSheet(i4);else openLogSheet(i4);
    }
    return;
  }
  const a=el.dataset.action;
  if(a==='tab'){ui.scroll[ui.tab]=window.scrollY;ui.tab=el.dataset.tab;render(true);
    // opening the burn-facing tabs pulls fresh Oura active calories (short throttle, so today's number keeps up)
    if((el.dataset.tab==='nut'||el.dataset.tab==='today')&&ouraConnected()&&Date.now()-ouraLastTry>120000)ouraSync(false);}
  else if(a==='status'){
    const id=el.dataset.sid,st=el.dataset.status,cur=sessLog(id)||{};
    if(cur.status===st){logSession(id,{status:null});} // untoggle clears the status; typed km/pace/note are kept (uncounted until re-logged)
    else{
      const patch={status:st};
      if(st==='done'&&cur.km==null){ // prefill the current (rebalanced) target distance
        const m=id.match(/^w(\d+)d(\d+)$/);
        const wq=Number(m[1])-1,posq=orderOf(wq).indexOf(Number(m[2]));
        patch.km=eff(wq*7+posq).km;
      }
      if(st==='missed'&&cur.km==null)patch.km=0;
      logSession(id,patch);
    }
    rerenderKeepScroll();gcalReconcileSoon();
  }
  else if(a==='movestart'){openMoveSheet(Number(el.dataset.i));}
  else if(a==='logsheet'){openLogSheet(Number(el.dataset.i));}
  else if(a==='quickdone'){quickLogDone(Number(el.dataset.i));}
  else if(a==='calview'){ui.calView=el.dataset.v;rerenderKeepScroll();}
  else if(a==='calmonth'){ui.calYM=calCurYM()+Number(el.dataset.d);rerenderKeepScroll();}
  else if(a==='calweeknav'){ui.calWeek=clamp((ui.calWeek==null?activeWeekIdx():ui.calWeek)+Number(el.dataset.d),0,15);rerenderKeepScroll();}
  else if(a==='calday'){openCalDay(el.dataset.iso);}
  else if(a==='caladd'){openCalAdd(el.dataset.iso,el.dataset.id||null);}
  else if(a==='calkind'){calFormCapture();if(ui.calForm)ui.calForm.kind=el.dataset.k;calAddRefresh();}
  else if(a==='calback'){if(ui.calDayISO){ui.calForm=null;openCalDay(ui.calDayISO);}else closeSheet();}
  else if(a==='caldone'){const iso=el.dataset.iso,id=el.dataset.id,ev=calEventsOn(iso).find(x=>x.id===id);if(ev){ev.done=!ev.done;save();}calDayRefresh();rerenderKeepScroll();}
  else if(a==='calsave'){
    calFormCapture();const f=ui.calForm;if(!f)return;
    const title=(f.title||'').trim()||CAL_KINDS[f.kind].label;
    const time=HHMM.test(f.time||'')?f.time:'';
    let mins=parseInt(f.mins,10);mins=isFinite(mins)?clamp(mins,5,600):null;
    const note=(f.note||'').trim().slice(0,140);
    if(f.id)calUpdateEvent(f.iso,f.id,{title:title,kind:f.kind,time:time,mins:mins,note:note});
    else calAddEvent(f.iso,{id:calNewId(),title:title,kind:f.kind,time:time,mins:mins,note:note,done:false});
    const iso=f.iso,wasEdit=!!f.id;ui.calForm=null;rerenderKeepScroll();
    if(ui.calDayISO)openCalDay(iso);else{closeSheet();snack((wasEdit?'Saved · ':'Added · ')+title);}
  }
  else if(a==='caldel'){
    const iso=el.dataset.iso,id=el.dataset.id,ev=calEventsOn(iso).find(x=>x.id===id),snap=ev?Object.assign({},ev):null;
    calDeleteEvent(iso,id);ui.calForm=null;rerenderKeepScroll();
    if(ui.calDayISO)openCalDay(iso);else closeSheet();
    snack('Deleted'+(snap?' · '+snap.title:''),()=>{if(snap){calAddEvent(iso,snap);rerenderKeepScroll();if(ui.calDayISO)calDayRefresh();}});
  }
  else if(a==='deckskip'){deckSkip(Number(el.dataset.i));}
  else if(a==='mopen'){ui.morningOpen=true;rerenderKeepScroll();}
  else if(a==='msave'){
    const v=readRuler('mruler');
    if(v>=120&&v<=280){
      const prev=S.weights.slice();
      logWeight(todayISO(),Math.round(v*10)/10);
      ui.morning=false;ui.morningOpen=false;rerenderKeepScroll();
      snack('Logged '+fmtLb(v)+' lb — good morning',()=>{S.weights=prev;save();ui.morning=true;rerenderKeepScroll();});

  else if(a==='mlater'){ui.morning=false;ui.morningOpen=false;rerenderKeepScroll();}
  else if(a==='rebalsum'){openRebalSummary(Number(el.dataset.w||ui.week));}

    wrappedImage().then(blob=>{
      const w=clamp(Math.floor(rawT/7),0,15);
      const name='berlin26-week'+(w+1)+'.png';
      let file=null;

const NUM_FIELDS={km:1,rpe:1,carbs:1,mins:1};
let fieldDirty=false;
function commitField(el){ // parse + persist one log field (no render)
  const f=el.dataset.field;
  let v=el.value===''?null:(NUM_FIELDS[f]?parseFloat(el.value):el.value);
  if(NUM_FIELDS[f]&&v!=null&&(!isFinite(v)||v<0))v=null;
  logSession(el.dataset.sid,{[f]:v});
}
function flushFieldRender(){ // re-render only once focus has left the log fields — keeps the iOS keyboard up between inputs
  setTimeout(()=>{
    const ae=document.activeElement;
    if(fieldDirty&&!(ae&&ae.dataset&&ae.dataset.field)){fieldDirty=false;rerenderKeepScroll();}
  },80);
}
/* save-as-you-type: half-typed notes survive even a force-quit */
let typeTimer=null;
function flushActiveField(){
  const ae=document.activeElement;
  if(ae&&ae.dataset&&ae.dataset.field&&ae.dataset.sid){clearTimeout(typeTimer);commitField(ae);fieldDirty=true;}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushActiveField();});
addEventListener('pagehide',flushActiveField);
document.addEventListener('focusout',ev=>{if(ev.target.dataset&&ev.target.dataset.field)flushFieldRender();});
document.addEventListener('change',ev=>{
  const el=ev.target,a=el.dataset.action;
  if(el.dataset.field&&el.dataset.sid){
    commitField(el);
    fieldDirty=true;flushFieldRender();
  }
  else if(a==='nutweekfilter'){ui.nutWeek=el.value;const b=document.getElementById('nutbody');if(b)b.innerHTML=nutTableBody();}
  else if(a==='nutgddate'){if(!S.plan)S.plan={};const x=isoToIdx(el.value);if(isFinite(x)){S.plan.goalDate=isoAt(clamp(Math.round(x),rawT+14,rawT+728));save();nutGoalRefresh();rerenderKeepScroll();}}
  else if(a==='nutgwv'){if(!S.plan)S.plan={};const v=parseFloat(el.value);if(isFinite(v)){S.plan.goalWeight=clamp(Math.round(v*10)/10,150,210);save();nutGoalRefresh();rerenderKeepScroll();}}
  else if(a==='nutdfv'){if(!S.plan)S.plan={};const v=parseFloat(el.value);if(isFinite(v)){S.plan.dailyDeficit=clamp(Math.round(v),200,1200);save();nutGoalRefresh();rerenderKeepScroll();}}
  else if(a==='foodgv'){if(ui.food&&ui.food.pick){const v=Math.round(parseFloat(el.value));if(isFinite(v)){ui.food.grams=clamp(v,5,2000);el.value=ui.food.grams;const kc=document.getElementById('foodkc');if(kc)kc.textContent=fmtKcal(Math.round(ui.food.pick.k100*ui.food.grams/100));}}}
  else if(a==='pcval'){const c=PC_SECTIONS[ui.pcOpen];if(!c)return;const p=c.parse(el.value);if(p!=null&&isFinite(p)){ui.pcVal=clamp(p,c.min,c.max);const pv=document.getElementById('pcpreview');if(pv)pv.innerHTML=pcPreviewBlock();}}
  else if(a==='pcpacev'){if(!S.plan)S.plan={};if(!S.plan.paceShift)S.plan.paceShift={};const z=el.dataset.z,v=clamp(Math.round(parseFloat(el.value))||0,-60,60);if(v===0)delete S.plan.paceShift[z];else S.plan.paceShift[z]=v;save();pcRefresh();rerenderKeepScroll();}
  else if(a==='fittime'){const f=fitCfg(),k=el.dataset.k;if(HHMM.test(el.value)){f[k]=el.value;save();gcalReconcileSoon();}else el.value=f[k];}
  else if(a==='fitnum'){const f=fitCfg(),k=el.dataset.k,lim={stepGoal:[2000,30000],ambientSteps:[0,20000],walkDaysAhead:[0,14]}[k];let v=Math.round(parseFloat(el.value));if(!isFinite(v))v=f[k];if(lim)v=clamp(v,lim[0],lim[1]);f[k]=v;el.value=v;save();rerenderKeepScroll();gcalReconcileSoon();}
  else if(a==='fitfree'){const f=fitCfg();f.freeTitles=String(el.value).slice(0,200);save();gcalReconcileSoon();}
  else if(a==='gcaltime'){const key=el.dataset.key,dur=+el.dataset.dur||30,mm=hhmmToMin(el.value);if(mm==null)return;
    gcalTimes()[key]=mm;save();
    if(gcalAgenda&&gcalAgenda.days)gcalAgenda.days.forEach(d=>{d.items.forEach(it=>{if(it.key===key){it.sm=mm;it.em=mm+dur;}});d.items.sort((x,y)=>x.sm-y.sm);}); // optimistic + keep chronological
    gcalAgendaRefresh();gcalReconcileSoon();}
  else if(a==='stravaday'){
    const p=stravaPend[Number(el.dataset.idx)];
    if(p){p.i=Number(el.value);stravaSheetRefresh();}
  }
  else if(el.id==='importfile'&&el.files&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const data=JSON.parse(fr.result);
        if(!data||typeof data.sessions!=='object'||!Array.isArray(data.weights))throw 0;
        const clean=Object.assign(freshState(),sanitizePayload(data),{lastBackup:S.lastBackup,hideInstallTip:S.hideInstallTip,theme:S.theme,widgets:S.widgets});
        if(confirm('Replace current logs with this backup? (A daily snapshot of the current data is kept on this device.)')){S=clean;save();render();}
      }catch(e){alert('That file doesn’t look like a Berlin 2026 backup.');}
      el.value='';
    };
    fr.readAsText(el.files[0]);
  }
});

function showFieldErr(id){
  const inp=document.getElementById(id),er=document.getElementById(id+'-err');
  if(inp){inp.setAttribute('aria-invalid','true');inp.focus();}
  if(er)er.hidden=false;
}

function doExport(text,name,type,isBackup){
  // share sheet first — blob-anchor downloads are unreliable in iOS standalone PWAs
  const done=()=>{if(isBackup){S.lastBackup=todayISO();save();rerenderKeepScroll();}};
  let file=null;
  try{file=new File([text],name,{type:type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    navigator.share({files:[file]}).then(done).catch(()=>{}); // user cancel = no backup credit
  }else{
    const u=URL.createObjectURL(new Blob([text],{type:type}));
    const aEl=document.createElement('a');
    aEl.href=u;aEl.download=name;document.body.appendChild(aEl);aEl.click();
    setTimeout(()=>{URL.revokeObjectURL(u);aEl.remove();},400);
    done();
  }
}

function buildCSV(){
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const wmap={};S.weights.forEach(w=>{wmap[w.date]=w.lb;});
  const head=['date','week','phase','day','zone','day_type','planned_km','status','actual_km','pace','moving_s','start','hr_avg','hr_max','cadence_spm','elev_m','run_kcal','gear','carbs_g','duration_min','note','kcal_target','protein_g','carbs_target_g','fat_g','burn_kcal','deficit_kcal','plan_weight_lb','logged_weight_lb','moved'];
  const lines=[head.join(',')];
  for(let i=0;i<N_DAYS;i++){
    const e=eff(i),l=sessLog(e.id)||{};
    lines.push([isoAt(i),e.w+1,e.wk.phase,DOW[e.pos],e.zone,DAYTYPE[e.type].label,e.planKm,
      l.status||'',l.km!=null?l.km:'',l.pace||'',
      l.secs!=null?l.secs:'',l.start||'',l.hrA!=null?l.hrA:'',l.hrM!=null?l.hrM:'',l.cad!=null?Math.round(l.cad*2):'',l.elev!=null?l.elev:'',l.kcal!=null?l.kcal:'',l.gear||'',
      l.carbs!=null?l.carbs:'',l.mins!=null?l.mins:'',l.note||'',
      e.kcal,e.p,e.carbs,e.fat,e.burn,e.deficit,e.planWt,wmap[isoAt(i)]!=null?wmap[isoAt(i)]:'',e.moved?'yes':''].map(q).join(','));
  }
  return lines.join('\n');
}

document.addEventListener('input',ev=>{

  if(el.dataset&&el.dataset.field&&el.dataset.sid){

function qaRow(action,i,label){
  return '<button class="sheetrow" data-action="'+action+'"'+(i!=null?' data-i="'+i+'"':'')+' style="justify-content:center;font-weight:700;color:var(--ink)">'+label+'</button>';
}
function openRebalSummary(w){
  let rows='';
  for(let d=0;d<7;d++){
    const e=eff(w*7+d),bits=[];
    if(e.kmAdj)bits.push((e.kmAdj>0?'+':'−')+fmtKm(Math.abs(e.kmAdj))+' km');
    if(e.nutEdited)bits.push('kcal edited to '+fmtKcal(e.kcal));
    else if(e.nutAdj)bits.push((e.nutAdj>0?'+':'−')+fmtKcal(Math.abs(e.nutAdj))+' kcal');
    if(e.moved)bits.push('moved from '+DOW[e.op]);
    if(bits.length)rows+='<div class="sheetrow" style="cursor:default"><span class="d">'+DOW[d]+'</span><span class="t">'+bits.join(' · ')+'</span></div>';
  }
  openSheet('<h2 style="margin:0">Week '+(w+1)+' rebalance</h2>'
    +(rows||'<p class="note" style="margin:10px 0 0">Everything sits on plan this week.</p>')
    +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Close</button>');
}

document.addEventListener('longpress',ev=>{
  const tr=ev.target.closest('.rtrack'); // long-press the tape = flip to keyboard entry
  if(tr){const r=tr.closest('.ruler');if(r)rulerToKeyboard(r.id);return;}
  const card=ev.target.closest('.card[data-day]'); // long-press a Training day card = lift and drag
  if(card&&ui.tab==='train'&&!ev.target.closest('button,input,select')){
    startDayDrag(card,ev.detail.x,ev.detail.y);
    return;
  }
  const qa=ev.target.closest('[data-qa]'); // quick-action menus, no visible chrome
  if(!qa||ev.target.closest('button,input,select'))return;
  const t=qa.dataset.qa;
  if(t==='sess'){
    const i=+qa.dataset.i;
    openSheet('<h2 style="margin:0">'+shortDate(i)+'</h2>'
      +qaRow('quickdone',i,'Log done as planned')+qaRow('logsheet',i,'Open the log sheet')+qaRow('movestart',i,'Move this day')
      +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Cancel</button>');
  }else if(t==='wt'){
    openSheet('<h2 style="margin:0">Weight</h2>'
      +qaRow('wtopen',null,'Log weight')+qaRow('export',null,'Back up data')
      +qaRow('exportcsv',null,'Export CSV')+qaRow('pasteingest',null,'Paste from Shortcut')
      +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Cancel</button>');
  }else if(t==='week'){
    const w=+qa.dataset.w;
    openSheet('<h2 style="margin:0">Week '+(w+1)+'</h2>'
      +qaRow('rebalsum',null,'Rebalance summary')+(weekMoved(w)?qaRow('resetweek',null,'Reset week to plan'):'')
      +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Cancel</button>',null);
    document.querySelectorAll('#sheet [data-action="rebalsum"],#sheet [data-action="resetweek"]').forEach(b=>b.dataset.w=w);
  }
});

document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&nutDragRevert){nutDragRevert();return;}
  if(ev.key==='Escape'&&document.getElementById('wrap')){closeWrapped();return;}
  if(ev.key==='Escape'&&!document.getElementById('sheet').hidden){closeSheet();return;}
  if(ev.key==='Enter'||ev.key===' '){
    const t=ev.target.closest&&ev.target.closest('tr[data-action],[role="button"][data-action]');
    if(t){ev.preventDefault();t.click();}
  }
});

/* Shortcut hand-off: opening <app-url>#log=<base64 JSON> merges a full payload, or the bare
   <app-url>#steps=<n> sets today's steps — the zero-backend bridge for Apple Health via iOS
   Shortcuts. (Only reaches THIS app if the link opens it; otherwise use Paste from Shortcut.) */
if(location.hash.indexOf('#log=')===0||location.hash.indexOf('#steps=')===0){
  try{
    const isSteps=location.hash.indexOf('#steps=')===0;
    const raw=isSteps?location.hash.slice(7):atob(decodeURIComponent(location.hash.slice(5)));
    const res=mergePayload(parseIngest(raw),'shortcut');
    history.replaceState(null,'',location.pathname+location.search);
    const bits=[];
    if(res.weights)bits.push(res.weights+' weight'+(res.weights===1?'':'s'));
    if(res.sessions)bits.push(res.sessions+' session log'+(res.sessions===1?'':'s'));
    if(res.health)bits.push('steps');
    if(bits.length){
      const msg='Imported '+bits.join(' and ')+' from Health.';
      setTimeout(()=>{snack(msg);if(res.health)gcalReconcileSoon();},300); // fresh steps → re-size walks
    }
  }catch(e){}
}

render(true);

/* Ask WebKit to exempt this origin from storage eviction — 16 weeks of logs live here */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* Keep "today" honest when the app is resumed rather than reloaded */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshToday();});
addEventListener('pageshow',refreshToday);
addEventListener('focus',refreshToday);

/* ---------------- 10b. Strava + Google Calendar boot ---------------- */
/* OAuth return: Strava AND Google both redirect back here with ?code=. The state param
   tells them apart (state=strava / state=gcal); legacy Strava grants carry no state. */
const oauthQS=new URLSearchParams(location.search);
const oauthState=oauthQS.get('state')||'';
if(oauthQS.get('code')||oauthQS.get('error')){
  history.replaceState(null,'',location.pathname+location.hash);
  const oauthCode=oauthQS.get('code');
  if(oauthState==='gcal'){ // Google Calendar
    if(oauthCode){
      fetch(GCAL_PROXY+'/gcal/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:oauthCode,redirect_uri:GCAL_REDIRECT})})
        .then(r=>{if(!r.ok)throw 0;return r.json();})
        .then(d=>{
          if(!d.access_token)throw 0;
          gcalSave({access:d.access_token,refresh:d.refresh_token||null,expiresAt:d.expires_at,scope:d.scope||null,needsAuth:0,err:null});
          const g=gcalMeta();g.lastSync=null;g.note=null;save();
          snack('Google Calendar connected · primary');
          rerenderKeepScroll();
          if(!d.refresh_token)snack('Connected, but Google sent no refresh token — remove the app at myaccount.google.com/permissions, then reconnect.');
          gcalReconcile({manual:true,announce:true});
        })
        .catch(()=>snack('Couldn’t finish connecting Google Calendar — try again in a minute.'));
    }
  }else{ // Strava (state=strava or legacy no-state grant)
    const stravaScope=oauthQS.get('scope')||'';
    if(oauthCode){ // no code = cancelled on Strava's page; nothing to do
      fetch(STRAVA_PROXY+'/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:oauthCode})})
        .then(r=>{if(!r.ok)throw 0;return r.json();})
        .then(d=>{
          if(!d.access_token||!d.refresh_token)throw 0;
          stravaSave({access:d.access_token,refresh:d.refresh_token,expiresAt:d.expires_at,athlete:d.athlete||null,lastSync:null,note:null,err:null,needsAuth:0});
          snack('Strava connected'+(d.athlete&&d.athlete.firstname?' as '+d.athlete.firstname:''));
          rerenderKeepScroll();
          if(stravaScope&&stravaScope.indexOf('activity:read')<0)snack('Strava connected without activity access — disconnect, reconnect, and leave every permission ticked.');
          else stravaSync(false);
        })
        .catch(()=>snack('Couldn’t finish connecting Strava — try again in a minute.'));
    }
  }
}else{
  if(stravaConnected())setTimeout(()=>stravaSync(false),600); // routine sync on open
  if(gcalConnected())setTimeout(()=>gcalReconcile({}),1700);  // reconcile on open
}
/* …and on resume, throttled — iOS PWAs resume far more often than they reload */
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&stravaConnected()&&Date.now()-stravaLastTry>15*60000)stravaSync(false);
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&gcalConnected()&&Date.now()-gcalLastTry>15*60000)gcalReconcile({});
});

/* Oura rides the same rhythm: sync on open and on throttled resume */
if(ouraConnected())setTimeout(()=>ouraSync(false),1200);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&ouraConnected()&&Date.now()-ouraLastTry>15*60000)ouraSync(false);
});
/* The OAuth hop runs the app in iOS's in-app browser, which shares this origin's
   storage — if that context (or another tab) saved newer state while we were
   backgrounded, adopt it instead of clobbering it on the next save. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!storageOK||saveWarned)return;
  try{
    const raw=localStorage.getItem(KEY);
    if(raw&&raw!==JSON.stringify(S)){S=loadState();rerenderKeepScroll();}
  }catch(e){}
});

/* ---------------- 11. PWA ---------------- */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
