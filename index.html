/* ---- run visuals: route shape + pace/HR sparkline, zero dependencies ---- */
function fmtDur(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+p2(m):m)+':'+p2(s%60);}
function decodePoly(str){ // Google encoded polyline → [[lat,lng],...]
  let i=0,lat=0,lng=0;const pts=[];
  while(i<str.length){
    let b,sh=0,r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);
    lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);
    lng+=(r&1)?~(r>>1):(r>>1);
    pts.push([lat*1e-5,lng*1e-5]);
  }
  return pts;
}
/* shared projection bbox across one-or-more polylines, so overlaid routes register */
function routeFrame(polys){
  let latSum=0,n=0,minX=1e18,maxX=-1e18,minY=1e18,maxY=-1e18;
  const all=[];
  polys.forEach(poly=>{try{const pts=decodePoly(poly);if(pts.length>=2){all.push(pts);pts.forEach(p=>{latSum+=p[0];n++;});}}catch(e){}});
  if(!n)return null;
  const kx=Math.cos((latSum/n)*Math.PI/180);
  all.forEach(pts=>pts.forEach(p=>{const x=p[1]*kx,y=-p[0];if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}));
  return {kx:kx,minX:minX,maxX:maxX,minY:minY,maxY:maxY};
}
function routeSVG(poly,big,paint,frame){ // the route as a line — optionally painted by a stream (Where It Hurt), optionally in a shared frame
  if(!poly)return '';
  try{
    let pts=decodePoly(poly);
    if(pts.length<2)return '';
    const step=Math.max(1,Math.ceil(pts.length/300));
    if(step>1)pts=pts.filter((_,ix)=>ix%step===0||ix===pts.length-1);
    const kx=frame?frame.kx:Math.cos((pts.reduce((s,p)=>s+p[0],0)/pts.length)*Math.PI/180); // equirectangular: shrink lng by cos(lat)
    const xs=pts.map(p=>p[1]*kx),ys=pts.map(p=>-p[0]);
    const minX=frame?frame.minX:Math.min.apply(null,xs),maxX=frame?frame.maxX:Math.max.apply(null,xs);
    const minY=frame?frame.minY:Math.min.apply(null,ys),maxY=frame?frame.maxY:Math.max.apply(null,ys);
    const W=big?320:104,H=big?180:84,pad=6;
    const sc=Math.min((W-2*pad)/((maxX-minX)||1e-9),(H-2*pad)/((maxY-minY)||1e-9));
    const ox=(W-(maxX-minX)*sc)/2-minX*sc,oy=(H-(maxY-minY)*sc)/2-minY*sc;
    const P=k=>(xs[k]*sc+ox).toFixed(1)+' '+(ys[k]*sc+oy).toFixed(1);
    let body='';
    const s=paint&&paint.s&&paint.s.length>=4?paint.s:null;
    if(s){ // heat the path: cool accent → amber → red by percentile of the stream
      const vals=s.filter(v=>v>0).slice().sort((a,b)=>a-b);
      const q1=vals[Math.floor(vals.length*0.45)]||0,q2=vals[Math.floor(vals.length*0.8)]||1e9;
      const flat=!(q2>q1); // a near-constant stream has no real spread — read it cool, don't fake a heat gradient
      const col=v=>(v<=0||flat)?'var(--accent)':v<q1?'var(--accent)':v<q2?'var(--long)':'var(--hard)';
      let d='',cur=null;
      for(let k=1;k<pts.length;k++){
        const v=s[Math.min(s.length-1,Math.round((k/(pts.length-1))*(s.length-1)))];
        const c=col(v);
        if(c!==cur){
          if(d)body+='<path d="'+d+'" fill="none" stroke="'+cur+'" stroke-width="'+(big?2.4:2)+'" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>';
          d='M'+P(k-1);cur=c;
        }
        d+='L'+P(k);
      }
      if(d)body+='<path d="'+d+'" fill="none" stroke="'+cur+'" stroke-width="'+(big?2.4:2)+'" stroke-linejoin="round" stroke-linecap="round" opacity="0.92"/>';
    }else{
      let d='';
      for(let k=0;k<pts.length;k++)d+=(k?'L':'M')+P(k);
      body='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>';
    }
    return '<svg viewBox="0 0 '+W+' '+H+'" style="'+(big?'width:100%':'width:'+W+'px;flex:none')+';height:auto;display:block" role="img" aria-label="Route map'+(s?', coloured by effort':'')+'">'+body+'</svg>';
  }catch(e){return '';}
}
function runChart(l,big){ // pace (accent) + HR (hard hue); pauses (v<0.5 m/s) break the line
  const v=l.vS,hr=l.hrS;
  if((!v||v.length<2)&&(!hr||hr.length<2))return '';
  const W=320,H=big?120:84,pad=5;
  let parts='';
  if(v&&v.length>1){
    const pace=v.map(x=>x>=0.5?1000/x:null);
    const vals=pace.filter(x=>x!=null).slice().sort((a,b)=>a-b);
    if(vals.length>1){
      const min=vals[Math.floor(vals.length*0.05)]-15,max=vals[Math.min(vals.length-1,Math.floor(vals.length*0.95))]+15;
      let d='',pen=0;
      pace.forEach((pv,ix)=>{
        if(pv==null){pen=0;return;}
        const x=pad+(W-2*pad)*ix/(pace.length-1);
        const y=pad+(H-2*pad)*((Math.min(Math.max(pv,min),max)-min)/(max-min)); // faster sits higher
        d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);pen=1;
      });
      if(d)parts+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.5"/>';
    }
  }
  if(hr&&hr.length>1){
    const vals=hr.filter(x=>x>30);
    if(vals.length>1){
      const min=Math.min.apply(null,vals)-5,max=Math.max.apply(null,vals)+5;
      let d='',pen=0;
      hr.forEach((x0,ix)=>{
        if(!(x0>30)){pen=0;return;}
        const x=pad+(W-2*pad)*ix/(hr.length-1);
        const y=pad+(H-2*pad)*(1-(x0-min)/(max-min));
        d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);pen=1;
      });
      if(d)parts+='<path d="'+d+'" fill="none" stroke="var(--hard)" stroke-width="1.5" opacity="0.85"/>';
    }
  }
  if(!parts)return '';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Pace and heart rate trace">'+parts+'</svg>'
    +(big?'<p class="mini" style="margin:4px 2px 0"><span style="color:var(--accent)">—</span> pace · <span style="color:var(--hard)">—</span> heart rate</p>':'');
}
function resultMeta(l){ // the quiet second line under the result chips
  const b=[];
  if(l.start)b.push('started '+esc(l.start));
  if(l.cad)b.push(Math.round(l.cad*2)+' spm'); // Strava stores per-leg cadence; the world reads steps/min
  if(l.elev!=null&&l.elev>0)b.push(Math.round(l.elev)+' m climbed');
  if(l.gear)b.push(esc(l.gear));
  return b.join(' · ');
}
function runVisual(l,i){
  const map=routeSVG(l.poly,false,l.hrS?{s:l.hrS}:null),ch=runChart(l,false);
  if(!map&&!ch)return '';
  return '<button data-action="runsheet" data-i="'+i+'" aria-label="Open run details" '
    +'style="display:flex;gap:12px;align-items:center;width:100%;margin-top:10px;background:none;border:1px solid var(--bord);border-radius:12px;padding:10px;cursor:pointer">'
    +map+(ch?'<div style="flex:1;min-width:0">'+ch+'</div>':'')+'</button>';
}
function runSheetContent(i){
  const e=eff(i),l=sessLog(e.id)||{};
  let chips='<div class="row" style="margin-top:8px">'+logChips(l)+'</div>';
  const meta=resultMeta(l);
  let splits='';
  if(l.splits&&l.splits.length){
    let rows='';
    l.splits.forEach((s,ix)=>{
      const m=s[2]||1000;
      rows+='<tr><td>'+(m>=950?(ix+1):(Math.round(m/100)/10))+'</td>'
        +'<td class="num right">'+fmtPace(Math.round(s[0]/(m/1000)))+'</td>'
        +'<td class="num right">'+(s[1]?s[1]:'–')+'</td></tr>';
    });
    splits='<h2 style="margin:16px 0 6px">Splits</h2><div class="scroll-x"><table style="width:100%;min-width:200px"><thead><tr><th>km</th><th class="right">Pace</th><th class="right">HR</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  // Where It Hurt: paint the route by HR or speed; toggle only when both streams exist
  const mode=ui.paintMode||'hr';
  const stream=mode==='pace'?l.vS:l.hrS;
  const canToggle=!!(l.hrS&&l.vS&&l.poly);
  const toggle=canToggle
    ?'<div class="seg" style="margin-top:8px;max-width:220px">'
      +'<button data-action="paintmode" data-v="hr" aria-pressed="'+(mode==='hr')+'" class="'+(mode==='hr'?'selb':'')+'">Heart</button>'
      +'<button data-action="paintmode" data-v="pace" aria-pressed="'+(mode==='pace')+'" class="'+(mode==='pace'?'selb':'')+'">Pace</button></div>'
    :'';
  const paintNote=(stream&&l.poly)?'<p class="mini" style="margin:6px 2px 0">The line is the road; the colour is '+(mode==='pace'?'speed':'effort')+' — <span style="color:var(--accent)">cool</span> → <span style="color:var(--long)">working</span> → <span style="color:var(--hard)">hot</span>.</p>':'';
  let bp='';
  const bpr=(e.zone==='Long'||e.zone==='Marathon')?breakpointOf(l):null;
  if(bpr)bp='<p class="note" style="margin:10px 0 0">'+(bpr.held
    ?'Your stride held the whole way — no breakpoint.'
    :'Stride cracked at km '+bpr.km+' ('+bpr.drift+'% over the run’s rhythm).')+'</p>';
  return '<h2 style="margin:0">'+shortDate(i)+' · '+esc(headline(e))+'</h2>'
    +chips
    +(meta?'<p class="mini" style="margin:6px 2px 0">'+meta+'</p>':'')
    +(l.poly?'<div style="margin-top:12px">'+routeSVG(l.poly,true,stream?{s:stream}:null)+'</div>'+toggle+paintNote:'')

function openRunSheet(i){

/* ---------------- 3c. Oura ----------------
   Additive to Strava: Strava owns the work, Oura owns the body (sleep,
   readiness, HRV, RHR, temperature, burn). The API sends no CORS headers,
   so reads go through the Worker's /oura pass-through; the personal access
   token lives in its own localStorage key — on the phone, never in backups.
   Oura data is ambient measurement, not a training log: it lands in
   S.health without a confirm sheet and never touches sessions/weights. */
const OURA_KEY='berlin2026.oura';
const OURA_PROXY=STRAVA_PROXY+'/oura';
function ouraState(){try{const r=localStorage.getItem(OURA_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function ouraSave(st){try{localStorage.setItem(OURA_KEY,JSON.stringify(st));}catch(e){}}
function ouraPatch(p){const st=ouraState();if(st)ouraSave(Object.assign(st,p));}
function ouraConnected(){return !!ouraState();}
function healthRef(){if(!S.health||typeof S.health!=='object'||!S.health.d)S.health={d:{}};return S.health;}

function ouraFetch(path,token){
  return fetch(OURA_PROXY+path,{headers:{Authorization:'Bearer '+token}})
    .then(r=>{if(r.status===401||r.status===403)throw{auth:1};if(!r.ok)throw{net:1};return r.json();});
}
function ouraFetchAll(path,token,acc,pages){ // follow next_token, bounded
  return ouraFetch(path,token).then(d=>{
    acc=acc.concat((d&&d.data)||[]);
    if(d&&d.next_token&&(pages||0)<3)
      return ouraFetchAll(path+(path.indexOf('?')>=0?'&':'?')+'next_token='+encodeURIComponent(d.next_token),token,acc,(pages||0)+1);
    return acc;
  });
}

let ouraBusy=false,ouraLastTry=0;
function ouraSync(manual){
  const st=ouraState();
  if(!st||ouraBusy)return;
  if(st.needsAuth&&!manual)return;
  ouraBusy=true;ouraLastTry=Date.now();
  const H=healthRef();
  // first sync backfills from a week before the block so baselines exist on day 1
  const startIso=st.lastSync
    ?isoAt(Math.max(-7,isoToIdx(st.lastSync.slice(0,10))-2))
    :isoAt(-7);
  const endIso=todayISO();
  const range='?start_date='+startIso+'&end_date='+endIso;
  const day=iso=>{ // bounded entry accessor: out-of-block writes go to a discarded stub
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso)))return {};
    const i=isoToIdx(iso);
    if(i<-7||i>RACE_IDX)return {};
    return H.d[iso]||(H.d[iso]={});
  };
  const grab=(ep,apply)=>ouraFetchAll('/v2/usercollection/'+ep+range,st.token,[])
    .then(list=>{list.forEach(it=>{if(it)apply(it);});return 1;})
    .catch(err=>{if(err&&err.auth)throw err;return 0;}); // network blips per-endpoint are non-fatal
  Promise.all([
    grab('daily_readiness',it=>{const e=day(it.day);if(it.score!=null)e.rs=Math.round(it.score);
      if(typeof it.temperature_deviation==='number')e.tmp=Math.round(it.temperature_deviation*100)/100;}),
    grab('daily_sleep',it=>{const e=day(it.day);if(it.score!=null)e.ss=Math.round(it.score);}),
    grab('sleep',it=>{const e=day(it.day),dur=it.total_sleep_duration||0;
      if(dur<=(e.slp||0))return; // several records per day (naps) — keep the main sleep
      e.slp=dur;e.deep=it.deep_sleep_duration||0;e.rem=it.rem_sleep_duration||0;
      if(it.efficiency)e.eff=Math.round(it.efficiency);
      if(it.average_hrv)e.hrv=Math.round(it.average_hrv);
      if(it.lowest_heart_rate)e.rhr=Math.round(it.lowest_heart_rate);
      if(it.average_heart_rate)e.ahr=Math.round(it.average_heart_rate);
      if(it.bedtime_start)e.bin=String(it.bedtime_start).slice(11,16);}),
    grab('daily_activity',it=>{const e=day(it.day);
      if(it.active_calories!=null)e.calA=Math.round(it.active_calories);
      if(it.total_calories!=null)e.calT=Math.round(it.total_calories);
      if(it.steps!=null)e.steps=Math.round(it.steps);}),
    grab('daily_stress',it=>{const e=day(it.day);if(it.day_summary)e.str=String(it.day_summary).slice(0,12);}),
    grab('daily_spo2',it=>{const e=day(it.day);
      if(it.spo2_percentage&&it.spo2_percentage.average!=null)e.spo2=Math.round(it.spo2_percentage.average*10)/10;
      if(it.breathing_disturbance_index!=null)e.bdi=Math.round(it.breathing_disturbance_index);}),
    grab('sleep_time',it=>{if(it.optimal_bedtime&&it.optimal_bedtime.start_offset!=null){
      H.btS=Math.round(it.optimal_bedtime.start_offset);H.btE=Math.round(it.optimal_bedtime.end_offset||it.optimal_bedtime.start_offset+2700);}}),
    grab('vO2_max',it=>{if(it.vo2_max!=null)H.vo2=Math.round(it.vo2_max*10)/10;})
  ]).then(oks=>{
    ouraBusy=false;
    const got=oks.reduce((s,x)=>s+x,0);
    save();
    ouraPatch({lastSync:new Date().toISOString(),needsAuth:0,err:null,
      note:got?'synced':'nothing reachable'});
    if(manual&&!got)snack('Couldn’t reach Oura — try again in a minute.');
    rerenderKeepScroll();
  }).catch(err=>{
    ouraBusy=false;
    if(err&&err.auth){
      const wasAuth=!!(ouraState()&&ouraState().needsAuth);
      ouraPatch({needsAuth:1});
      if(!wasAuth||manual)snack('Oura token rejected — reconnect from the Training tab.');
    }else{
      ouraPatch({err:'Couldn’t reach Oura just now.'});
      if(manual)snack('Couldn’t reach Oura — try again in a minute.');
    }
    rerenderKeepScroll();
  });
}

/* 7-day baseline (data days within the previous 14 calendar days) */
function ouraBase(field,iso){
  const H=healthRef(),i0=isoToIdx(iso);
  const vals=[];
  for(let k=i0-1;k>=i0-14&&vals.length<7;k--){
    const e=H.d[isoAt(k)];
    if(e&&e[field]!=null)vals.push(e[field]);
  }
  if(vals.length<3)return null;
  return vals.reduce((s,v)=>s+v,0)/vals.length;
}
/* the amber triad vs baseline: elevated RHR, suppressed HRV, raised temp */
function ouraFlags(iso){
  const H=healthRef(),e=H.d[iso];
  if(!e)return [];
  const out=[];
  const rb=ouraBase('rhr',iso),hb=ouraBase('hrv',iso);
  if(e.rhr!=null&&rb!=null&&e.rhr>=rb+5)out.push('RHR +'+Math.round(e.rhr-rb));
  if(e.hrv!=null&&hb!=null&&e.hrv<=hb*0.85)out.push('HRV −'+Math.round((1-e.hrv/hb)*100)+'%');
  if(e.tmp!=null&&e.tmp>=0.3)out.push('temp +'+e.tmp.toFixed(1)+'°');
  return out;
}
function fmtSleep(sec){const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h+'h '+p2(m)+'m';}
function offClock(off){const s=((off%86400)+86400)%86400;return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60));}

function openOuraSheet(){
  openSheet('<h2 style="margin:0">Connect Oura</h2>'
    +'<p class="note" style="margin:6px 0 2px">Create a token at cloud.ouraring.com → Personal Access Tokens, then paste it here. It stays on this phone and is never part of backups.</p>'
    +'<div class="shsec"><label class="f" for="ouratok">Personal access token</label>'
    +'<input id="ouratok" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste token"></div>'
    +'<p class="mini" id="ouraerr" hidden style="margin:6px 2px 0;color:var(--hard)">Oura rejected that token — check it was copied whole.</p>'
    +'<button class="btn" style="width:100%;margin-top:14px" data-action="ouraconnectsave">Connect</button>'
    +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Cancel</button>',
    null,()=>{const t=document.getElementById('ouratok');if(t)t.focus();});
}
function ouraCard(){
  const st=ouraState();
  if(!st)return '<section class="card"><div class="spread"><h2 style="margin:0">Oura</h2><span class="chip neutral">Not connected</span></div>'
    +'<p class="note" style="margin:8px 0 0">Sleep, readiness, HRV and burn land beside your runs — recovery for the body Strava can’t see.</p>'
    +'<button class="btn2" style="width:100%;margin-top:10px" data-action="ouraconnect">Connect Oura</button></section>';
  return '<section class="card"><div class="spread"><h2 style="margin:0">Oura</h2>'

    +'<p class="mini" style="margin:8px 2px 0">'+(st.lastSync?'Last sync: '+fmtSyncTime(st.lastSync):'Not synced yet')+'</p>'
    +(st.err?'<p class="mini" style="margin:2px 2px 0">'+esc(st.err)+'</p>':'')
    +(st.needsAuth
      ?'<button class="btn2" style="width:100%;margin-top:10px" data-action="ouraconnect">Reconnect Oura</button>'
      :'<button class="btn2" style="width:100%;margin-top:10px" data-action="ourasync">Sync now</button>')

/* ---------------- 3d. Derived intelligence ----------------
   Pure functions crossing the plan, Strava and Oura. Computed live from S —
   nothing here is stored, so every improvement re-reads history for free. */

/* HR anchors: highest max seen in imports (fallback 185), Oura RHR baseline */
function hrAnchors(){
  let mx=0;
  for(const k in S.sessions){const l=S.sessions[k];if(l&&l.hrM>mx)mx=l.hrM;}
  const rb=ouraBase('rhr',todayISO())||((healthRef().d[todayISO()]||{}).rhr)||55;
  return {max:Math.max(mx,185),rest:Math.min(rb,90)};
}
/* Banister TRIMP per session; zone-typical HR reserve when a run has no HR */
const ZONE_HRR={Recovery:0.58,Easy:0.66,Long:0.73,Marathon:0.80,Threshold:0.85,Interval:0.89};
function trimpOf(l,e){
  if(!l||!(l.status==='done'||l.status==='partial'))return 0;
  const mins=l.secs?l.secs/60:(l.km?l.km*6.2:(l.mins||0));
  if(!mins)return 0;
  const a=hrAnchors();
  const hrr=l.hrA?clamp((l.hrA-a.rest)/(a.max-a.rest),0.3,0.98):(ZONE_HRR[e.zone]||0.66);
  return mins*hrr*0.64*Math.exp(1.92*hrr);
}
/* fitness (42d) / fatigue (7d) / form, day by day from block start */
function formSeries(){
  const t=clamp(rawT,0,RACE_IDX),out=[];
  let ctl=0,atl=0;
  for(let i=0;i<=t;i++){
    const e=eff(i),tr=trimpOf(sessLog(e.id),e);
    ctl+=(tr-ctl)/42;atl+=(tr-atl)/7;
    out.push({i:i,trimp:Math.round(tr),ctl:ctl,atl:atl,tsb:ctl-atl});
  }
  return out;
}
function formNow(){const s=formSeries();return s.length?s[s.length-1]:null;}
function formWord(tsb){return tsb>5?'fresh':tsb>=-12?'productive':tsb>=-25?'loaded':'deep in the hole';}

/* aerobic cost of a run: beats per kilometre (lower = fitter) */
function beatsPerKm(l){
  if(!l||!l.hrA||!(l.km>3)||!l.secs)return null;
  return l.hrA*(l.secs/l.km)/60;
}

/* did last night bank yesterday's work? judged against 7-day baselines */
function absorption(i){
  if(i<0||i>RACE_IDX)return null; // out of block → nothing to absorb (and eff(-1) would throw)
  const e=eff(i),l=sessLog(e.id);
  if(!l||l.status!=='done')return null;
  if(trimpOf(l,e)<15)return null; // nothing meaningful to absorb
  const nIso=isoAt(i+1),h=healthRef().d[nIso];
  if(!h)return null;
  const hb=ouraBase('hrv',nIso),rb=ouraBase('rhr',nIso);
  let pts=0,max=0;
  if(h.hrv!=null&&hb){max++;if(h.hrv>=hb*0.95)pts++;}
  if(h.rhr!=null&&rb){max++;if(h.rhr<=rb+3)pts++;}
  if(h.deep!=null){max++;if(h.deep>=3600)pts++;}
  if(h.slp!=null){max++;if(h.slp>=25200)pts++;}
  if(max<2)return null;
  const r=pts/max;
  return r>=0.75?{label:'absorbed',cls:'c-easy'}:r>=0.5?{label:'mostly absorbed',cls:'c-long'}:{label:'still owing',cls:'c-hard'};
}

/* route signature: 32 distance-resampled points + centroid, for loop matching */
const _sigCache={};
function routeSig(poly){
  if(!poly)return null;
  const key=poly; // full string — lossless memo key (capped at 12000 chars on store)
  if(_sigCache[key]!==undefined)return _sigCache[key];
  let out=null;
  try{
    const pts=decodePoly(poly);
    if(pts.length>=8){
      const kx=Math.cos(pts[0][0]*Math.PI/180)*111320,ky=110540;
      const xy=pts.map(p=>[p[1]*kx,p[0]*ky]);
      let tot=0;const cum=[0];
      for(let k=1;k<xy.length;k++){tot+=Math.hypot(xy[k][0]-xy[k-1][0],xy[k][1]-xy[k-1][1]);cum.push(tot);}
      if(tot>=400){
        const sig=[];
        for(let s2=0;s2<32;s2++){
          const d=tot*s2/31;let k=1;
          while(k<cum.length-1&&cum[k]<d)k++;
          const f=(d-cum[k-1])/((cum[k]-cum[k-1])||1);
          sig.push([xy[k-1][0]+f*(xy[k][0]-xy[k-1][0]),xy[k-1][1]+f*(xy[k][1]-xy[k-1][1])]);
        }
        const cx=sig.reduce((a,p)=>a+p[0],0)/32,cy=sig.reduce((a,p)=>a+p[1],0)/32;

function sigMatch(a,b){ // same road? near centroid + aligned shape, either direction

  if(Math.abs(a.len-b.len)>Math.max(a.len,b.len)*0.25)return false;
  const md=rev=>{let s=0;for(let k=0;k<32;k++){const q=b.p[rev?31-k:k];s+=Math.hypot(a.p[k][0]-q[0],a.p[k][1]-q[1]);}return s/32;};

/* every imported run grouped by matching route, oldest first */
function loopGroups(){
  const runs=[];

    const e=eff(i),l=sessLog(e.id);

      const sig=routeSig(l.poly);
      if(sig)runs.push({i:i,l:l,sig:sig});
    }
  }
  const groups=[];

}
/* nearest logged weight to a day index, within three weeks */
function weightAt(i){

  return (best&&bd<=21)?best.lb:null;
}
/* the loop group containing run i (if it's a repeat of an earlier route) */
function loopOf(i){
  const groups=loopGroups();

  return (g&&g.runs.length>=2)?g:null;
}
/* "same road, smaller engine" — current visit vs the first, only when truly better */
function loopReveal(i){
  const g=loopOf(i);if(!g)return null;
  const idx=g.runs.findIndex(r=>r.i===i);
  if(idx<=0)return null; // the first visit has nothing to beat
  const first=g.runs[0],cur=g.runs[idx];
  const dPace=Math.round(first.l.secs/first.l.km-cur.l.secs/cur.l.km); // s/km, +=faster now
  const dHr=(first.l.hrA&&cur.l.hrA)?Math.round(first.l.hrA-cur.l.hrA):null; // +=lower now
  // a weight is only "at" a run if logged within a week of it — else don't attribute the delta
  const nearW=idx=>{let b=null,bd=1e9;S.weights.forEach(w=>{const d=Math.abs(isoToIdx(w.date)-idx);if(d<bd){bd=d;b=w;}});return bd<=7?b.lb:null;};
  const w1=nearW(first.i),w2=nearW(cur.i);

    better:dPace>=3||(dHr!=null&&dHr>=3)};
}
function loopRevealLine(i){
  const r=loopReveal(i);if(!r)return '';
  const name=r.g.name?esc(r.g.name):'this loop';
  const bits=[];
  if(r.dPace>=3)bits.push(r.dPace+' s/km faster');
  else if(r.dPace<=-3)bits.push(Math.abs(r.dPace)+' s/km slower');
  if(r.dHr!=null&&Math.abs(r.dHr)>=2)bits.push(Math.abs(r.dHr)+' bpm '+(r.dHr>0?'lower':'higher'));
  if(r.dW!=null&&Math.abs(r.dW)>=0.3)bits.push(fmtLb(Math.abs(r.dW))+' lb '+(r.dW>0?'lighter':'heavier'));
  const lead=r.better?'Same road, smaller engine':'Same road';
  return '<p class="note" style="margin:10px 0 0"><b>'+name+'</b> · visit '+r.visit+'. '+lead
    +(bits.length?': '+bits.join(', ')+' than your first.':'.')+'</p>';

/* two route shapes overlaid in one box — first run as a hairline ghost under the latest */
function loopGhostSVG(g){
  const p0=g.runs[0].l.poly,p1=g.runs[g.runs.length-1].l.poly;

/* ---- The Specimen Drawer: every route at one true scale ---- */
function runsWithRoutes(){
  const out=[];
  for(let i=0;i<=clamp(rawT,0,RACE_IDX);i++){
    const e=eff(i),l=sessLog(e.id);
    if(l&&l.status==='done'&&l.poly&&l.source==='strava')out.push({i:i,e:e,l:l});
  }

}
function runMeters(poly){ // route points in local metres + centroid + max dimension
  try{
    const pts=decodePoly(poly);if(pts.length<2)return null;
    const kx=Math.cos(pts[0][0]*Math.PI/180)*111320,ky=110540;
    let xy=pts.map(p=>[p[1]*kx,-p[0]*ky]);
    const step=Math.max(1,Math.ceil(xy.length/160));if(step>1)xy=xy.filter((_,k)=>k%step===0||k===xy.length-1);
    let a=1e18,b=-1e18,c=1e18,d=-1e18;
    xy.forEach(p=>{a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]);});
    return {xy:xy,cx:(a+b)/2,cy:(c+d)/2,dim:Math.max(b-a,d-c)||1};
  }catch(e){return null;}
}
function specimenCard(){
  const runs=runsWithRoutes();

  return '<section class="card"><div class="spread"><h2 style="margin:0">The drawer</h2><span class="chip neutral">'+runs.length+' runs</span></div>'

}
function openDrawerSheet(){

  const gmax=Math.max.apply(null,runs.map(r=>r.m.dim))||1;
  const cell=92,pad=10,gsc=(cell-2*pad)/gmax;
  let cells='';
  runs.forEach(r=>{
    const d=r.m.xy.map((p,k)=>(k?'L':'M')+(cell/2+(p[0]-r.m.cx)*gsc).toFixed(1)+' '+(cell/2+(p[1]-r.m.cy)*gsc).toFixed(1)).join('');
    cells+='<button data-action="runsheet" data-i="'+r.i+'" aria-label="'+shortDate(r.i)+', '+fmtKm(r.l.km)+' km" '

      +'<div class="mini" style="padding:2px 0 5px;text-align:center">'+fmtKm(r.l.km)+'k</div></button>';

/* ---- The Departure Board: nights + run-starts on a 24h dial, one ring per week ---- */

/* ---- Ghost Light: replay the run vs the plan's pace along the route ---- */
function ghostPathData(poly,W,H,pad){
  try{
    const pts=decodePoly(poly);if(pts.length<2)return '';
    const kx=Math.cos(pts[0][0]*Math.PI/180);
    const xs=pts.map(p=>p[1]*kx),ys=pts.map(p=>-p[0]);
    const minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
    const sc=Math.min((W-2*pad)/((maxX-minX)||1e-9),(H-2*pad)/((maxY-minY)||1e-9));
    const ox=(W-(maxX-minX)*sc)/2-minX*sc,oy=(H-(maxY-minY)*sc)/2-minY*sc;
    let d='';for(let k=0;k<pts.length;k++)d+=(k?'L':'M')+(xs[k]*sc+ox).toFixed(1)+' '+(ys[k]*sc+oy).toFixed(1);
    return d;
  }catch(e){return '';}
}
function ghostBlock(i){
  const l=sessLog(eff(i).id);
  if(!l||!l.poly||!l.vS||l.vS.length<4)return '';
  const d=ghostPathData(l.poly,320,180,16);
  if(!d)return '';
  return '<h2 style="margin:16px 0 6px">Ghost run</h2>'
    +'<svg id="ghostsvg" aria-hidden="true" viewBox="0 0 320 180" style="width:100%;height:auto;display:block;border:1px solid var(--line-soft);border-radius:12px;background:var(--bg)">'
    +'<path id="ghostroute" d="'+d+'" fill="none" stroke="var(--bord)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle id="ghostplan" r="4" fill="none" stroke="var(--sub)" stroke-width="1.5" opacity="0.85"/>'
    +'<circle id="ghostyou" r="4.5" fill="var(--accent)"/></svg>'
    +'<div class="row" style="margin-top:6px;align-items:center"><button class="btn3" data-action="ghostplay" data-i="'+i+'">▷ Replay</button>'
    +'<span class="mini" style="color:var(--sub)">you (blue) vs the plan’s pace (grey ghost)</span></div>';
}
let _ghostRaf=null;
function stopGhost(){if(_ghostRaf){cancelAnimationFrame(_ghostRaf);_ghostRaf=null;}}
function mountGhost(i,autoplay){
  stopGhost();
  const l=sessLog(eff(i).id);
  if(!l||!l.poly||!l.vS||l.vS.length<4)return;
  const path=document.getElementById('ghostroute'),you=document.getElementById('ghostyou'),plan=document.getElementById('ghostplan');
  if(!path||!you||!plan)return;
  let total=0;try{total=path.getTotalLength();}catch(e){return;}
  if(!total)return;
  const v=l.vS,cum=[0];for(let k=1;k<v.length;k++)cum.push(cum[k-1]+Math.max(0,+v[k]||0));
  const cmax=cum[cum.length-1]||1;
  const fracAt=p=>{const x=p*(v.length-1),k=Math.floor(x),f=x-k,lo=cum[k]||0,hi=cum[k+1]!=null?cum[k+1]:lo;return (lo+f*(hi-lo))/cmax;};
  const hr=l.hrS||[],hv=hr.filter(x=>x>30).slice().sort((a,b)=>a-b);
  const q1=hv.length?hv[Math.floor(hv.length*0.45)]:0,q2=hv.length?hv[Math.floor(hv.length*0.8)]:1e9;
  const hcol=p=>{if(!hr.length||!(q2>q1))return 'var(--accent)';const x=hr[Math.round(p*(hr.length-1))]||0;return x<q1?'var(--accent)':x<q2?'var(--long)':'var(--hard)';};
  const planSecs=(zoneMid(eff(i).zone)||360)*l.km,R=(l.secs&&planSecs)?l.secs/planSecs:1;
  const setAt=(el,frac)=>{const pt=path.getPointAtLength(Math.max(0,Math.min(1,frac))*total);el.setAttribute('cx',pt.x);el.setAttribute('cy',pt.y);};
  const draw=p=>{setAt(you,fracAt(p));you.setAttribute('fill',hcol(p));setAt(plan,Math.min(1,p*R));};
  if(REDUCE.matches){draw(1);return;} // reduced motion: rest at the finish however invoked
  const DUR=9000;let start=null;
  const frame=now=>{
    if(!document.getElementById('ghostsvg')){stopGhost();return;} // sheet closed mid-run
    if(start==null)start=now;
    let p=(now-start)/DUR;if(p>1)p=1;
    draw(p);
    if(p<1)_ghostRaf=requestAnimationFrame(frame);
  };
  draw(0);_ghostRaf=requestAnimationFrame(frame);
}

/* glycogen wall: where the tank empties at race effort, given practiced fuelling */
function wallModel(){
  const lw=latestWeight();
  if(!lw)return null;
  const kg=lw.lb/2.2046;
  let kcal=0,km=0,best=0;
  for(const k in S.sessions){
    const l=S.sessions[k];
    if(l&&l.kcal&&l.km>4){kcal+=l.kcal;km+=l.km;}
    const fr=fuelRate(l);
    if(fr&&fr>best)best=fr;
  }
  const perKm=km>10?kcal/km:kg*1.036;
  const store=kg*22;                    // usable glycogen ≈ 22 kcal/kg — an estimate, not a promise
  const intakePerKm=best*4*(4.97/60);   // practiced g/hr at ~4:58/km race pace
  const drainPerKm=perKm*0.75-intakePerKm; // ~75% glycolytic at marathon effort
  if(drainPerKm<=8)return {km:99,ghr:best,uncapped:true};
  return {km:store/drainPerKm,ghr:best,perKm:Math.round(perKm)};
}

/* the km where a long run's stride cracked: efficiency >4% over the run's median, two km straight */
function breakpointOf(l){
  if(!l||!l.splits||l.splits.length<8)return null;
  const ef=l.splits.map(s=>(s[1]&&s[0]&&s[2]>=900)?s[1]*(s[0]/(s[2]/1000))/60:null);
  const vals=ef.filter(x=>x!=null);
  if(vals.length<8)return null;
  const med=vals.slice().sort((a,b)=>a-b)[Math.floor(vals.length/2)];
  for(let k=2;k<ef.length-1;k++)
    if(ef[k]!=null&&ef[k+1]!=null&&ef[k]>med*1.04&&ef[k+1]>med*1.04)
      return {km:k+1,drift:Math.round((ef[k]/med-1)*100),held:false};
  return {km:null,drift:null,held:true};
}

/* the pattern desk: publish a crossing only when the data has earned it */
function patternScan(){
  const t=clamp(rawT,0,RACE_IDX);
  const days=[];
  for(let i=0;i<=t;i++){
    const h=healthRef().d[isoAt(i)],l=sessLog(eff(i).id);
    const ef=beatsPerKm(l);
    if(h)days.push({h:h,ef:ef});
  }
  const tests=[
    {id:'earlybed',label:'pre-22:30 bedtime',
     cond:d=>{if(!d.h.bin)return null;const m=+d.h.bin.slice(0,2)*60+(+d.h.bin.slice(3));return m>=300&&m<=1350;}, // 05:00–22:30 counts as early (post-midnight = late)
     metric:d=>d.ef},
    {id:'sleep730',label:'7h30+ of sleep',cond:d=>d.h.slp!=null?d.h.slp>=27000:null,metric:d=>d.ef},
    {id:'ready80',label:'readiness 80+',cond:d=>d.h.rs!=null?d.h.rs>=80:null,metric:d=>d.ef}
  ];
  let best=null,progress=null;
  tests.forEach(ts=>{
    const yes=[],no=[];
    days.forEach(d=>{
      const c=ts.cond(d),m=ts.metric(d);
      if(c==null||m==null)return;
      (c?yes:no).push(m);
    });
    const n=Math.min(yes.length,no.length);
    if(yes.length>=5&&no.length>=4){
      const my=yes.reduce((a,b)=>a+b,0)/yes.length,mn=no.reduce((a,b)=>a+b,0)/no.length;
      const eff2=(mn-my)/mn;
      if(eff2>=0.03&&(!best||eff2>best.eff))
        best={eff:eff2,text:'Runs after '+ts.label+' average '+Math.round(eff2*100)+'% fewer beats per km ('+yes.length+' vs '+no.length+' runs). The next test writes itself.'};
    }else if(!progress||n>progress.n){ // track the test closest to graduating; cap the shown numerator
      progress={n:n,text:'learning your patterns — '+ts.label+': '+Math.min(yes.length,5)+' of 5 runs banked'};
    }
  });
  return best||progress;
}

/* The Locked City: the real Berlin course as a ribbon. Landmarks render once
   a single long run has covered their distance — the last 10 km can never
   unlock in training, so the Gate stays an outline until race day turns the
   key. Geometry is approximate (a stylized ribbon, not navigation); landmarks
   pin by fraction of path length, so absolute accuracy doesn't matter. */
const BERLIN_COURSE=[[52.5147,13.3500],[52.5152,13.3590],[52.5158,13.3680],[52.5186,13.3745],[52.5200,13.3800],[52.5208,13.3880],[52.5214,13.3990],[52.5219,13.4090],[52.5219,13.4132],[52.5205,13.4240],[52.5185,13.4350],[52.5168,13.4450],[52.5155,13.4540],[52.5120,13.4560],[52.5080,13.4555],[52.5040,13.4520],[52.5010,13.4470],[52.4995,13.4330],[52.4990,13.4180],[52.4960,13.4210],[52.4920,13.4235],[52.4866,13.4247],[52.4868,13.4150],[52.4872,13.4050],[52.4888,13.3930],[52.4903,13.3800],[52.4922,13.3690],[52.4905,13.3600],[52.4870,13.3530],[52.4856,13.3445],[52.4820,13.3400],[52.4770,13.3360],[52.4710,13.3310],[52.4650,13.3265],[52.4590,13.3235],[52.4570,13.3210],[52.4610,13.3140],[52.4680,13.3110],[52.4750,13.3095],[52.4830,13.3070],[52.4900,13.3055],[52.4960,13.3060],[52.4998,13.3075],[52.5020,13.3160],[52.5035,13.3260],[52.5049,13.3350],[52.5022,13.3425],[52.5008,13.3480],[52.5040,13.3520],[52.5062,13.3545],[52.5070,13.3610],[52.5082,13.3690],[52.5096,13.3762],[52.5108,13.3840],[52.5128,13.3905],[52.5158,13.3895],[52.5168,13.3850],[52.5163,13.3777],[52.5155,13.3735]];
const BERLIN_MARKS=[{km:0.4,name:'Victory Column'},{km:1.6,name:'Reichstag'},{km:4.6,name:'TV Tower'},{km:7.2,name:'Frankfurter Tor'},{km:11.4,name:'Kottbusser Tor'},{km:14.2,name:'Hermannplatz'},{km:21.4,name:'Rathaus Schöneberg'},{km:26.1,name:'Steglitz'},{km:31.2,name:'Wilmersdorf'},{km:35.6,name:'Ku’damm'},{km:40.1,name:'Potsdamer Platz'},{km:42.0,name:'Brandenburg Gate'}];

function longestRunKm(){
  let mx=0;
  for(const k in S.sessions){const l=S.sessions[k];if(l&&l.status==='done'&&l.km>mx)mx=l.km;}
  return mx;
}
function cityGeo(W,H,pad){ // course → scaled XY + cumulative distance per point
  const kx=Math.cos(52.5*Math.PI/180);
  const xs=BERLIN_COURSE.map(p=>p[1]*kx),ys=BERLIN_COURSE.map(p=>-p[0]);
  const minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs);
  const minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys);
  const sc=Math.min((W-2*pad)/(maxX-minX),(H-2*pad)/(maxY-minY));
  const ox=(W-(maxX-minX)*sc)/2-minX*sc,oy=(H-(maxY-minY)*sc)/2-minY*sc;
  const P=BERLIN_COURSE.map((p,k)=>[xs[k]*sc+ox,ys[k]*sc+oy]);
  const cum=[0];let tot=0;
  for(let k=1;k<P.length;k++){tot+=Math.hypot(P[k][0]-P[k-1][0],P[k][1]-P[k-1][1]);cum.push(tot);}
  const at=frac=>{ // point at a fraction of total path length
    const d=tot*Math.max(0,Math.min(1,frac));let k=1;
    while(k<cum.length-1&&cum[k]<d)k++;
    const f=(d-cum[k-1])/((cum[k]-cum[k-1])||1);
    return [P[k-1][0]+f*(P[k][0]-P[k-1][0]),P[k-1][1]+f*(P[k][1]-P[k-1][1])];
  };
  return {P:P,cum:cum,tot:tot,at:at};
}
function openCitySheet(){
  const W=330,H=300,g=cityGeo(W,H,18);
  const reach=longestRunKm(),frac=Math.min(reach/42.195,1);
  const wall=wallModel();
  // path split: covered by a single long run vs still locked
  const cut=g.tot*frac,bp2=g.at(frac);
  const bPt=bp2[0].toFixed(1)+' '+bp2[1].toFixed(1);
  let covered='',locked='M'+bPt;
  for(let k=0;k<g.P.length;k++){
    const pt=g.P[k][0].toFixed(1)+' '+g.P[k][1].toFixed(1);
    if(g.cum[k]<=cut)covered+=(covered?'L':'M')+pt;
    else locked+='L'+pt;
  }
  covered+=(covered?'L':'M')+bPt; // meet the locked half exactly at the reach point
  let marks='';
  BERLIN_MARKS.forEach((m,ix)=>{
    const p=g.at(m.km/42.195),open=reach>=m.km;
    const dy=ix%2?14:-8;
    marks+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(open?3:2.4)+'" fill="'+(open?'var(--accent)':'none')+'" stroke="'+(open?'var(--accent)':'var(--sub)')+'" stroke-width="1" opacity="'+(open?1:0.45)+'"/>'
      +'<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+dy).toFixed(1)+'" text-anchor="middle" style="font-size:8px;fill:'+(open?'var(--ink)':'var(--sub)')+';opacity:'+(open?0.95:0.5)+'">'+esc(m.name)+'</text>';
  });
  let wallMark='';
  if(wall&&wall.km<42.2){
    const p=g.at(wall.km/42.195);
    wallMark='<line x1="'+(p[0]-5).toFixed(1)+'" y1="'+(p[1]-5).toFixed(1)+'" x2="'+(p[0]+5).toFixed(1)+'" y2="'+(p[1]+5).toFixed(1)+'" stroke="var(--hard)" stroke-width="2"/>'
      +'<line x1="'+(p[0]-5).toFixed(1)+'" y1="'+(p[1]+5).toFixed(1)+'" x2="'+(p[0]+5).toFixed(1)+'" y2="'+(p[1]-5).toFixed(1)+'" stroke="var(--hard)" stroke-width="2"/>';
  }
  const next=BERLIN_MARKS.find(m=>m.km>reach);
  openSheet('<div class="spread"><h2 style="margin:0">Berlin · the course</h2><span class="chip neutral">longest run '+fmtKm(reach)+' km</span></div>'
    +'<div style="margin-top:12px"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Berlin Marathon course, unlocked to '+fmtKm(reach)+' km">'
    +'<path d="'+locked+'" fill="none" stroke="var(--bord)" stroke-width="2" stroke-linejoin="round" stroke-dasharray="3 3"/>'
    +'<path d="'+covered+'" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'
    +marks+wallMark
    +'</svg></div>'
    +'<p class="note" style="margin:10px 0 0">Solid is ground a single run has covered; the dashed city stays locked until race day'
    +(next?' — '+esc(next.name)+' falls at km '+next.km+'.':'.')+'</p>'
    +(wall?(wall.km<42.2
      ?'<p class="note" style="margin:8px 0 0">The <b style="color:var(--hard)">×</b> is the wall: at your burn rate and '+(wall.ghr?wall.ghr+' g/hr practiced fuelling':'no practiced fuelling yet')+', the tank empties ≈km '+fmtKm(Math.min(wall.km,42))+'. Every g/hr you train your gut to take drags it right — the block’s quietest game is pushing it past 42.2 before the taper. (An estimate, never a promise.)</p>'
      :'<p class="note" style="margin:8px 0 0">At '+wall.ghr+' g/hr practiced, the tank outlasts the distance — the wall is off the course. Keep it there.</p>'):'')
    +'<button class="sheetrow" data-action="closesheet" style="justify-content:center;color:var(--sub);font-weight:700;border:none">Close</button>');
}

/* The Morning Line: the app's first words each day. Facts ranked by
   newsworthiness (deviation × weight); top two composed into one sentence
   whose connective — and/but/so — is picked by whether they agree. */
function morningLine(){
  if(!ouraConnected())return '';
  const iso=todayISO(),h=healthRef().d[iso],e=eff(todayIdx);
  if(!h)return '';
  const hb=ouraBase('hrv',iso),rb=ouraBase('rhr',iso);
  const facts=[];
  if(h.slp)facts.push({w:Math.abs(h.slp-27000)/2700,good:h.slp>=25200,txt:'slept '+fmtSleep(h.slp)});
  if(h.hrv!=null&&hb)facts.push({w:Math.abs(h.hrv-hb)/hb*10,good:h.hrv>=hb*0.95,
    txt:'HRV is '+Math.abs(Math.round(h.hrv-hb))+' '+(h.hrv>=hb?'over':'under')+' baseline'});
  if(h.rhr!=null&&rb)facts.push({w:Math.abs(h.rhr-rb)/3,good:h.rhr<=rb+2,
    txt:'resting HR is '+(h.rhr>rb?Math.round(h.rhr-rb)+' up':'settled')});
  if(h.tmp!=null&&h.tmp>=0.3)facts.push({w:h.tmp*5,good:false,txt:'temperature is +'+h.tmp.toFixed(1)+'°'});
  const ab=absorption(todayIdx-1);
  if(ab)facts.push({w:ab.label==='absorbed'?0.8:2,good:ab.label!=='still owing',
    txt:'yesterday’s work '+(ab.label==='still owing'?'isn’t banked yet':'is banked')});
  const f=formNow();
  if(f&&f.ctl>4)facts.push({w:Math.abs(f.tsb)/8,good:f.tsb>=-12,txt:'form is '+formWord(f.tsb)});
  if(facts.length<2)return '';
  facts.sort((a,b)=>b.w-a.w);
  const A=facts[0],B=facts[1];
  const cap=s2=>s2.charAt(0).toUpperCase()+s2.slice(1);
  const isRest=e.zone==='Rest'&&e.km<=0;
  const sess=isRest?'':headline(e);
  if(isRest)return cap(A.txt)+(A.good===B.good?' and ':' but ')+B.txt+' — a well-placed rest day.';
  if(A.good&&B.good)return cap(A.txt)+' and '+B.txt+', so the '+sess+' gets a green light.';
  if(!A.good&&!B.good)return cap(A.txt)+' and '+B.txt+' — treat the '+sess+' as movement, not a target.';
  if(A.good)return cap(A.txt)+' but '+B.txt+' — keep the '+sess+' honest and unheroic.';
  return cap(A.txt)+', though '+B.txt+', so run the '+sess+' by feel.';
}

/* Is the cut paying? Weekly: deficit banked vs aerobic cost (beats/km) vs HRV. */
function cutPaying(){
  const t=clamp(rawT,0,RACE_IDX),wNow=Math.floor(t/7);
  const med=a=>{if(!a.length)return null;const s2=a.slice().sort((x,y)=>x-y);return s2[Math.floor(s2.length/2)];};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const weeks=[];
  for(let w=Math.max(0,wNow-3);w<=wNow;w++){
    const ef=[],hrv=[];let def=0,counted=0;
    for(let d=0;d<7;d++){
      const i=w*7+d;if(i>t)break;
      const b=beatsPerKm(sessLog(eff(i).id));if(b)ef.push(b);
      const h=healthRef().d[isoAt(i)];if(h&&h.hrv!=null)hrv.push(h.hrv);
      const db=dayBurn(i);if(db.burned!=null){def+=db.burned-eaten(i).kcal;counted++;}
    }
    weeks.push({w:w,ef:med(ef),hrv:avg(hrv),def:counted?Math.round(def):null,n:ef.length});
  }
  const have=weeks.filter(x=>x.ef!=null);
  let verdict=null,cls='neutral';
  if(have.length>=2){
    const a=have[have.length-2],b=have[have.length-1];
    const efD=(b.ef-a.ef)/a.ef,hrvD=(a.hrv&&b.hrv)?(b.hrv-a.hrv)/a.hrv:0;
    if(efD<=-0.01&&hrvD>=-0.03){verdict='paying — cheaper kilometres at steady recovery';cls='c-easy';}
    else if(efD>=0.02||hrvD<=-0.08){verdict='costing — aerobic price rising, consider easing the kcal';cls='c-hard';}
    else{verdict='holding — neither buying speed nor eating recovery yet';cls='c-long';}
  }
  const first=S.weights.length?S.weights[0]:null,twn=trendWeight(),lwn=latestWeight();
  const lost=first?(first.lb-(twn?twn.lb:(lwn?lwn.lb:first.lb))):0;
  return {weeks:weeks,verdict:verdict,cls:cls,lost:lost,raceSecs:Math.round(lost*27)};
}

/* The Berlin forecast — one evolving race-day prediction. Anchored to the goal,
   adjusted by three MEASURED trends: aerobic efficiency (pace at heart rate),
   ballast (projected race weight vs the plan glide), and consistency (mileage
   banked). Projected to race day, damped and capped. The confidence band narrows
   as aerobic runs accrue. Honest: too little data → 'firming up', no false precision. */
function berlinForecast(through){
  const t=clamp(through==null?rawT:through,0,RACE_IDX),goalT=goalSec();
  const samp=[]; // steady aerobic runs only — economy reads cleanest there
  for(let i=0;i<=t;i++){
    const e=eff(i),l=sessLog(e.id);
    if(l&&l.status==='done'&&l.km>3&&(e.zone==='Easy'||e.zone==='Long'||e.zone==='Recovery')){
      const b=beatsPerKm(l);if(b&&b>200&&b<2200)samp.push({i:i,b:b});
    }
  }
  if(samp.length<4||t/7<1.5)
    return {state:'early',n:samp.length,secs:goalT,band:Math.max(150,900-samp.length*150),goalT:goalT};
  const seg=Math.max(2,Math.round(samp.length/3));
  const base=samp.slice(0,seg).reduce((s,x)=>s+x.b,0)/seg;
  const cur=samp.slice(-seg).reduce((s,x)=>s+x.b,0)/seg;
  const spanWk=Math.max(1,(samp[samp.length-1].i-samp[0].i)/7);
  const impSoFar=(base-cur)/base;                 // + = more aerobically efficient now
  // project the trend to race day, damped; economy gains only PARTLY become race-time gains
  const projImp=clamp(impSoFar+(impSoFar/spanWk)*((RACE_IDX-t)/7)*0.35,-0.06,0.08);
  const fitnessSec=clamp(Math.round(-projImp*goalT*0.4),-240,240); // ≤ ±4 min
  const twn=trendWeight();
  const ballastSec=twn?clamp(Math.round((twn.lb-planWtAt(t))*27),-180,180):0; // ~27 s/lb off the glide, ≤ ±3 min
  let plan=0,act=0,wNow=Math.floor(t/7);
  for(let w=0;w<wNow;w++){plan+=effWeekTarget(w);act+=weekActualKm(w);}
  const consistSec=plan>0?clamp(Math.round(clamp(0.97-act/plan,-0.02,0.10)*goalT*0.6),-90,180):0; // mostly penalises missed mileage
  const secs=clamp(goalT+fitnessSec+ballastSec+consistSec,9000,18000);
  return {state:'live',n:samp.length,secs:secs,band:clamp(Math.round(330*(7/(samp.length+3))),50,360),
    goalT:goalT,fitnessSec:fitnessSec,ballastSec:ballastSec,consistSec:consistSec,
    eco:{base:Math.round(base),cur:Math.round(cur),imp:impSoFar}};
}
function fmtFinishT(s){s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+p2(m)+':'+p2(x);}
function forecastMover(f){
  if(f.state==='early')return 'Firming up — a couple more weeks of easy runs and it sharpens.';
  const it=[['fit',f.fitnessSec],['bal',f.ballastSec],['con',f.consistSec]].sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const k=it[0][0],v=it[0][1],faster=v<0;
  if(Math.abs(v)<3)return 'Holding right on the goal.';
  if(k==='fit')return faster?'Your aerobic engine is getting cheaper — that’s where the time is coming from.':'Aerobic economy hasn’t moved yet — the time is hiding in your easy runs.';
  if(k==='bal')return faster?'Running lighter than the glide — the cut is buying you time.':'Carrying weight over the glide is costing time — the cut is the lever.';
  return faster?'Banking the mileage — consistency is paying off.':'Missed mileage is costing time — string the weeks together.';
}

/* ---------------- 4. Derived data ---------------- */

/* ---- week rebalance engine ----
   Life happens: a day's calories or kilometres deviate from plan, and the
   REMAINING days of that week (strictly future, never race day) absorb the
   difference so the week's total stays on plan. Original values are always
   kept and shown alongside. */
function slotAt(j){const w=Math.floor(j/7);return WEEKS[w].days[orderOf(w)[j%7]];}
function nutRowAt(j){const w=Math.floor(j/7);return NUTW[w][orderOf(w)[j%7]];}
function idAt(j){const w=Math.floor(j/7);return 'w'+(w+1)+'d'+orderOf(w)[j%7];}

/* Nutrition: explicit per-date kcal edits (S.nutEdit, keyed by day index).
   Edited day = exact value, carbs flex at 4 kcal/g. Future non-edited days of
   the week share the opposite delta proportionally, capped at ±20%/day,
   floor 1,600 kcal. Race-day fuelling never auto-changes. */
function nutAdjusted(i,n){
  const base={kcal:n[1],carbs:n[2],deficit:n[5]};
  const ed=S.nutEdit?S.nutEdit[i]:null;
  if(ed!=null){
    const d=ed-base.kcal;
    return {kcal:ed,carbs:Math.max(0,base.carbs+Math.round(d/4)),deficit:base.deficit-d,adj:0,edited:true};
  }
  const t=rawTodayIdx();
  if(i<=t||i===RACE_IDX)return {kcal:base.kcal,carbs:base.carbs,deficit:base.deficit,adj:0,edited:false};
  const w=Math.floor(i/7);
  let deltaSum=0;const recips=[];
  for(let d=0;d<7;d++){
    const j=w*7+d,e2=S.nutEdit?S.nutEdit[j]:null;
    if(e2!=null)deltaSum+=e2-nutRowAt(j)[1];
    else if(j>t&&j!==RACE_IDX)recips.push(j);
  }
  if(!deltaSum||recips.indexOf(i)<0)return {kcal:base.kcal,carbs:base.carbs,deficit:base.deficit,adj:0,edited:false};
  const tot=recips.reduce((s,j)=>s+nutRowAt(j)[1],0);
  let share=-deltaSum*base.kcal/tot;
  share=Math.max(-base.kcal*0.2,Math.min(base.kcal*0.2,share));
  share=Math.round(share/10)*10;
  let k=base.kcal+share;
  if(k<1600&&base.kcal>=1600){k=1600;share=k-base.kcal;}
  return {kcal:k,carbs:Math.max(0,base.carbs+Math.round(share/4)),deficit:base.deficit-share,adj:share,edited:false};
}

/* Runs: the delta comes from what was logged (planned minus actual on logged
   days). Future unlogged run days share it proportionally — capped at +20%
   per day (+10% for long runs, the key sessions), −30% downward, race day
   untouchable. */
function runAdjusted(i,km){
  const t=rawTodayIdx();
  if(km<=0||i<=t||i===RACE_IDX)return {km:km,adj:0};
  const w=Math.floor(i/7);
  let delta=0;const recips=[];
  for(let d=0;d<7;d++){
    const j=w*7+d,l=S.sessions[idAt(j)];
    if(j<=t){if(l&&l.status)delta+=slotAt(j)[1]-(Number(l.km)||0);}
    else if(j!==RACE_IDX&&slotAt(j)[1]>0&&!(l&&l.status))recips.push(j);
  }
  if(Math.abs(delta)<0.05||recips.indexOf(i)<0)return {km:km,adj:0};
  const tot=recips.reduce((s,j)=>s+slotAt(j)[1],0);
  const zone=slotAt(i)[0];
  let share=delta*km/tot;
  const up=(zone==='Long'||zone==='Marathon')?0.10:0.20;
  share=Math.max(-km*0.3,Math.min(km*up,share));
  const k=Math.round((km+share)*10)/10;
  return {km:k,adj:Math.round((k-km)*10)/10};
}

/* The effective day at calendar slot i: the session (and its nutrition row,
   which travels with it — §2 of the spec: fuelling follows the day type /
   session, not the calendar date), plus any week-rebalance adjustments.
   Protein is always 185 g. Expected plan weight stays attached to the date. */
/* ---- the living plan: read-seams over the baked constants ----
   Every seam returns the baked value EXACTLY when S.plan holds no edit, so an
   empty plan === the original. Edits are deltas/factors in S.plan, never copies. */
function goalSec(){return (S.plan&&S.plan.raceSecs!=null)?S.plan.raceSecs:12540;} // baked 4:57/km ≈ 3:29
function goalPaceSec(){return goalSec()/42.195;}
function goalLabel(){
  if(!(S.plan&&S.plan.raceSecs!=null))return RACE_GOAL; // untouched → the baked label verbatim
  const s=goalSec(),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h+':'+p2(m)+':'+p2(x)+' · '+fmtPace(Math.round(goalPaceSec()))+'/km';
}
function zoneMid(z){ // numeric mid sec/km; null for zones without one (Strides/Rest) — caller falls back
  const base=ZONE_MID_PACE[z];if(base==null)return null;
  const shift=(S.plan&&S.plan.paceShift&&S.plan.paceShift[z])||0;
  if(S.plan&&S.plan.raceSecs!=null)return Math.round(goalPaceSec()+(base-298))+shift; // offset from marathon pace
  return base+shift; // untouched → baked exactly
}
function zoneRange(z){ // the pace RANGE string; baked verbatim when untouched, else recentred on the new mid
  const base=PACE[z]||'',mid=zoneMid(z);
  const shifted=!!(S.plan&&(S.plan.raceSecs!=null||(S.plan.paceShift&&S.plan.paceShift[z]!=null)));
  if(mid==null||!shifted)return base;
  const m=base.match(/^(\d+:\d\d)[–-](\d+:\d\d)/);
  if(!m)return fmtPace(mid)+'/km';
  const lo=parsePace(m[1]),hi=parsePace(m[2]);
  if(lo==null||hi==null)return fmtPace(mid)+'/km';
  const half=(hi-lo)/2;
  return fmtPace(Math.round(mid-half))+'–'+fmtPace(Math.round(mid+half))+'/km';
}
function currentWeekIdx(){return Math.floor(clamp(rawTodayIdx(),0,RACE_IDX)/7);}
function weekFactor(w){ // edits only ever touch FUTURE, unlocked weeks
  if(w<=currentWeekIdx()||(S.locked&&S.locked[w]))return 1;
  const p=S.plan||{};
  return clamp((p.volPct||1)*((p.volWeek&&p.volWeek[w])||1),0.5,1.3);
}
function planKmAt(i){return slotAt(i)[1]*weekFactor(Math.floor(i/7));}
function effWeekTarget(w){return Math.round(WEEKS[w].target*weekFactor(w));}
function effLong(w){return Math.round(WEEKS[w].long*weekFactor(w)*10)/10;}
function wtWeekAt(w){return (S.plan&&S.plan.goalWeight!=null)?Math.round(planWtAt(w*7+6)*10)/10:WT[w];}
/* a lower goal weight needs a bigger deficit → fewer calories. Scale FUTURE weeks'
   deficit by the ratio of new total loss to baked (21 lb); past/current frozen. */
function deficitFactor(w){
  if(!(S.plan&&S.plan.goalWeight!=null))return 1;
  if(w<=currentWeekIdx()||(S.locked&&S.locked[w]))return 1;
  return clamp((210-S.plan.goalWeight)/(210-189),0.5,1.7);
}
/* the (possibly deficit-scaled) baked nutrition row for day i — feeds eff() before
   the within-week rebalance, so the goal-weight cut never double-counts. */
function planNutRow(i){
  const w=Math.floor(i/7),op=orderOf(w)[i%7],n=NUTW[w][op],df=deficitFactor(w);
  if(df===1)return n;
  const burn=n[4],newDef=Math.round(n[5]*df),newKcal=Math.max(1600,burn-newDef),realDef=burn-newKcal;
  const newCarbs=Math.max(0,n[2]+Math.round((newKcal-n[1])/4)); // carbs flex at 4 kcal/g, protein/fat fixed
  return [n[0],newKcal,newCarbs,n[3],burn,realDef];
}

function eff(i){
  const w=Math.floor(i/7),pos=i%7,op=orderOf(w)[pos];
  const wk=WEEKS[w],s=wk.days[op],n=planNutRow(i);
  const na=nutAdjusted(i,n),ra=runAdjusted(i,planKmAt(i));
  return {i:i,w:w,pos:pos,op:op,moved:op!==pos,wk:wk,
    zone:s[0],km:ra.km,planKm:planKmAt(i),kmAdj:ra.adj,text:s[2],
    type:n[0],kcal:na.kcal,p:185,carbs:na.carbs,fat:n[3],burn:n[4],deficit:na.deficit,
    planKcal:n[1],nutAdj:na.adj,nutEdited:na.edited,
    planWt:wtWeekAt(w),id:'w'+(w+1)+'d'+op};
}
/* the single seam for "what was eaten" — the logged actual if present, else the
   plan target (clearly flagged not-logged so every surface can label it honestly) */
function eaten(i){
  const a=(S.ate&&S.ate[i]!=null)?S.ate[i]:null;
  if(a!=null)return {kcal:a,logged:true};
  if(weekLocked(Math.floor(i/7)))return {kcal:eff(i).kcal,logged:true,accepted:true}; // locked week: plan accepted as fact
  return {kcal:eff(i).kcal,logged:false};
}
function lastAte(i){ // most recent logged intake before day i (to seed the ruler)
  if(!S.ate)return null;
  for(let k=i-1;k>=Math.max(0,i-7);k--)if(S.ate[k]!=null)return S.ate[k];
  return null;
}
function ateLogged(i){return !!(S.ate&&S.ate[i]!=null);} // truly logged (real intake), not plan-accepted
function weekLocked(w){return !!(S.locked&&S.locked[w]);}
function sessLog(id){return S.sessions[id]||null;}
function weekActualKm(w){
  let t=0; // only logged sessions count — km without a status is a draft, not a result
  for(let d=0;d<7;d++){const l=S.sessions['w'+(w+1)+'d'+d];if(l&&l.status&&l.km!=null)t+=Number(l.km)||0;}
  return t;
}
function weekStatus(w){ // w: 0-based
  const rawW=Math.floor(rawTodayIdx()/7);
  if(w===rawW)return ['In progress','p-prog'];
  if(w>rawW)return ['Upcoming','p-up'];
  const r=weekActualKm(w)/effWeekTarget(w);
  if(r>=0.9)return ['Hit','p-hit'];
  if(r>=0.6)return ['Partial','p-partial'];
  return ['Under','p-under'];
}
function planWtAt(i){const g=(S.plan&&S.plan.goalWeight!=null)?S.plan.goalWeight:189;return 210+(g-210)*(i/RACE_IDX);} // linear glide, start → goal weight
function latestWeight(){return S.weights.length?S.weights[S.weights.length-1]:null;}
function trendWeight(){ // trailing 7-day mean — smooths the glycogen/water swings of a carb-periodised cut
  const t=clamp(rawTodayIdx(),0,RACE_IDX);
  const pts=S.weights.filter(w=>{const i=isoToIdx(w.date);return i<=t&&i>t-7;});
  if(pts.length<2)return null;
  return {lb:pts.reduce((s,w)=>s+w.lb,0)/pts.length,n:pts.length};
}
function daysSince(iso){return iso?(isoToIdx(todayISO())-isoToIdx(iso)):Infinity;}
function fuelRate(l){ // long-run fuelling practice: g carbs per hour
  if(!l||!(l.carbs>0)||!(l.mins>0))return null;
  return Math.round(l.carbs/(l.mins/60));
}
function easyDrift(){ // last 3 logged easy/recovery RPEs all ≥6 → the block is biting too hard
  const out=[];
  for(let i=clamp(rawTodayIdx(),0,RACE_IDX);i>=0&&out.length<3;i--){
    const e=eff(i);
    if(e.zone!=='Easy'&&e.zone!=='Recovery')continue;
    const l=sessLog(e.id);
    if(l&&(l.status==='done'||l.status==='partial')&&l.rpe!=null)out.push(l.rpe);
  }
  return out.length===3&&out.every(r=>r>=6);
}
function deltaClass(d){const a=Math.abs(d);return a<=0.5?'easy':(a<=3?'long':'hard');}
function doneCount(){let c=0;for(const k in S.sessions){if(S.sessions[k].status==='done')c++;}return c;}
function streak(){
  let i=clamp(rawTodayIdx(),0,RACE_IDX),n=0;
  // 1 = kept, 2 = neutral (unlogged rest day — doesn't break, doesn't count), 0 = broken
  const st=j=>{
    const e=eff(j),l=sessLog(e.id);
    if(l&&(l.status==='done'||l.status==='partial'))return 1;
    if(e.zone==='Rest'&&(!l||!l.status))return 2;
    return 0;
  };
  if(i>=0&&!(sessLog(eff(i).id)&&sessLog(eff(i).id).status))i--; // today still pending doesn't break
  for(;i>=0;i--){const r=st(i);if(r===1)n++;else if(r===2)continue;else break;}
  return n;
}
function macroPct(e){
  const pk=e.p*4,ck=e.carbs*4,fk=e.fat*9,tot=pk+ck+fk;
  return {p:Math.round(pk/tot*100),c:Math.round(ck/tot*100),f:Math.round(fk/tot*100)};
}
/* km planned in current week on days up to and including today (for on-track) */
function scheduledSoFar(w,todayPos){
  let t=0;for(let d=0;d<=todayPos;d++)t+=eff(w*7+d).km;return t;
}

   One engine, three switchable front-ends. The active skin is persisted on
   S.skin and scopes ALL skin CSS via html[data-skin]. Each skin owns its own
   navigation model + screen set; every skin reuses the same engine selectors
   above (eff/berlinForecast/stravaSync/ouraSync/nutrition/weight…). */
const SKINS=['berlin','whoop','fitbit','apple'];

function setSkin(v){
  if(SKINS.indexOf(v)<0||v===currentSkin())return;
  if(typeof closeSheet==='function')closeSheet();   // don't carry a sheet across skins
  S.skin=v;save();applySkin();applyTheme();
  ui.scroll={};                                   // disjoint tab ids → drop stale scroll
  if(!skinHasTab(ui.tab))ui.tab=skinDefaultTab();

/* The nav is rebuilt only when the tab set changes; otherwise we just retag the
   active button (keeps the original cheap in-place behaviour). A skin may declare
   a center FAB (skin.fab) which floats over the bar. */
function renderTabBar(skin){
  const nav=document.getElementById('tabbar');if(!nav)return;
  const inner=nav.querySelector('.inner');
  const sig=currentSkin()+'|'+skin.tabs.map(t=>t.id).join(',')+'|'+(skin.fab?'fab':'');
  if(nav._sig!==sig){
    inner.style.gridTemplateColumns='repeat('+skin.tabs.length+',1fr)';
    let h='';
    skin.tabs.forEach(t=>{
      h+='<button data-action="tab" data-tab="'+t.id+'" id="tb-'+t.id+'">'+t.icon+'<span class="tlbl">'+esc(t.label)+'</span></button>';
    });
    inner.innerHTML=h;
    // FAB is a direct child of the bar (not the grid) so it centers on the bar, not a cell
    const oldFab=nav.querySelector('.tabfab');if(oldFab)oldFab.remove();
    if(skin.fab){
      const fab=document.createElement('button');
      fab.className='tabfab';fab.dataset.action=skin.fab.action||'fab';
      fab.setAttribute('aria-label',skin.fab.label||'Add');fab.innerHTML=skin.fab.icon;
      nav.appendChild(fab);
    }
    nav._sig=sig;
  }
  skin.tabs.forEach(t=>{
    const b=document.getElementById('tb-'+t.id);if(!b)return;
    const on=ui.tab===t.id;
    b.classList.toggle('sel',on);
    if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
}

function volumeChart(){
  const W=360,H=185,L=26,Rm=4,T=14,B=24,max=90,ih=H-T-B;
  const iw=(W-L-Rm)/16,bw=Math.min(15,iw*0.62);
  let g='';
  [0,30,60,90].forEach(v=>{
    const y=T+ih*(1-v/max);
    g+='<line class="gridline" x1="'+L+'" y1="'+y+'" x2="'+(W-Rm)+'" y2="'+y+'"/>'
      +'<text class="axis" x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>';
  });
  const rawW=Math.floor(rawTodayIdx()/7);
  for(let w=0;w<16;w++){
    const x=L+iw*w+(iw-bw)/2;
    const ph=ih*effWeekTarget(w)/max;
    const act=weekActualKm(w);
    const ah=ih*Math.min(act,max)/max;
    g+='<rect x="'+x+'" y="'+(T+ih-ph)+'" width="'+bw+'" height="'+ph+'" rx="3" fill="var(--track)"/>';
    if(act>0)g+='<rect x="'+(x+bw*0.18)+'" y="'+(T+ih-ah)+'" width="'+(bw*0.64)+'" height="'+ah+'" rx="2.5" fill="var(--accent)"/>';
    if((w+1)===1||(w+1)%4===0)g+='<text class="axis" x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle">W'+(w+1)+'</text>';
    if(w===rawW)g+='<circle cx="'+(x+bw/2)+'" cy="'+(H-3)+'" r="2.4" fill="var(--accent)"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly volume, planned vs actual">'+g+'</svg>'
    +'<div class="legend"><span><i style="background:var(--track)"></i>Planned</span><span><i style="background:var(--accent)"></i>Actual logged</span></div>';
}

function calorieChart(){
  const W=360,H=170,L=30,Rm=3,T=10,B=22,max=6200,ih=H-T-B;
  const bw=(W-L-Rm)/N_DAYS;
  let g='';
  [2000,4000,6000].forEach(v=>{
    const y=T+ih*(1-v/max);
    g+='<line class="gridline" x1="'+L+'" y1="'+y+'" x2="'+(W-Rm)+'" y2="'+y+'"/>'
      +'<text class="axis" x="'+(L-4)+'" y="'+(y+3)+'" text-anchor="end">'+(v/1000)+'k</text>';
  });
  for(let i=0;i<N_DAYS;i++){
    const e=eff(i);
    const h=ih*e.kcal/max,x=L+bw*i;
    g+='<rect class="f-'+DAYTYPE[e.type].c+'" x="'+x+'" y="'+(T+ih-h)+'" width="'+Math.max(bw-0.7,1.4)+'" height="'+h+'" rx="0.8"/>';
  }
  [0,4,8,12].forEach(w=>{
    g+='<text class="axis" x="'+(L+bw*(w*7+3.5))+'" y="'+(H-9)+'" text-anchor="middle">W'+(w+1)+'</text>';
  });
  if(rawT>=0&&rawT<=RACE_IDX){
    const x=L+bw*rawT+bw/2;
    g+='<line x1="'+x+'" y1="'+(T-3)+'" x2="'+x+'" y2="'+(T+ih)+'" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily calorie targets across the block">'+g+'</svg>'
    +'<div class="legend"><span><i style="background:var(--long)"></i>Long-run</span><span><i style="background:var(--hard)"></i>Session</span><span><i style="background:var(--easy)"></i>Easy</span><span><i style="background:var(--rest)"></i>Rest</span></div>';
}

let scrubData=null;
function trendAt(idx){ // 7-day trailing mean at a given day index
  const win=S.weights.filter(w=>{const i=isoToIdx(w.date);return i<=idx&&i>idx-7;});
  return win.length?win.reduce((s,w)=>s+w.lb,0)/win.length:null;
}
function trendRate(){ // lb/week from two adjacent 7-day windows
  const t=clamp(rawTodayIdx(),0,RACE_IDX);
  const now=trendAt(t),prev=trendAt(t-7);
  return (now!=null&&prev!=null)?now-prev:null;
}
function trendNarration(){
  const tw=trendWeight(),r=trendRate();
  if(!tw)return 'Log a few mornings and the trend reads itself.';
  if(r==null)return 'Trend forming — one more week of weigh-ins gives a rate.';
  const planRate=21/16,ar=Math.abs(r);
  let verdict;
  if(r>0.2)verdict='moving the wrong way; tighten the rest days.';
  else if(ar>planRate+0.6)verdict='faster than the plan wants; protect the training, eat the carbs.';
  else if(ar<planRate-0.6)verdict='slower than plan, still fine; the deficit lives on rest days.';
  else verdict='right on the plan’s glide.';
  return 'Trending '+ar.toFixed(1)+' lb/week '+(r<0?'down':'up')+'; plan says ~'+planRate.toFixed(1)+' — '+verdict;
}
function weightChart(){
  const W=360,H=205,L=32,Rm=8,T=12,B=22,ih=H-T-B,iwd=W-L-Rm;
  const pts=S.weights.map(w=>({x:isoToIdx(w.date),y:w.lb,iso:w.date})).filter(p=>p.x>=-7&&p.x<=RACE_IDX+7);
  let lo=188,hi=211;
  pts.forEach(p=>{lo=Math.min(lo,p.y-1);hi=Math.max(hi,p.y+1);});
  lo=Math.floor(lo);hi=Math.ceil(hi);
  const X=i=>L+iwd*clamp(i,0,RACE_IDX)/RACE_IDX;
  const Y=v=>T+ih*(1-(v-lo)/(hi-lo));
  let g='';
  for(let v=Math.ceil(lo/5)*5;v<=hi;v+=5){
    g+='<line class="gridline" x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-Rm)+'" y2="'+Y(v)+'"/>'
      +'<text class="axis" x="'+(L-5)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>';
  }
  [0,4,8,12,15].forEach(w=>{g+='<text class="axis" x="'+X(w*7)+'" y="'+(H-8)+'" text-anchor="middle">W'+(w+1)+'</text>';});
  g+='<line x1="'+X(0)+'" y1="'+Y(210)+'" x2="'+X(RACE_IDX)+'" y2="'+Y(189)+'" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>';
  if(rawT>=0&&rawT<=RACE_IDX)g+='<line x1="'+X(rawT)+'" y1="'+T+'" x2="'+X(rawT)+'" y2="'+(T+ih)+'" stroke="var(--ink)" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>';
  if(pts.length){
    const path=pts.map((p,j)=>(j?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
    if(pts.length>1)g+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="1.4" opacity="0.45" stroke-linejoin="round" stroke-linecap="round"/>';
    // 7-day rolling mean — the line decisions should be made on
    if(pts.length>2){
      const tr=pts.map(p=>{
        const win=pts.filter(q=>q.x<=p.x&&q.x>p.x-7);
        return {x:p.x,y:win.reduce((s,q)=>s+q.y,0)/win.length};
      });
      g+='<path d="'+tr.map((p,j)=>(j?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    pts.forEach(p=>{g+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="3" fill="var(--accent)" stroke="var(--card)" stroke-width="1.4"/>';});
  }
  /* plan milestones: phase starts as quiet ticks on the glide */
  [[28,'Build 1'],[56,'Build 2'],[84,'Peak'],[91,'Taper'],[105,'Race wk']].forEach(ms=>{
    const px=X(ms[0]),py=Y(210+(189-210)*(ms[0]/RACE_IDX));
    g+='<line x1="'+px+'" y1="'+(py-6)+'" x2="'+px+'" y2="'+(py+6)+'" stroke="var(--sub)" stroke-width="1.5" opacity="0.7"><title>'+ms[1]+'</title></line>';
  });
  /* scrub affordances (driven by pointer, hidden until touched) */
  g+='<g id="scrubg" style="display:none"><line id="scrubln" y1="'+T+'" y2="'+(T+ih)+'" stroke="var(--accent)" stroke-width="1" opacity=".5"/>'
    +'<circle id="scrubdot" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>'
    +'<text id="scrubtx" class="axis" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--ink)"></text></g>';
  scrubData={pts:pts.map(p=>({cx:X(p.x),cy:Y(p.y),iso:p.iso,lb:p.y,idx:p.x})),T:T};
  return '<svg id="wchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight, actual vs plan">'+g+'</svg>'
    +'<div class="legend"><span><i style="background:var(--sub)"></i>Plan glide 210 → 189 lb</span><span><i style="background:var(--accent)"></i>Logged · thick line = 7-day trend</span></div>';
}

function ring(pct,size,inner){
  const sw=10,r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.min(Math.max(pct,0),1));
  return '<div class="ringwrap" style="width:'+size+'px;height:'+size+'px">'
    +'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+Math.round(pct*100)+' percent">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/>'
    +'<circle class="ringfg" data-c="'+c.toFixed(1)+'" data-pct="'+Math.min(pct,1).toFixed(3)+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    +'</svg><div class="ringtxt">'+inner+'</div></div>';
}
function logChips(l){

  if(l.hrA)h+='<span class="chip neutral">HR '+l.hrA+(l.hrM?'/'+l.hrM:'')+'</span>';

  if(fr!=null)h+='<span class="chip '+(fr>=60?'c-easy':'c-long')+'">'+fr+' g/hr</span>';
  if(l.note)h+='<span class="chip neutral">'+esc(l.note.slice(0,26))+(l.note.length>26?'…':'')+'</span>';

}

function unloggedPast(){

function goalWeightVal(){return (S.plan&&S.plan.goalWeight!=null)?S.plan.goalWeight:189;}
function planSummary(){

  for(let w=0;w<16;w++){const t=effWeekTarget(w);totalKm+=t;if(t>peakKm){peakKm=t;peakW=w;}}
  const gw=goalWeightVal();
  return {totalKm:totalKm,peakKm:peakKm,peakW:peakW,goalWt:gw,toLose:210-gw,
    phase:WEEKS[clamp(currentWeekIdx(),0,15)].phase,daysToGo:RACE_IDX-todayIdx};
}
function miniBars(){ // the 16-week mileage shape (ramp → peak → taper), current week lit
  const W=320,H=44,T=2,B=2,ih=H-T-B,cw=currentWeekIdx(),bw=W/16;
  const max=Math.max.apply(null,Array.from({length:16},(_,w)=>effWeekTarget(w)))||1;
  let g='';
  for(let w=0;w<16;w++){const t=effWeekTarget(w),h=Math.max(2,ih*t/max),x=w*bw;
    g+='<rect x="'+(x+bw*0.2).toFixed(1)+'" y="'+(T+ih-h).toFixed(1)+'" width="'+(bw*0.6).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1" fill="var(--accent)" opacity="'+(w===cw?1:(w<cw?0.32:0.62))+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin-top:4px" role="img" aria-label="Weekly mileage across the block">'+g+'</svg>';
}
function miniGlide(){ // the weight plan, 210 → goal, current week marked
  const W=320,H=40,T=5,B=5,ih=H-T-B,cw=currentWeekIdx(),g1=goalWeightVal();

    +'<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>'
    +'<circle cx="'+cx.toFixed(1)+'" cy="'+Y(cw).toFixed(1)+'" r="2.8" fill="var(--accent)"/></svg>';

/* ---- the Plan Center: edit the plan's targets (not its shape) on one screen ---- */
function fmtFinish(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+':'+p2(m)+':'+p2(x);}
function planChanged(){const p=S.plan||{};return p.raceSecs!=null||p.goalWeight!=null||p.volPct!=null||(p.volWeek&&Object.keys(p.volWeek).length>0)||(p.paceShift&&Object.keys(p.paceShift).length>0)||p.heatOn===false||!!p.home;}

const PC_SECTIONS={

/* the live preview: how the current (incl. pending) plan looks vs the original */
function pcPreviewBlock(){
  return pcWithPending(()=>{
    const cw=currentWeekIdx();
    // running — 16-week mileage bars (accent = plan now; faint tick = original where changed)
    const W=300,H=48,T=3,B=3,ih=H-T-B,bw=W/16;
    let max=1,nTot=0,bTot=0,nPk=0,bPk=0;const nv=[],bv=[];
    for(let w=0;w<16;w++){const a=effWeekTarget(w),b=WEEKS[w].target;nv.push(a);bv.push(b);max=Math.max(max,a,b);nTot+=a;bTot+=b;nPk=Math.max(nPk,a);bPk=Math.max(bPk,b);}
    let bars='';
    for(let w=0;w<16;w++){const x=w*bw+bw*0.2,wid=bw*0.6,ny=T+ih-ih*nv[w]/max,by=T+ih-ih*bv[w]/max;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+ny.toFixed(1)+'" width="'+wid.toFixed(1)+'" height="'+(T+ih-ny).toFixed(1)+'" rx="1" fill="var(--accent)" opacity="'+(w===cw?1:(w<cw?0.4:0.82))+'"/>';
      if(Math.abs(nv[w]-bv[w])>0.2)bars+='<line x1="'+x.toFixed(1)+'" y1="'+by.toFixed(1)+'" x2="'+(x+wid).toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="var(--sub)" stroke-width="0.9" opacity="0.85"/>';
    }
    const pkTxt=Math.round(nPk)!==Math.round(bPk)?fmtKm(bPk)+'→'+fmtKm(nPk):fmtKm(nPk);
    const totTxt=Math.round(nTot)!==Math.round(bTot)?fmtKm(bTot)+'→'+fmtKm(nTot):fmtKm(nTot);
    // nutrition — weight glide (accent = now; dashed = original) + the calorie consequence
    const gW=300,gH=32,gT=4,gB=4,gih=gH-gT-gB,g1=goalWeightVal();
    const lo=Math.min(189,g1)-1,span=(210-lo)||1,Y=v=>gT+gih*((210-v)/span);
    let nd='',bd='';for(let w=0;w<16;w++){const xx=(w/15)*gW;nd+=(w?'L':'M')+xx.toFixed(1)+' '+Y(wtWeekAt(w)).toFixed(1);bd+=(w?'L':'M')+xx.toFixed(1)+' '+Y(WT[w]).toFixed(1);}
    const goalChanged=S.plan.goalWeight!=null;
    let kDelta=0,nf=0;
    for(let i=(cw+1)*7;i<N_DAYS;i++){const w=Math.floor(i/7);if(w>15)break;const op=orderOf(w)[i%7];kDelta+=NUTW[w][op][1]-eff(i).kcal;nf++;}
    const avgK=nf?Math.round(kDelta/nf):0;
    const kNote=Math.abs(avgK)>=10?'future days ≈ '+fmtKcal(Math.abs(avgK))+' kcal/day '+(avgK>0?'lower':'higher'):'calories on plan';
    let raceLine='';
    if(ui.pcOpen==='race'){const d=zoneMid('Easy')-362;raceLine='<p class="mini" style="margin:5px 2px 0">Every zone '+(d>=0?'+':'')+d+' s/km · finish '+fmtFinish(goalSec())+'</p>';}
    return '<div class="spread" style="align-items:baseline"><span class="mini" style="font-weight:700;color:var(--ink)">Running</span><span class="mini">peak '+pkTxt+' km · '+totTxt+' km</span></div>'
      +'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin-top:3px" role="img" aria-label="Mileage preview">'+bars+'</svg>'+raceLine
      +'<div class="spread" style="align-items:baseline;margin-top:8px"><span class="mini" style="font-weight:700;color:var(--ink)">Nutrition</span><span class="mini">210 → '+fmtLb(g1)+' lb · '+kNote+'</span></div>'
      +'<svg viewBox="0 0 '+gW+' '+gH+'" style="width:100%;height:auto;display:block;margin-top:3px" role="img" aria-label="Weight glide preview">'
      +(goalChanged?'<path d="'+bd+'" fill="none" stroke="var(--sub)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>':'')
      +'<path d="'+nd+'" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>';
  });
}

/* Energy balance: eaten (the day's plan, edits included) vs Total burned.
   Total burned blends two independent estimates — Oura's day total and
   Mifflin-St Jeor BMR ×1.2 from the LATEST weight log plus the day's actual
   Strava run calories — because Oura alone reads high vs Luke's Garmin.
   Oura's running figure only joins the blend once it's plausibly mature
   (≥80% of the formula, or evening), so the number reads sane all day. */
function dayBurn(i){
  const ost=ouraState(),H=healthRef(),iso=isoAt(i),h=H.d[iso];
  const lw=latestWeight();
  const kg=(lw?lw.lb:planWtAt(clamp(i,0,RACE_IDX)))/2.2046;
  let formula=null,run=0,bmr=null;
  if(ost&&ost.h>0&&ost.age>0){
    bmr=10*kg+6.25*(ost.h*100)-5*ost.age+(ost.sex==='female'?-161:5);
    const l=sessLog(eff(i).id);
    if(l&&(l.status==='done'||l.status==='partial'))run=l.kcal!=null?l.kcal:(l.km?Math.round(l.km*kg*1.036):0);
    formula=Math.round(bmr*1.2+run);
  }
  const oura=h&&h.calT?h.calT:null;
  const ouraAct=(oura&&h.calA!=null)?h.calA:null;
  const mature=i<rawT||new Date().getHours()>=20||(oura&&formula&&oura>=formula*0.8);
  const blend=!!(oura&&formula&&mature);
  const burned=blend?Math.round((oura+formula)/2):(formula||oura||null);
  // resting/active split, mirroring the total's blend; active = total − resting so the equation always sums
  let resting=null;
  if(burned!=null){
    if(blend)resting=ouraAct!=null?Math.round((bmr+(oura-ouraAct))/2):Math.round(bmr);
    else if(formula&&burned===formula)resting=Math.round(bmr);
    else if(oura&&ouraAct!=null)resting=oura-ouraAct;
  }
  return {burned:burned,resting:resting,active:resting!=null?burned-resting:null,oura:oura,formula:formula,run:run};
}
function wDeficit(){

      +'<p class="note" style="margin:8px 0 0">Connect Oura (Training tab) and this card tracks eaten vs burned, live.</p></section>';
  const def=b.burned-ea.kcal; // positive = deficit
  const onPlan=Math.abs(def-e.deficit)<=200,real=ateLogged(todayIdx);
  const chip=real?'<span class="chip c-blue">logged</span>'
    :'<span class="chip '+(onPlan?'c-easy':'c-long')+'">'+(onPlan?'on plan':(def>e.deficit?'ahead':'behind'))+' · est</span>';

    ?'Ate '+fmtKcal(ea.kcal)+', burned '+fmtKcal(b.burned)+' — '+fmtKcal(Math.abs(def))+(def>=0?' under':' over')

    }
  }
  return '<section class="card"><div class="spread"><h2>Energy balance</h2>'+chip+'</div>'
    +'<div class="row" style="align-items:baseline;gap:6px"><span class="hero num">'+(def>=0?'−':'+')+fmtKcal(Math.abs(def))+'</span>'
    +'<span class="sub" style="font-weight:600">kcal today · plan −'+fmtKcal(e.deficit)+'</span></div>'
    +'<p class="note" style="margin:8px 0 0">'+sentence+'</p>'
    +'<div class="row" style="gap:18px;margin-top:8px">'
    +(real
      ?'<div><span class="mini">Eaten</span><div class="big num">'+fmtKcal(ea.kcal)+'</div></div>'
      :'<button class="btn3" data-action="gotoate" style="padding:0;text-align:left;display:block"><span class="mini">Eaten · tap to log</span><div class="big num" style="color:var(--sub)">'+fmtKcal(ea.kcal)+'</div></button>')
    +'<div><span class="mini">Burned</span><div class="big num">'+fmtKcal(b.burned)+'</div></div>'
    +'</div>'
    +split+yest
    +'</section>';
}

function wHrvTrend(){
  const H=healthRef();
  const pts=[];
  for(let i=-7;i<=clamp(rawT,0,RACE_IDX);i++){
    const h=H.d[isoAt(i)];
    if(h&&(h.hrv!=null||h.rhr!=null))pts.push({i:i,hrv:h.hrv,rhr:h.rhr});
  }
  if(pts.length<3)
    return '<section class="card"><h2>HRV · resting HR</h2><p class="note" style="margin:0">A few nights of ring data and the block trend appears here.</p></section>';
  const W=360,Hh=130,L=10,R=10,T=12,B=10,iw=W-L-R,ih=Hh-T-B;
  const x0=pts[0].i,x1=pts[pts.length-1].i;
  const X=i=>L+iw*(x1>x0?(i-x0)/(x1-x0):0.5);
  const line=(field,color)=>{
    const vs=pts.filter(p=>p[field]!=null);
    if(vs.length<2)return '';
    let lo=Infinity,hi=-Infinity;
    vs.forEach(p=>{lo=Math.min(lo,p[field]);hi=Math.max(hi,p[field]);});
    lo-=3;hi+=3;
    let d='';
    vs.forEach((p,ix)=>{d+=(ix?'L':'M')+X(p.i).toFixed(1)+' '+(T+ih*(1-(p[field]-lo)/(hi-lo))).toFixed(1);});
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round"/>';
  };
  const last=pts[pts.length-1];
  return '<section class="card"><div class="spread"><h2>HRV · resting HR</h2><div class="row">'
    +(last.hrv!=null?'<span class="chip neutral">HRV '+last.hrv+'</span>':'')
    +(last.rhr!=null?'<span class="chip neutral">RHR '+last.rhr+'</span>':'')+'</div></div>'
    +'<div class="svgwrap"><svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;height:auto;display:block" role="img" aria-label="HRV and resting heart rate trend">'
    +line('hrv','var(--accent)')+line('rhr','var(--hard)')
    +'</svg></div>'
    +'<p class="mini" style="margin:4px 2px 0"><span style="color:var(--accent)">—</span> HRV (up = adapting) · <span style="color:var(--hard)">—</span> resting HR (down = fitter)</p>'
    +'</section>';
}

    :d<0?'<span class="chip c-easy">▲ '+Math.abs(d)+'s faster</span>':'<span class="chip c-hard">▼ '+d+'s slower</span>';
  const vsGoal=Math.round(f.secs-f.goalT);

function setDropTarget(t){

function dayDragMove(e){
  if(!dragSt)return;
  e.preventDefault();
  const dy=e.clientY-dragSt.y0;
  dragSt.card.style.transform='translateY('+dy+'px) scale(1.02) rotate(.4deg)';
  if(e.clientY<130)window.scrollBy(0,-10);
  else if(e.clientY>innerHeight-150)window.scrollBy(0,10);
  dragSt.card.style.pointerEvents='none';
  const below=document.elementFromPoint(e.clientX,e.clientY);
  dragSt.card.style.pointerEvents='';
  const t=below&&below.closest?below.closest('.card[data-day]'):null;
  setDropTarget(t&&t!==dragSt.card?t:null);
}
function dayDragEnd(){
  if(!dragSt)return;
  const card=dragSt.card,target=dragSt.target,w=dragSt.w,pos=dragSt.pos;
  document.removeEventListener('pointermove',dayDragMove);
  document.removeEventListener('pointerup',dayDragEnd);
  document.removeEventListener('pointercancel',dayDragEnd);

/* ---------------- kcal bar drag: direct manipulation of the rebalance engine ---------------- */
let nutDragRevert=null;
function updateNutStrip(){
  const strip=document.getElementById('nutstrip');if(!strip)return;
  const w=+strip.dataset.w;
  const vals=Array.from({length:7},(_,d)=>eff(w*7+d));
  const maxK=Math.max.apply(null,vals.map(e=>e.kcal));
  strip.querySelectorAll('button[data-i]').forEach((b,d)=>{
    const e=vals[d];
    b.querySelector('.nbar i').style.height=Math.round(10+42*e.kcal/maxK)+'px';
    b.querySelector('.k').textContent=(Math.round(e.kcal/100)/10)+'k';
    const del=b.querySelector('.ndelta');
    const dv=e.nutEdited?e.kcal-e.planKcal:e.nutAdj;
    del.textContent=dv?((dv>0?'+':'−')+Math.abs(dv)):'';
  });
}
function bindNutBars(){
  document.querySelectorAll('.nbar.ed').forEach(bar=>{
    if(bar._nb)return;bar._nb=1;
    const i=+bar.dataset.bar;
    let y0=0,active=false,moved=false,base=0,plan=0,prevEdit=null,cur=0;
    bar.addEventListener('pointerdown',e=>{
      y0=e.clientY;active=true;moved=false;
      prevEdit=S.nutEdit[i]!=null?S.nutEdit[i]:null;
      plan=eff(i).planKcal;
      base=prevEdit!=null?prevEdit:plan;
      cur=base;
      nutDragRevert=()=>{
        if(prevEdit!=null)S.nutEdit[i]=prevEdit;else delete S.nutEdit[i];
        active=false;document.body.classList.remove('nutdrag');updateNutStrip();nutDragRevert=null;
      };
      try{bar.setPointerCapture(e.pointerId);}catch(_){}
    });
    bar.addEventListener('pointermove',e=>{
      if(!active)return;
      const dy=y0-e.clientY;
      if(!moved){if(Math.abs(dy)<10)return;moved=true;document.body.classList.add('nutdrag');}
      e.preventDefault();
      let v=base+Math.round(dy*8/25)*25; // ~8 kcal per px, 25 kcal detents
      v=Math.max(1200,Math.min(8000,v));
      if(v!==cur){
        cur=v;haptic();
        if(v===plan)delete S.nutEdit[i];else S.nutEdit[i]=v; // transient until release
        updateNutStrip();
      }
    });
    bar.addEventListener('pointerup',()=>{
      if(!active)return;active=false;
      document.body.classList.remove('nutdrag');nutDragRevert=null;
      if(!moved)return; // plain tap: selection click handles it
      window._nutDragTs=Date.now();
      if((prevEdit!=null?prevEdit:plan)===cur){updateNutStrip();return;}
      hintDone('bar');
      save();rerenderKeepScroll();
      const pe=prevEdit;
      snack(DOW[i%7]+' set to '+fmtKcal(cur)+' kcal — week rebalanced',()=>{
        if(pe!=null)S.nutEdit[i]=pe;else delete S.nutEdit[i];
        save();rerenderKeepScroll();
      });
    });
    bar.addEventListener('pointercancel',()=>{if(nutDragRevert)nutDragRevert();});
  });
}

function weekStats(w){
  const tgt=effWeekTarget(w),act=weekActualKm(w);
  let bigKm=0,bigName='',done=0,fuel=null;
  for(let d=0;d<7;d++){
    const e=eff(w*7+d),l=sessLog(e.id);
    if(l&&l.status){
      if(l.status!=='missed')done++;
      if(l.km>bigKm){bigKm=l.km;bigName=headline(e);}
      const fr=fuelRate(l);if(fr!=null)fuel=fr;

  }
  return {tgt:tgt,act:act,pct:Math.round(act/tgt*100),done:done,bigKm:bigKm,bigName:bigName,fuel:fuel};
}
